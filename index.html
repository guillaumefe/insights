<script>
(() => {
  /* =========================
     Recherche (has/eq/not) + indexation
     ========================= */

  /* ---------- Normalisation ---------- */
  function _safeNormalizeNFKD(s){
    try { return String(s).normalize('NFKD'); }
    catch { return String(s); }
  }

  function normalize(s){ return (s ?? '').toString().toLowerCase(); }

  // Tokenizer avec guillemets et échappements : tokenise(`a "b c" d\"e`)
  function tokenise(q){
    const src = (q ?? '').toString().trim();
    if (!src) return [];
    const out = [];
    const rx = /"((?:\\.|[^"\\])*)"|(\S+)/g; // groupe 1 = entre guillemets, groupe 2 = mot brut
    let m;
    while ((m = rx.exec(src))){
      if (m[1] != null){
        out.push(m[1].replace(/\\(["\\])/g,'$1'));
      } else {
        out.push(m[2]);
      }
    }
    return out;
  }

  // Clé insensible aux accents/casse + nettoyage
  function asKey(s){
    s = _safeNormalizeNFKD(s)
      .replace(/[\u0300-\u036f]/g,'')  // diacritiques
      .toLowerCase()
      .replace(/\s+/g,'-')
      .replace(/[^a-z0-9_-]+/g,'');
    return s;
  }

  /* ---------- Défs de champs (agnostique au schéma) ---------- */
  function getFieldDefs(){
    // Priorité à une liste plate si exposée par App.model
    const flat = App?.model?.TEMPLATE_FIELD_DEFS;
    if (Array.isArray(flat)) return flat;

    if (typeof App?.model?.getFieldDefs === 'function') return App.model.getFieldDefs();

    if (Array.isArray(App?.model?.TEMPLATE)) {
      const out = [];
      for (const section of App.model.TEMPLATE){
        if (Array.isArray(section.fields)) out.push(...section.fields);
      }
      return out;
    }
    return [];
  }

  /* ---------- Résolution d’un champ par nom/label ---------- */
  function fieldByTokenName(tok){
    const k = asKey(tok);
    const defs = getFieldDefs();
    for (const f of defs){
      const byName  = asKey(f.name) === k;
      const byLabel = asKey(f.label || '') === k;
      const byKey   = f.key ? (asKey(f.key) === k) : false; // tolère un éventuel alias "key"
      if (byName || byLabel || byKey) return f;
    }
    return null;
  }

  /* ---------- Existence / Collecte d’occurrences ---------- */
  function fieldExists(def, data){
    if (!data || !def) return false;
    if (Object.prototype.hasOwnProperty.call(data, def.name)) return true;

    // Cherche dans blocs répétables (tableaux d’objets)
    for (const v of Object.values(data)){
      if (!Array.isArray(v)) continue;
      if (v.some(it => it && typeof it === 'object' && Object.prototype.hasOwnProperty.call(it, def.name))) {
        return true;
      }
    }
    return false;
  }

  function collectOccurrences(def, data){
    const out = [];
    const rootVal = data?.[def.name];
    const rawRoot = data?.[def.name + '__raw'];

    if (def.repeatable){
      const arr = Array.isArray(rootVal) ? rootVal : [];
      const raws = Array.isArray(data?.[def.name + '__raw_idx']) ? data[def.name + '__raw_idx'] : [];
      for (let i=0;i<arr.length;i++){
        out.push(def.type==='date' ? (raws[i] ?? arr[i]) : arr[i]);
      }
    } else if (
      Object.prototype.hasOwnProperty.call(data || {}, def.name) ||
      Object.prototype.hasOwnProperty.call(data || {}, def.name + '__raw')
    ){
      out.push(def.type==='date' ? (rawRoot ?? rootVal) : rootVal);
    }

    // Explore tableaux d’objets imbriqués
    for (const v of Object.values(data || {})){
      if (!Array.isArray(v)) continue;
      for (let i=0;i<v.length;i++){
        const it = v[i];
        if (!it || typeof it !== 'object') continue;
        if (Object.prototype.hasOwnProperty.call(it, def.name)){
          const rawIdx = Array.isArray(data?.[def.name + '__raw_idx']) ? data[def.name + '__raw_idx'][i] : undefined;
          out.push(def.type==='date' ? (rawIdx ?? it[def.name]) : it[def.name]);
        }
      }
    }

    // Fichiers listés
    if (def.type === 'file'){
      const listed = Array.isArray(data?.[def.name + '__listed']) ? data[def.name + '__listed'] : [];
      if (listed.length) out.push(...listed);
    }
    return out;
  }

  /* ---------- Comparaison (eq:) ---------- */
  function parseBoolWant(wantKey){
    if (['oui','true','1','yes','vrai'].includes(wantKey))  return true;
    if (['non','false','0','no','faux'].includes(wantKey))  return false;
    return null;
  }

  function someOccurrenceEquals(def, data, wantRaw){
    const occ = collectOccurrences(def, data);
    if (!occ.length) return false;
    const wantKey = asKey(String(wantRaw));

    // Mot-clé pour "valeur absente"
    if (wantKey === 'none' || wantKey === 'undefined' || wantKey === ''){
      return occ.some(v => {
        if (v === undefined || v === null) return true;
        if (def.type === 'checkbox') return v === false;
        if (def.type === 'number'){
          if (v === '') return true;
          const n = Number(v);
          return !Number.isFinite(n);
        }
        if (def.type === 'date') return String(v ?? '').trim() === '';
        return String(v ?? '').trim() === '';
      });
    }

    if (def.type === 'checkbox'){
      const b = parseBoolWant(wantKey);
      if (b === null) return false;
      return occ.some(v => v === b);
    }

    if (def.type === 'number'){
      const wantNum = Number(wantRaw);
      if (Number.isFinite(wantNum)){
        return occ.some(v => Number(v) === wantNum);
      }
      return occ.some(v => asKey(String(v ?? '')) === wantKey);
    }

    if (def.type === 'date'){
      // On compare la représentation brute (YYYY-MM-DD ou texte saisi)
      return occ.some(v => asKey(String(v ?? '')) === wantKey);
    }

    // Texte simple (insensible accents/casse)
    return occ.some(v => asKey(String(v ?? '')) === wantKey);
  }

  /* ---------- Parser de requête: has:/not has: + eq: + texte libre ---------- */
  function parseQueryFromTokens(tokens){
    let q = tokens.join(' ');
    const clauses = [];
    const unescapeQuoted = (s) => s.replace(/\\(["\\])/g, '$1');

    function takeHas(regex){
      q = q.replace(regex, (_, notKw, quoted, bare) => {
        const negate = !!(notKw && /\bnot\b/i.test(notKw));
        const raw = (quoted != null) ? unescapeQuoted(quoted) : bare;
        clauses.push({ negate, fieldTok: raw, value: null });
        return ' ';
      });
    }

    // has: + not has:  (gère les guillemets)
    const RX_HAS = /(?:^|\s)(not\s+)?has:\s*(?:"((?:\\.|[^"\\])*)"|([^\s]+))/gi;
    // eq: attache la valeur à la DERNIÈRE clause
    const RX_EQ  = /(?:^|\s)eq:\s*(?:"((?:\\.|[^"\\])*)"|([^\s]+))/gi;

    takeHas(RX_HAS);

    q = q.replace(RX_EQ, (_, vq, vb) => {
      if (!clauses.length) return ' ';
      const raw = (vq != null) ? unescapeQuoted(vq) : vb;
      // n’écrase pas si déjà posé (dernier wins, mais on garde le principe)
      clauses[clauses.length - 1].value = raw;
      return ' ';
    });

    // Mots libres résiduels (sépare par espaces)
    const free = q.trim() ? tokenise(q.trim()) : [];
    return { clauses, free };
  }

  /* ---------- Matching fiche vs requête ---------- */
  function matchesAnalyse(enq, tokens){
    if (!tokens || !tokens.length) return true;
    const { clauses, free } = parseQueryFromTokens(tokens);
    const data = enq?.data || {};

    // Constitue un “haystack” (insensible accents/casse)
    const hay = [];
    // En-tête simple
    hay.push(enq.title || '', enq.date || '');

    const pushPathy = (p) => {
      if (!p) return;
      const s = String(p);
      hay.push(s);
      const base = s.split('/').pop().split('\\').pop();
      if (base && base !== s) hay.push(base);
    };

    // Parcourt définitions pour indexer valeurs
    for (const f of getFieldDefs()){
      const v = data[f.name];

      if (f.type === 'checkbox' || f.type === 'radio') {
        // Non indexé en texte libre (mais exploité par has/eq)
        continue;
      }

      if (f.type === 'file'){
        if (typeof v === 'string' && v) pushPathy(v);
        const listed = data[f.name + '__listed'];
        if (Array.isArray(listed)) listed.forEach(pushPathy);
        continue;
      }

      if (f.type === 'date'){
        if (f.repeatable){
          const arr  = Array.isArray(v) ? v : [];
          const raws = Array.isArray(data[f.name + '__raw_idx']) ? data[f.name + '__raw_idx'] : [];
          for (let i=0;i<arr.length;i++){
            const raw = raws[i] ?? arr[i];
            if (raw != null && String(raw).trim() !== '') hay.push(String(raw));
          }
        } else {
          const raw = data[f.name + '__raw'] ?? v;
          if (raw != null && String(raw).trim() !== '') hay.push(String(raw));
        }
        continue;
      }

      if (f.repeatable){
        const arr = Array.isArray(v) ? v : [];
        for (const x of arr){
          if (x != null){
            const sv = String(x).trim();
            if (sv !== '') hay.push(sv);
          }
        }
        continue;
      }

      if (v !== undefined && v !== null){
        const sv = String(v).trim();
        if (sv !== '') hay.push(sv);
      }
    }

    // Ajoute aussi tous les chemins listés (sécurité)
    Object.entries(data).forEach(([k, val]) => {
      if (k.endsWith('__listed') && Array.isArray(val)) val.forEach(pushPathy);
    });

    // Clauses structurées (has/eq/not)
    for (const c of clauses){
      const def = fieldByTokenName(c.fieldTok);
      if (!def) return false;
      let ok = fieldExists(def, data);
      if (ok && c.value != null) ok = someOccurrenceEquals(def, data, c.value);
      if (c.negate) ok = !ok;
      if (!ok) return false;
    }

    // Texte libre (ET logique sur tokens)
    const blob = asKey(hay.join(' '));
    return free.every(t => blob.includes(asKey(t)));
  }

  /* ---------- Export ---------- */
  App.search = {
    tokenise,
    matchesAnalyse,
    fieldByTokenName,
    parseQueryFromTokens
  };
  App._ready = App._ready || {};
  App._ready.search = true;
})();
</script>

<script>
(() => {
  /* =========================================================
     État global + UI liste gauche + toasts + modales
     + File System Access helpers (endurcis)
     ========================================================= */

  // ---------- UTILITAIRES ----------
  const now = () => Date.now();
  const debounce = (fn, ms=120) => {
    let t = null;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  };
  const toLocale = (ts) => {
    try { return new Date(ts).toLocaleString(); }
    catch { return String(ts || ''); }
  };
  const has = (obj,k) => Object.prototype.hasOwnProperty.call(obj||{}, k);

  // ---------- ÉTAT PARTAGÉ ----------
  let currentAnalyse   = null;
  let allAnalysesCache = [];
  let currentSearch    = '';
  let lastSelectedId   = null;

  // Expose l’état via App.state (défensif)
  window.App = window.App || {};
  App.state = {
    get currentAnalyse(){ return currentAnalyse; },
    set currentAnalyse(v){ currentAnalyse = v; lastSelectedId = v?.id ?? lastSelectedId; },
    get allAnalysesCache(){ return allAnalysesCache; },
    set allAnalysesCache(v){ allAnalysesCache = Array.isArray(v) ? v : []; },
    get currentSearch(){ return currentSearch; },
    set currentSearch(v){ currentSearch = String(v ?? ''); },
    get lastSelectedId(){ return lastSelectedId; },
    set lastSelectedId(v){ lastSelectedId = v; }
  };

  // ---------- TOASTS (accessibles + file d’attente + limite) ----------
  const MAX_TOASTS = 4;
  const queue = [];
  function ensureToastContainer(){
    let c = document.getElementById('toastContainer');
    if (!c){
      c = document.createElement('div');
      c.id = 'toastContainer';
      c.className = 'toasts';
      c.setAttribute('role','status');
      c.setAttribute('aria-live','polite');
      c.setAttribute('aria-atomic','true');
      document.body.appendChild(c);
    }
    return c;
  }

  function showToast(message, duration = 2500, type = 'info') {
    const container = ensureToastContainer();

    // Nettoie si trop d'éléments
    while (container.children.length >= MAX_TOASTS) {
      container.firstElementChild?.remove();
    }

    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    // Rôles dynamiques : error/warning -> alert
    if (type === 'error' || type === 'warning') {
      toast.setAttribute('role', 'alert');
      toast.setAttribute('aria-live', 'assertive');
    } else {
      toast.setAttribute('role', 'status');
      toast.setAttribute('aria-live', 'polite');
    }
    toast.tabIndex = 0; // focusable pour lecteurs d’écran
    toast.textContent = String(message ?? '');

    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));

    const hide = () => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 280);
    };

    const t = setTimeout(hide, Math.max(1200, duration|0));
    toast.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { clearTimeout(t); hide(); }
    });
  }

  // ---------- HIGHLIGHT CHAMPS ----------
  function highlightField(selector) {
    const el = document.querySelector(selector);
    if (!el) return;
    if (typeof el.focus === 'function') el.focus();
    el.classList.add('highlighted');
    setTimeout(() => el.classList.remove('highlighted'), 1800);
  }

  // ---------- PLACEHOLDER (états vides) ----------
  function renderEmptyState_hasItems(){
    return `
      <div class="inner">
        <h3>Aucun projet en cours</h3>
        <p>Sélectionnez un projet dans la colonne de gauche pour afficher son contenu.</p>
        <div class="actions">
          <button class="btn ghost" type="button" id="focusSearchBtn">🔎 Rechercher</button>
          <button class="btn primary" type="button" id="focusCreateBtn">+ Nouveau projet</button>
        </div>
      </div>
    `;
  }

  function renderEmptyState_noItems(){
    return `
      <div class="inner">
        <h3>Créez votre premier projet</h3>
        <p>Renseignez un titre puis cliquez sur <strong>Créer</strong>. Vous pourrez ensuite compléter la fiche.</p>
        <ol class="steps">
          <li>Saisissez le <strong>Nom du projet</strong> (champ en haut à gauche).</li>
          <li>Vérifiez la <strong>Date</strong> si besoin.</li>
          <li>Cliquez sur <strong>Créer</strong> pour ajouter le projet à la liste.</li>
          <li>Cliquez sur le projet créée pour ouvrir sa fiche détaillée.</li>
        </ol>
        <div class="actions">
          <button class="btn primary" type="button" id="focusTitleBtn">Commencer</button>
        </div>
      </div>
    `;
  }

  function updatePlaceholder(){
    const ph = document.getElementById('placeholder');
    if(!ph) return;

    const hasDetailOpen = document.body.classList.contains('detail-open');
    if(hasDetailOpen){
      ph.style.display = 'none';
      ph.innerHTML = '';
      return;
    }

    const hasAny = Array.isArray(allAnalysesCache) && allAnalysesCache.length > 0;
    ph.innerHTML = hasAny ? renderEmptyState_hasItems() : renderEmptyState_noItems();
    ph.style.display = 'grid';

    ph.querySelector('#focusSearchBtn')?.addEventListener('click', ()=>{
      highlightField('#searchBox');
      showToast("Entrez un ou plusieurs mots-clés dans le champ de recherche", 4000, 'success');
    });

    ph.querySelector('#focusCreateBtn')?.addEventListener('click', ()=>{
      highlightField('#newTitle');
      showToast("Entrez le nom du projet dans le champ dédié, puis cliquez sur Créer", 4000, 'success');
    });

    ph.querySelector('#focusTitleBtn')?.addEventListener('click', ()=>{
      highlightField('#newTitle');
      showToast("Entrez le nom du projet dans le champ dédié, puis cliquez sur Créer", 4000, 'success');
    });
  }

  // ---------- VISIBILITÉ RECHERCHE ----------
  function updateSearchVisibility() {
    const searchBlock = document.getElementById('searchSection');
    if (!searchBlock) return;
    const hasDetailOpen = document.body.classList.contains('detail-open');
    searchBlock.style.display = hasDetailOpen ? 'none' : '';
  }

  // ---------- LISTE (gauche) : rafraîchissement & rendu ----------
  const _renderListDebounced = debounce(() => renderList(false), 50);

  async function refreshList(){
    try{
      const items = await App.secStore.allEncryptedAnalyses();
      allAnalysesCache = (items || []).slice().sort((a,b)=> (b.created||0) - (a.created||0));
      renderList(true);
      updatePlaceholder();
    }catch(e){
      console.error('[refreshList]', e);
      showToast('Impossible de charger la liste.', 3500, 'error');
    }
  }

  function renderList(forceFocus = false){
    const list = document.getElementById('projectList');
    if (!list) return;
    list.innerHTML='';

    const tokens  = (App.search?.tokenise ?? ((s)=>String(s||'').trim().split(/\s+/).filter(Boolean)))(currentSearch || '');
    const matched = allAnalysesCache.filter(e => (App.search?.matchesAnalyse ?? (()=>true))(e, tokens));

    const info = document.getElementById('searchInfo');
    if (info) info.textContent = tokens.length ? `${matched.length} résultat(s)` : 'Entrez des mots-clés dans le champ recherche...';

matched.forEach(enq=>{
  const per = (App.form?.computeProgressByProcess?.(enq) || []);
  const isMulti = Array.isArray(per) && per.length > 0;

  const tpl = document.getElementById('itemTmpl')?.content?.firstElementChild?.cloneNode(true)
            || (function(){
                 const item = document.createElement('div'); item.className='item'; item.tabIndex = 0;
                 item.innerHTML = `
                   <div class="meta">
                     <div class="title"></div>
                     <div class="sub"></div>
                   </div>
                   <div class="prog" aria-hidden="true"><span></span></div>
                   <span class="pill" aria-label="Avancement"></span>`;
                 return item;
               })();

  tpl.setAttribute('role','button');
  tpl.setAttribute('aria-pressed', (currentAnalyse && currentAnalyse.id === enq.id && document.body.classList.contains('detail-open')) ? 'true' : 'false');
  tpl.dataset.id = enq.id;

  tpl.querySelector('.title').textContent = enq.title || '(sans titre)';
  tpl.querySelector('.sub').textContent   = (enq.date || '—') + ' • ' + toLocale(enq.created);

  if (isMulti && per.length > 1) {
    // remove mono UI
    const oldProg = tpl.querySelector('.prog'); if (oldProg) oldProg.remove();
    const oldPill = tpl.querySelector('.pill'); if (oldPill) oldPill.remove();

    // multi rows
    const multi = document.createElement('div'); multi.className = 'prog-multi';
    per.forEach(p=>{
      const row = document.createElement('div'); row.className = 'pm-row';

      const lab = document.createElement('span'); lab.className='pm-lab'; lab.textContent = p.name || 'Processus';
      const bar = document.createElement('div');  bar.className='prog'; bar.setAttribute('aria-hidden','true');
      const fill= document.createElement('span'); fill.style.width = (p.pct||0) + '%'; bar.appendChild(fill);
      const pill= document.createElement('span'); pill.className='pill'; pill.textContent = `${p.pct||0}% (${p.filled||0}/${p.total||0})`;

      row.append(lab, bar, pill);
      multi.append(row);
    });
    tpl.append(multi);
  } else {
    // fallback mono (ou 1 seul processus)
    const agg = per[0] || (App.form?.computeProgress?.(enq) || { pct:0, filled:0, total:0 });
    tpl.querySelector('.pill').textContent  = `${agg.pct}% (${agg.filled}/${agg.total})`;
    const bar = tpl.querySelector('.prog > span'); if (bar) bar.style.width = (agg.pct||0) + '%';
  }

  if(currentAnalyse && currentAnalyse.id === enq.id && document.body.classList.contains('detail-open')){
    tpl.classList.add('selected');
  }

  // bouton supprimer
  const actions = document.createElement('div'); actions.className='actions';
  const delBtn  = document.createElement('button');
  delBtn.className='icon-btn'; delBtn.type='button'; delBtn.title='Supprimer ce projet';
  delBtn.textContent='🗑️';
  delBtn.setAttribute('aria-label','Supprimer ce projet');
  delBtn.addEventListener('click', async (ev)=>{
    ev.stopPropagation();
    const label = enq.title ? `« ${enq.title} »` : 'ce projet';
    const confirmFn = App.helpers?.confirm ?? ((msg)=>confirm(msg));
    if(!confirmFn(`Supprimer définitivement ${label} ?`)) return;
    try{
      await App.storage.del('projets', enq.id);
      try { await App.secStore?.clearFsHandle?.(enq.id); } catch(_){}
      if(currentAnalyse && currentAnalyse.id === enq.id){ closeDetail(); }
      await refreshList();
      showToast('Analyse supprimée.', 1800, 'success');
    }catch(e){
      console.error('[delete]', e);
      showToast('Suppression impossible.', 3000, 'error');
    }
  });
  actions.appendChild(delBtn);
  tpl.appendChild(actions);

  // click
  tpl.addEventListener('click', async ()=>{
    const isOpen = currentAnalyse && currentAnalyse.id === enq.id && document.body.classList.contains('detail-open');
    if (isOpen) {
      closeDetail();
      tpl.classList.remove('selected');
      updatePlaceholder();
      return;
    }

    // Fermer l’aperçu si ouvert
    App.preview?.closePreview?.();

    // Ouvrir l’élément
    const opened = await App.secStore.getEncryptedAnalyse(enq.id);
    if (!opened) return;
    currentAnalyse = opened;
    lastSelectedId = enq.id;

    // Restaurer la page précédente si disponible
    const p = (App.pages?.loadPageFor?.(currentAnalyse.id) ?? App.helpers?.loadPageFor?.(currentAnalyse.id));
    if (Number.isInteger(p)) App.util?.gotoPage?.(p);
    else App.util?.gotoPage?.(0);
    App.util?.clampPage?.();

    // Mémoriser la dernière ouverte
    try { await App.storage.put('ui', { id:'last', value: enq.id }); } catch(_){}

    openDetail();

    App.form?.renderForm?.();
    App.files?.scanCurrentAnalyse?.();
    updatePlaceholder();

    // marquer sélection
    [...list.children].forEach(n => n.classList.remove('selected'));
    tpl.classList.add('selected');
    tpl.setAttribute('aria-pressed','true');
  });

  // clavier
  tpl.addEventListener('keydown', (ev)=>{
    if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); tpl.click(); }
    // Navigation ↑/↓ : déplacer le focus
    const sib = (el, dir) => dir<0 ? el.previousElementSibling : el.nextElementSibling;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
      ev.preventDefault();
      const next = sib(tpl, ev.key==='ArrowUp' ? -1 : +1);
      next?.focus();
    }
  });

  list.appendChild(tpl);
});


    // Restaure focus/selection si possible
    if (forceFocus && lastSelectedId){
      const node = list.querySelector(`[data-id="${lastSelectedId}"]`);
      if (node){ node.classList.add('selected'); node.setAttribute('aria-pressed','true'); }
    }

    updatePlaceholder();
  }

  // ---------- DÉTAIL (ouverture/fermeture) ----------
  function openDetail(){
    App.util?.gotoPage?.(0);
    document.body.classList.add('detail-open');
    updateSearchVisibility();
  }

  function closeDetail(){
    App.preview?.closePreview?.();
    document.body.classList.remove('detail-open');
    App.util?.gotoPage?.(0);
    currentAnalyse = null;
    clearDetail();
    updatePlaceholder();
    updateSearchVisibility();
  }

  function clearDetail(){
    const host = document.getElementById('formHost');
    if (host) host.innerHTML='';
    const pi = document.getElementById('progressInfo');
    if (pi) pi.textContent='—';
    const pw = document.getElementById('previewWrap');
    if (pw) pw.style.display='none';
    const pv = document.getElementById('preview');
    if (pv) pv.innerHTML='';
  }

  // ---------- MODALE MOT DE PASSE ----------
  function setModalVisible(open){
    const m = document.getElementById('pwdModal');
    if(!m) return;
    m.classList.toggle('is-open', !!open);
    m.setAttribute('aria-hidden', open ? 'false' : 'true');
  }

  function focusFirstPassword(){
    setTimeout(()=> document.querySelector('#pwdModal input[type="password"]')?.focus(), 30);
  }

  // mode 'unlock' -> string | null ; mode 'change' -> { current, next } | null
  function openPasswordDialog({ mode }) {
    return new Promise((resolve) => {
      // --- Récupération des éléments UI
      const modal  = document.getElementById('pwdModal');
      const title  = document.getElementById('pwdModalTitle');
      const cur    = document.getElementById('pwdCurrent'); // champ "mot de passe actuel"
      const n1     = document.getElementById('pwdNew');     // champ "nouveau"
      const n2     = document.getElementById('pwdNew2');    // champ "confirmation"
      const bOk    = document.getElementById('pwdOk');
      const bNo    = document.getElementById('pwdCancel');
      const bReset = document.getElementById('pwdReset');

      // --- Libellés
      const L = {
        unlock: 'Déverrouiller',
        change: 'Changer le mot de passe',
        setup:  'Créer un mot de passe'
      };

      // --- Titre + classes de mode
      modal?.classList.remove('is-unlock', 'is-change', 'is-setup');
      const modeClass =
        mode === 'change' ? 'is-change' :
        mode === 'setup'  ? 'is-setup'  : 'is-unlock';
      modal?.classList.add(modeClass);

      if (title) title.textContent = L[mode] || L.unlock;

      // --- Reset des champs
      if (cur) cur.value = '';
      if (n1)  n1.value  = '';
      if (n2)  n2.value  = '';

      // --- Helpers
      function cleanup() {
        [bOk, bNo, bReset].forEach(btn => btn && (btn.onclick = null));
        document.removeEventListener('keydown', onKey);
        setModalVisible(false);
      }
      function onKey(e) {
        if (e.key === 'Escape') { cleanup(); resolve(null); }
        if (e.key === 'Enter')  { bOk?.click(); }
      }

      // --- Bouton Annuler
      if (bNo) {
        bNo.onclick = () => { cleanup(); resolve(null); };
      }

      // --- Bouton OK
      if (bOk) {
        bOk.onclick = () => {
          if (modeClass === 'is-unlock') {
            if (!cur?.value) { cur?.focus(); return; }
            cleanup();
            resolve(cur.value);
            return;
          }
          if (modeClass === 'is-change') {
            if (!cur?.value) { cur?.focus(); return; }
          }
          if (!n1?.value) { n1?.focus(); return; }
          if (n1.value !== n2?.value) {
            App.uiList?.showToast?.('Les nouveaux mots de passe ne correspondent pas.', 4000, 'error');
            n2?.focus(); return;
          }
          cleanup();
          resolve(
            modeClass === 'is-setup'
              ? { next: n1.value }
              : { current: cur.value, next: n1.value }
          );
        };
      }

      // --- Bouton Réinitialiser : visible en UNLOCK et CHANGE
      if (bReset) {
        bReset.style.display = (modeClass === 'is-unlock' || modeClass === 'is-change') ? '' : 'none';
        bReset.onclick = async () => {
          cleanup();
          try {
            if (App?.helpers?.hardResetAndSetup) {
              await App.helpers.hardResetAndSetup();
            } else if (App?.secStore?.hardResetVault) {
              await App.secStore.hardResetVault();
              App.uiList?.showToast?.('Réinitialisation effectuée.', 2500, 'success');
            }
            App.lock?.setLocked?.(true);
            App.lock?.updateUI?.();
          } catch (e) {
            App.uiList?.showToast?.('Erreur : ' + (e?.message || e), 4000, 'error');
          }
          resolve(null);
        };
      }

      // --- Affichage + interactions clavier
      setModalVisible(true);
      document.addEventListener('keydown', onKey);
      focusFirstPassword();
    });
  }

  // ---------- FILE SYSTEM ACCESS HELPERS ----------
  const fsAvailable = () => ('showDirectoryPicker' in self);

  async function pickParentDir(){
    if(!fsAvailable()) throw new Error('File System Access API indisponible');
    return await showDirectoryPicker({mode:'readwrite'});
  }

  async function ensureRefDir(project, interactive=true){
    if (!project) throw new Error('Aucun projet');
    // Mémoire
    if (project.refParent && project.refDirName){
      try{
        return await project.refParent.getDirectoryHandle(project.refDirName, {create:false});
      }catch(_){} 
    }

    // Handle persistant
    if (project.id != null && App.secStore?.getFsHandle){
      try{
        const saved = await App.secStore.getFsHandle(project.id);
        if (saved){
          project.refParent = saved;
          if (project.refDirName){
            try{
              return await project.refParent.getDirectoryHandle(project.refDirName, {create:false});
            }catch(_){} 
          }
        }
      }catch(_){}
    }

    // Interaction
    if(!interactive) throw new Error('Aucun dossier de référence configuré');
    if(!fsAvailable()) throw new Error('File System Access API indisponible');

    const parent = await pickParentDir();
    const dirName  = (App.util?.slug?.(project.title || 'dossier') || 'dossier');
    const refDir   = await parent.getDirectoryHandle(dirName, {create:true});

    project.refParent  = parent;
    project.refDirName = dirName;

    if (project.id != null && App.secStore?.setFsHandle)
      await App.secStore.setFsHandle(project.id, parent);

    if (App.secStore?.putEncryptedAnalyse)
      await App.secStore.putEncryptedAnalyse(project);

    return refDir;
  }

  async function saveToRefDir(project, file){
    if (!file) throw new Error('Aucun fichier');
    // ensureRefDir doit te retourner un FileSystemDirectoryHandle
    const dir = await ensureRefDir(project, true);
    
    // Demande (ou vérifie) la permission
    const hasPerm = await (async () => {
      if (!dir.queryPermission || !dir.requestPermission) return true; // vieux navigateurs
      const q = await dir.queryPermission({ mode: 'readwrite' });
      if (q === 'granted') return true;
      const r = await dir.requestPermission({ mode: 'readwrite' });
      return r === 'granted';
    })();
    if (!hasPerm) throw new Error('Permission refusée sur le dossier de référence');

    // Nom safe (+ option : unique si déjà présent)
    const baseName = String(file.name || 'fichier').replace(/[\/\\:*?"<>|]+/g,'_');
    let safeName = baseName;
    let idx = 2;
    // Eviter l’écrasement :
    // while (true) {
    //   try { await dir.getFileHandle(safeName, { create:false }); 
    //         safeName = baseName.replace(/(\.[^.]*)?$/, (m)=>` (${idx++})${m||''}`); 
    //   } catch { break; }
    // }

    // Écriture
    const fileHandle = await dir.getFileHandle(safeName, { create:true });
    const writable = await fileHandle.createWritable({ keepExistingData: false });
    await writable.write(file);
    await writable.close();

    // Renvoie AUSSI le handle de dossier pour pouvoir le mémoriser
    return { fileName: safeName, dirHandle: dir };
  }

  // ---------- PERSISTENCE COURANTE ----------
async function persistCurrent(){
  const enq = App.state.currentAnalyse;
  if (!enq) return;

  // ⛨ Skip silencieux si l'app est verrouillée
  if (!App.crypto?.currentKey) return;

  try{
    await App.secStore.putEncryptedAnalyse(enq);
    try { await refreshList(); } catch(_){}
    try { App.preview?.renderPreview?.(); } catch(_){}
  }catch(e){
    // Ne spam pas d'erreur si c'est simplement parce que l'app est verrouillée
    if (e?.message === 'Verrouillé') return;
    console.error('[persistCurrent]', e);
    showToast('Sauvegarde impossible.', 3000, 'error');
  }
}


  // ---------- EXPORT PUBLIC ----------
  App.uiList = {
    refreshList,
    renderList: () => _renderListDebounced(),
    updatePlaceholder,
    updateSearchVisibility,
    openDetail, closeDetail, clearDetail,
    showToast, highlightField,
    openPasswordDialog,
    ensureRefDir, saveToRefDir,
    persistCurrent
  };

  App._ready = App._ready || {};
  App._ready.uiList = true;
})();

<script>
/* === Module App.uiExport : popup d’export guidé === */
App.uiExport = (function() {

    // --- Helper local: buckets courant/ancien pour le projet ouverte
     function bucketsFromCurrentAnalyse(){
           const norm = (s) => String(s ?? '').trim().normalize('NFKC');
           const a = App?.state?.currentAnalyse;
           const current = new Set(), old = new Set();
           const data = a?.data || {};
           const feed = (list) => {
             const items = (Array.isArray(list) ? list : []).filter(v => typeof v === 'string');
             items.forEach((name, idx) => {
               const n = norm(name); if (!n) return;
               (idx < items.length - 1 ? old : current).add(n);
             });
           };
           Object.keys(data).forEach(k => {
             if (!k.endsWith('__listed')) return;
             const arr = Array.isArray(data[k]) ? data[k] : [];
             if (!arr.length) return;
             if (Array.isArray(arr[0])) arr.forEach(sub => feed(sub)); // ← gère les sous-tableaux
             else feed(arr);
           });
           return { current, old };
         }


  async function openResolutionDialog(fileRefs) {
    return new Promise((resolve) => {
      // --- State ---------------------------------------------
      const selected = Object.fromEntries((fileRefs || []).map(r => [r.name, !r.missing]));
      const reviewed  = new Set(); // noms déjà passés au wizard au moins une fois

      // --- DOM de base ---------------------------------------
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      const modal = document.createElement('div');
      modal.className = 'modal export-dialog';
      overlay.append(modal);

      const title = document.createElement('h2');
      title.textContent = 'Préparation de l’export ZIP';
      modal.append(title);

      const listWrap = document.createElement('div');
      listWrap.className = 'file-list';
      modal.append(listWrap);

      const toolbar = document.createElement('div');
      toolbar.className = 'toolbar';
      const btnAll  = document.createElement('button');  btnAll.textContent  = 'Tout cocher';
      const btnNone = document.createElement('button');  btnNone.textContent = 'Tout décocher';
      toolbar.append(btnAll, btnNone);
      modal.append(toolbar);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const startBtn  = document.createElement('button'); // Commencer / Terminer / Passer en revue…
      const okBtn     = document.createElement('button'); okBtn.textContent    = 'Exporter';
      const cancelBtn = document.createElement('button'); cancelBtn.textContent = 'Annuler';
      actions.append(startBtn, okBtn, cancelBtn);
      modal.append(actions);

      document.body.append(overlay);

      // --- Helpers -------------------------------------------
      function getSelected() {
        return (fileRefs || []).filter(r => !!selected[r.name]);
      }
      function getMissingSelected() {
        return getSelected().filter(r => r.missing);
      }
      function getNewMissingToReview() {
        // manquants ET cochés qui n'ont pas encore été passés au wizard
        return getMissingSelected().filter(r => !reviewed.has(r.name));
      }

      function refreshButtons() {
        const missingSel = getMissingSelected();
        const newToReview = getNewMissingToReview();

        if (missingSel.length === 0) {
          // tout ce qui est coché est résolu -> prêt à exporter
          startBtn.style.display = 'none';
          okBtn.style.display = '';
        } else {
          // il reste des manquants parmi les cochés
          okBtn.style.display = 'none';
          startBtn.style.display = '';

          if (reviewed.size === 0) {
            startBtn.textContent = 'Commencer l’export';
          } else if (newToReview.length > 0) {
            startBtn.textContent = 'Terminer l’export';
          } else {
            startBtn.textContent = 'Terminer l’export';
          }
        }
      }

function renderList() {
  // reset conteneur
  listWrap.innerHTML = '';

  // aucun fichier
  if (!fileRefs || fileRefs.length === 0) {
    const p = document.createElement('p');
    p.textContent = 'Aucun fichier trouvé pour ce projet.';
    listWrap.append(p);
    refreshButtons();
    return;
  }

  // liste UL « propre » (le CSS de la modale s’applique aux labels)
  const ul = document.createElement('ul');
  ul.style.listStyle = 'none';
  ul.style.padding = '0';
  ul.style.margin = '0';

  // --- regroupement par nom (pour que plusieurs variantes restent liées entre elles)
  const groups = new Map();
  for (const ref of fileRefs) {
    const arr = groups.get(ref.name) || [];
    arr.push(ref);
    groups.set(ref.name, arr);
  }

  // ordre d'affichage : current d'abord, old ensuite
  const order = (a, b) => ((a.variant === 'old') - (b.variant === 'old'));

  // rendu
  for (const [name, refs] of groups) {
    refs.sort(order);

    for (const ref of refs) {
      const li = document.createElement('li');

      // ligne au format 3 colonnes: checkbox · icône · nom
      const label = document.createElement('label');
      label.style.display = 'grid';
      label.style.gridTemplateColumns = '26px 26px 1fr';
      label.style.alignItems = 'center';
      label.style.gap = '8px';
      label.style.padding = '8px 10px';
      label.style.borderBottom = '1px solid #eee';
      label.style.cursor = 'pointer';

      // checkbox (partagée par nom, pas par ligne)
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = !!selected[name];
      chk.onchange = () => {
        selected[name] = chk.checked;
        renderList(); // permet de refléter l’état sur la variante old ou current
      };

      // icône présent / manquant
      const stateSpan = document.createElement('span');
      stateSpan.className = ref.missing ? 'warn' : 'ok';
      stateSpan.textContent = ref.missing ? '⚠️' : '✅';
      stateSpan.title = ref.missing
        ? 'Fichier manquant (chemin ou permission introuvable)'
        : 'Fichier présent / accessible';

      // nom du fichier
      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = ref.name;
      if (ref.missing) nameSpan.style.opacity = '0.75';

      // si old → barré + badge
      if (ref.variant === 'old') {
        nameSpan.classList.add('old');
        nameSpan.title = 'Ancienne version (sera placée dans old_files/)';

        const badge = document.createElement('em');
        badge.textContent = ' (old)';
        badge.style.fontStyle = 'normal';
        badge.style.opacity = '0.7';
        nameSpan.append(badge);
      }

      // assemblage
      label.append(chk, stateSpan, nameSpan);
      li.append(label);
      ul.append(li);
    }
  }

  listWrap.append(ul);
  refreshButtons();
}


      function close(returnValue) {
        overlay.remove();
        resolve(returnValue);
      }

      async function runWizard() {
        const toFix = getMissingSelected();
        if (toFix.length === 0) {
          // rien à faire, on laisse l’utilisateur exporter
          refreshButtons();
          return;
        }

        let i = 0;
        const save = { title: title.textContent, content: modal.innerHTML };

        async function step() {
          modal.innerHTML = '';

          const h2 = document.createElement('h2');
          h2.textContent = `Résolution ${i + 1}/${toFix.length}`;

          const p = document.createElement('p');
          p.textContent = `Sélectionnez le fichier pour : ${toFix[i].name}`;

          const input = document.createElement('input');
          input.type = 'file';

          const nav = document.createElement('div');
          nav.className = 'actions';
          const nextBtn = document.createElement('button');
          nextBtn.textContent = (i < toFix.length - 1) ? 'Suivant' : 'Terminer';
          const skipBtn = document.createElement('button');
          skipBtn.textContent = 'Ignorer';
          nav.append(nextBtn, skipBtn);

          modal.append(h2, p, input, nav);

          let chosen = null;
          input.onchange = e => { chosen = e.target.files?.[0] || null; };

          nextBtn.onclick = async () => {
            if (chosen) {
              toFix[i].file = chosen;
              toFix[i].missing = false;
            }
            reviewed.add(toFix[i].name);
            i++;
            if (i < toFix.length) step();
            else {
              // retour à la liste
              modal.innerHTML = '';
              title.textContent = save.title;
              modal.append(title, listWrap, toolbar, actions);
              renderList();
            }
          };

          skipBtn.onclick = () => {
            reviewed.add(toFix[i].name);
            i++;
            if (i < toFix.length) step();
            else {
              modal.innerHTML = '';
              title.textContent = save.title;
              modal.append(title, listWrap, toolbar, actions);
              renderList();
            }
          };
        }

        await step();
      }

      // --- Bind boutons --------------------------------------
      btnAll.onclick  = () => { for (const r of fileRefs) selected[r.name] = true;  renderList(); };
      btnNone.onclick = () => { for (const r of fileRefs) selected[r.name] = false; renderList(); };

      cancelBtn.onclick = () => close(null);

      okBtn.onclick = () => {
        const result = (fileRefs || []).map(r => ({
          name: r.name,
          include: !!selected[r.name],
          file: r.file || null
        }));
        close(result);
      };

      startBtn.onclick = () => { runWizard(); };

    // --- First render --------------------------------------
    renderList();
    
    // État initial : si 0 fichier ⇒ afficher tout de suite "Exporter",
    // sinon on ne change rien au comportement (wizard d'abord).
    if ((fileRefs || []).length === 0) {
      okBtn.style.display = '';
      startBtn.textContent = 'Exporter';
    } else {
      okBtn.style.display = 'none';
      startBtn.textContent = 'Commencer l’export';
    }

    });
  }

  async function pickFileFor(expectedName) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Fichiers', accept: { '*/*': ['.*'] } }],
      });
      const file = await handle.getFile();
      if (file.name !== expectedName &&
          !confirm(`Nom différent (${file.name}) — continuer ?`))
        return null;
      return file;
    } catch {
      return null;
    }
  }

  return { openResolutionDialog, pickFileFor };
})();
</script>

<script>
    (() => {
      // --- UTILITAIRES LOCAUX ---
      const safeJSONClone = (v) =>
        (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v)));
    
      const persist = async () => {
        try { await App.uiList?.persistCurrent?.(); } catch (e) { console.warn('[persist]', e); }
      };
    
      const el = (...a) => (App?.util?.el ? App.util.el(...a) : document.createElement(a[0]));
      const $  = (sel, root=document) => (App?.util?.$ ? App.util.$(sel,root) : root.querySelector(sel));
    
      // --- Persist UI state (global)
      function saveLS(){
        localStorage.setItem('formState', JSON.stringify({
          currentAnalyseId: App.state?.currentAnalyse?.id || null,
          panelOpen: App.form?._panelOpen || {},
          multiPage: App.form?._multiPage || {},
          showMissingOnly: !!App.util?.showMissingOnly
        }));
      }
    
      // -------- Réindexation d’ensembles d’index
      function shiftIndexSet(set, fromIndex, delta){
        const tmp = Array.from(set||[]);
        set?.clear?.();
        tmp.forEach(i=>{
          if (i < fromIndex) set.add(i);
          else set.add(i + delta);
        });
      }
      function removeIndexFromSet(set, index){
        const tmp = Array.from(set||[]);
        set?.clear?.();
        tmp.forEach(i=>{
          if (i < index) set.add(i);
          else if (i > index) set.add(i-1);
        });
      }
    
      // -------- Valeur "raw" par index pour dates répétables
      function getRawForDataIdx(obj, name, idx){
        const key = name + '__raw_idx';
        const arr = (obj && Array.isArray(obj[key])) ? obj[key] : [];
        return arr[idx] || '';
      }
      function setRawForDataIdx(obj, name, idx, raw){
        if (!obj || typeof obj !== 'object') return;
        const key = name + '__raw_idx';
        if (!Array.isArray(obj[key])) obj[key] = [];
        obj[key][idx] = String(raw ?? '');
      }
    
      // -------- Progression globale
      function computeProgress(project){
        const arr = App.form.computeProgressByProcess(project);
        const agg = arr.reduce((a, x)=>({ filled:a.filled+x.filled, total:a.total+x.total }), {filled:0,total:0});
        const pct = agg.total ? Math.round((agg.filled*100)/agg.total) : 0;
        return { pct, filled: agg.filled, total: agg.total };
      };
    
      function computeProgressByProcess(project){
  const A = project || App.state?.currentAnalyse || {};
  const DATA = A?.data || {};

  const sectionKeyOf = (section, idx) =>
    (App.model && App.model.sectionKeyOf) ? App.model.sectionKeyOf(section, idx) : `section-${idx+1}`;

  const readSectionArray = (section, idx) =>
    (App.model && App.model.readSectionArray) ? App.model.readSectionArray(A, section, idx)
                                              : (Array.isArray(DATA?.[sectionKeyOf(section, idx)]) ? DATA[sectionKeyOf(section, idx)] : []);

  const isFilled = (f, v) => {
    if (App.util?.isFilled) return App.util.isFilled(f, v);
    if (f?.type === 'checkbox') return v === true;
    if (f?.type === 'date')     return !!App.util?.parseDateStrict?.(v);
    if (f?.type === 'file')     return typeof v === 'string' && v.trim() !== '';
    if (Array.isArray(v))       return v.length > 0;
    return v != null && String(v).trim() !== '';
  };

  const collectLeafs = (section) => {
    const out = [];
    (section.fields || []).forEach(entry => {
      if (entry && entry.group && Array.isArray(entry.fields)) {
        out.push(...entry.fields.map(sf => ({ field: sf, group: entry.group })));
      } else if (entry) {
        out.push({ field: entry, group: null });
      }
    });
    return out;
  };

  const readGroupOccs = (group, container) => {
    const GKEY = `__grp__${group.name}`;
    const arr = Array.isArray(container?.[GKEY]) ? container[GKEY] : [];
    return arr;
  };

  const fieldFilledSomewhere = (fd, container) => {
    if (!fd) return false;
    if (fd.repeatable) {
      const arr = Array.isArray(container?.[fd.name]) ? container[fd.name] : [];
      return arr.some(v => isFilled(fd, v));
    }
    return isFilled(fd, container?.[fd.name]);
  };

  const PRO = App?.model?.PROCESSES;
  const PROCESSES = (Array.isArray(PRO) && PRO.length)
    ? PRO
    : [{ name: 'Processus', sections: (App?.model?.TEMPLATE || []) }];

  const DEBUG_TRACE = false;

  return PROCESSES.map((proc, pidx) => {
    let total = 0, filled = 0;
    const trace = [];

    (proc.sections || []).forEach((section, sidx) => {
      const leafs = collectLeafs(section);

      if (section?.repeatable) {
        const items = readSectionArray(section, sidx);

        leafs.forEach(({ field: fd, group }) => {
          if (group && group.repeatable) {
            const occs = items.flatMap(item => readGroupOccs(group, item));

            if (fd.repeatable) {
              const counts = occs.map(obj => Array.isArray(obj?.[fd.name]) ? obj[fd.name].length : 0);
              total += counts.reduce((a,b) => a + b, 0);

              occs.forEach(obj => {
                const arr = Array.isArray(obj?.[fd.name]) ? obj[fd.name] : [];
                const rawIdx = Array.isArray(obj?.[fd.name + '__raw_idx']) ? obj[fd.name + '__raw_idx'] : null;
                arr.forEach((v, i) => {
                  const vv = (fd.type === 'date' && rawIdx) ? (rawIdx[i] ?? v) : v;
                  if (isFilled(fd, vv)) filled += 1;
                });
              });

            } else {
              total  += occs.length;
              filled += occs.filter(obj => fieldFilledSomewhere(fd, obj)).length;
            }

          } else if (group && !group.repeatable) {

            if (fd.repeatable) {
              const counts = items.map(item => Array.isArray(item?.[fd.name]) ? item[fd.name].length : 0);
              total += counts.reduce((a,b) => a + b, 0);

              items.forEach(item => {
                const arr = Array.isArray(item?.[fd.name]) ? item[fd.name] : [];
                const rawIdx = Array.isArray(item?.[fd.name + '__raw_idx']) ? item[fd.name + '__raw_idx'] : null;
                arr.forEach((v, i) => {
                  const vv = (fd.type === 'date' && rawIdx) ? (rawIdx[i] ?? v) : v;
                  if (isFilled(fd, vv)) filled += 1;
                });
              });

            } else {
              total  += items.length;
              filled += items.filter(item => fieldFilledSomewhere(fd, item)).length;
            }

          } else if (fd.repeatable) {
            for (const item of items) {
              const arr = Array.isArray(item?.[fd.name]) ? item[fd.name] : [];
              total += arr.length;
              const rawIdx = Array.isArray(item?.[fd.name + '__raw_idx']) ? item[fd.name + '__raw_idx'] : null;
              arr.forEach((v, i) => {
                const vv = (fd.type === 'date' && rawIdx) ? (rawIdx[i] ?? v) : v;
                if (isFilled(fd, vv)) filled += 1;
              });
            }

          } else {
            total  += items.length;
            filled += items.filter(item => fieldFilledSomewhere(fd, item)).length;
          }
        });

      } else {
        const sectionKey = sectionKeyOf(section, sidx);
        const ROW = (DATA?.[sectionKey]) || {};

        leafs.forEach(({ field: fd, group }) => {
          if (group && group.repeatable) {
            const occs = readGroupOccs(group, ROW);

            if (fd.repeatable) {
              const counts = occs.map(obj => Array.isArray(obj?.[fd.name]) ? obj[fd.name].length : 0);
              total += counts.reduce((a,b) => a + b, 0);

              occs.forEach(obj => {
                const arr = Array.isArray(obj?.[fd.name]) ? obj[fd.name] : [];
                const rawIdx = Array.isArray(obj?.[fd.name + '__raw_idx']) ? obj[fd.name + '__raw_idx'] : null;
                arr.forEach((v, i) => {
                  const vv = (fd.type === 'date' && rawIdx) ? (rawIdx[i] ?? v) : v;
                  if (isFilled(fd, vv)) filled += 1;
                });
              });

            } else {
              total  += occs.length;
              filled += occs.filter(obj => fieldFilledSomewhere(fd, obj)).length;
            }

          } else if (fd.repeatable) {
            const arr = Array.isArray(ROW?.[fd.name]) ? ROW[fd.name] : [];
            total += arr.length;
            const rawIdx = Array.isArray(ROW?.[fd.name + '__raw_idx']) ? ROW[fd.name + '__raw_idx'] : null;
            arr.forEach((v, i) => {
              const vv = (fd.type === 'date' && rawIdx) ? (rawIdx[i] ?? v) : v;
              if (isFilled(fd, vv)) filled += 1;
            });

          } else {
            total += 1;
            if (fd.type === 'date') {
              const raw = ROW?.[fd.name + '__raw'];
              const vv  = raw ?? ROW?.[fd.name];
              if (isFilled(fd, vv)) filled += 1;
            } else {
              if (fieldFilledSomewhere(fd, ROW)) filled += 1;
            }
          }
        });
      }
    });

    const pct = total ? Math.round((filled * 100) / total) : 0;
    return { pct, filled, total, pidx, name: proc?.name || `Processus ${pidx+1}` };
  });
}


      function updateCompletionBannerUI(pct=0, filled=0, total=0){
        const banner = document.querySelector('.completion-banner');
        if (!banner) return;
        const P = Number.isFinite(pct) ? pct : 0;
        const F = Number.isFinite(filled) ? filled : 0;
        const T = Number.isFinite(total) ? total : 0;
        banner.querySelector('.pct')?.replaceChildren(`${P}%`);
        const barFill = banner.querySelector('.bar > span');
        if (barFill) barFill.style.width = P + '%';
        banner.querySelector('.info .sub')?.replaceChildren(`Complétion : ${P}% (${F}/${T})`);
      }
    
      function refreshProgressUI(){
        try {
          const project = App.state?.currentAnalyse;
          if (!project) return;
    
          const perProc = (typeof computeProgressByProcess === 'function'
            ? computeProgressByProcess(project)
            : (App.form?.computeProgressByProcess?.(project) || []));
    
          const panels = document.querySelectorAll('.proc-columns .proc-panel');
          panels.forEach((panel, i) => {
            const st = panel.querySelector('.proc-status');
            const per = perProc[i] || { pct:0, filled:0, total:0 };
            if (st){
              st.className = 'proc-status' + (per.pct === 100 ? ' ok' : '');
              st.textContent = `${per.pct}% (${per.filled}/${per.total})`;
            }
          });
    
          const g = App.form.computeProgress?.(project) || { pct:0, filled:0, total:0 };
          updateCompletionBannerUI(g.pct, g.filled, g.total);
        } catch {}
      }
    
      // -------- Évaluation des valeurs manquantes
      function normMissing(fieldDef, value){
        if (fieldDef.type === 'date')     return App.util.parseDateStrict(value) ? value : '';
        if (fieldDef.type === 'checkbox') return !!value;
        return value == null ? '' : value;
      }
      function headerMissing(current){
        const missing = [];
        if(!current?.title || !current.title.trim()) missing.push('title');
        if(!(App.util?.parseDateStrict?.(current?.date))) missing.push('date');
        return missing;
      }
    
      // -------- Snapshot des champs manquants
      let FILTER_SNAPSHOT = null;
      function buildFilterSnapshot(project){
        const snap = { header:{}, sections:{} };
    
        const missH = headerMissing(project);
        snap.header.title = missH.includes('title');
        snap.header.date  = missH.includes('date');
    
        const eachField = (section, fn) => {
          for (const e of (section.fields || [])) {
            if (e && e.group && Array.isArray(e.fields)) {
              for (const f of e.fields) fn(f, /*group*/ e.group);
            } else {
              fn(e, null);
            }
          }
        };
    
        const ALL_SECTIONS = (() => {
          const PRO = App?.model?.PROCESSES;
          if (Array.isArray(PRO) && PRO.length){
            return PRO.flatMap(p => p.sections || []);
          }
          return App?.model?.TEMPLATE || [];
        })();
    
        ALL_SECTIONS.forEach((section, sidx)=>{
          const key = App.model.sectionKeyOf(section, sidx);
          const S = snap.sections[key] = { repeatable: !!section.repeatable };
    
          if (!section.repeatable){
            const ROW = project?.data?.[key] || {};
            S.simple  = new Set();
            S.repeats = {};
            eachField(section, (f)=>{
              if (f.repeatable){
                const arr = Array.isArray(ROW?.[f.name]) ? ROW[f.name] : [];
                const set = new Set();
                arr.forEach((v,i)=>{
                  const val = normMissing(f, v);
                  if (App.util.fieldIsMissingSimple(f, val)) set.add(i);
                });
                S.repeats[f.name] = set;
              } else {
                const val = normMissing(f, ROW?.[f.name]);
                if (App.util.fieldIsMissingSimple(f, val)) S.simple.add(f.name);
              }
            });
          } else {
            const items = Array.isArray(project.data?.[key]) ? project.data[key] : [];
            S.blocks = {};
            items.forEach((item, i)=>{
              const b = { simple:new Set(), repeats:{} };
              eachField(section, (f)=>{
                if (f.repeatable){
                  const a = Array.isArray(item?.[f.name]) ? item[f.name] : [];
                  const set = new Set();
                  a.forEach((v,idx)=>{
                    const val = normMissing(f, v);
                    if (App.util.fieldIsMissingSimple(f, val)) set.add(idx);
                  });
                  b.repeats[f.name] = set;
                } else {
                  const val = normMissing(f, item?.[f.name]);
                  if (App.util.fieldIsMissingSimple(f, val)) b.simple.add(f.name);
                }
              });
              if (b.simple.size || Object.values(b.repeats).some(set=>set.size>0)) S.blocks[i] = b;
            });
          }
        });
    
        return snap;
      }
    
      // -------- Nettoyage des champs vides dans un bloc
      function pruneItemFieldIfEmpty(field, itemObj, dataRoot, itemIndex){
        const v = itemObj?.[field.name];
        const empty = (field.type==='checkbox') ? (v===false)
                     : (v==null || (typeof v==='string' && v.trim()===''));
        if (!empty) return;
        if (itemObj && field.name in itemObj) delete itemObj[field.name];
        const rawKey = field.name + '__raw_idx';
        if (dataRoot && Array.isArray(dataRoot[rawKey]) && Number.isInteger(itemIndex)) {
          dataRoot[rawKey][itemIndex] = '';
        }
      }
    
      // -------- Sanitisation fichiers (SECTION non répétable)
      function sanitizeFilesInRow(row, section){
        if (!row || !section?.fields) return row;
        (section.fields||[]).forEach(f=>{
          if (f?.type === 'file') {
            delete row[f.name];
            delete row[f.name + '__listed'];
          }
          if (f?.repeatable && f?.type === 'file') {
            if (!Array.isArray(row[f.name])) row[f.name] = [];
          }
        });
        return row;
      }
