            const nodes = [container];
            if (!App.util?.showMissingOnly) {
              const addBlock = el('button', { class:'btn sm adder', type:'button' }, { children:['Ajouter un bloc'] });
              addBlock.addEventListener('click', async ()=>{
                items.push({});
                await persist(); App.form?.renderForm?.();
              });
              nodes.push(addBlock);
            }
    
            sectionNode.append(...nodes);
            targetHost.append(sectionNode);
            return;
          }
    
          // Section non répétable
          const kv = el('div', { class:'kv' });
          const DATA = (App.state.currentAnalyse.data ||= {});
          const ROW  = (DATA[sectionKey] ||= {});
    
          (section.fields||[]).forEach(f=>{
            // groupe
            if (f && f.group && Array.isArray(f.fields)) {
              const g = f.group;
    
              if (g.repeatable) {
                const KEY = `__grp__${g.name}`;
                if (!Array.isArray(ROW[KEY])) ROW[KEY] = [];
    
                const lab  = el('label', {}, { children:[ g.label || g.name ] });
                const list = el('div', { class:'repeatable' });
    
                const renderOcc = (i) => {
                  const obj = ROW[KEY][i] || (ROW[KEY][i] = {});
                  if (App.util?.showMissingOnly && !groupOccHasMissing(f, obj)) return null;
    
                  const item  = el('div', { class:'repeatable-item' });
                  const iwrap = el('div', { class:'input-wrap' });
    
                  const tag = el('div', { class:'mini-tags' });
                  const dup = el('button', { class:'mini-btn', type:'button' }, { children:['⧉'] });
                  const rm  = el('button', { class:'mini-btn', type:'button' }, { children:['✕'] });
                  tag.append(dup, rm);
    
                  dup.addEventListener('click', async ()=>{ ROW[KEY].push(structuredClone(obj)); await persist(); App.form?.renderForm?.(); });
                  rm.addEventListener('click', async ()=>{ if (!confirm("Voulez-vous vraiment supprimer cet élément ?")) return; ROW[KEY].splice(i,1); await persist(); App.form?.renderForm?.(); });
    
                  (f.fields || []).forEach(sf => {
                    if (sf.repeatable) {
                      if (!Array.isArray(obj[sf.name])) obj[sf.name] = [];
                      const all  = obj[sf.name];
                      const idxs = App.util?.showMissingOnly
                        ? all.map((v,k)=> isMissingValue(sf,v) ? k : -1).filter(k=>k>=0)
                        : all.map((_,k)=>k);
    
                      if (!idxs.length && App.util?.showMissingOnly) return;
    
                      const list = el('div', { class:'repeatable-items' });
                      const getArr = () => obj[sf.name];
                      const setArr = (a) => { obj[sf.name] = a; };
    
                      const renderRow = buildRenderRow({
                        field: sf, getArr, setArr,
                        idxToRow: () => obj,
                        uidBase: `${sectionKey}__grp_${g.name}__${sf.name}__i${i}`
                      });
    
                      idxs.forEach(k => list.append(renderRow(k)));
    
                      const children = [list];
                      if (!App.util?.showMissingOnly) {
                        const add = el('button', { class:'btn sm adder', type:'button' }, { children:['Ajouter'] });
                        add.addEventListener('click', async ()=>{
                          const a = getArr().slice();
                          a.push(sf.type === 'checkbox' ? false : '');
                          setArr(a);
                          await persist(); App.form?.renderForm?.();
                        });
                        children.push(add);
                      }
    
                      const row = el('div', { class:'kv' }, {
                        children: [
                          el('label', {}, { children:[ sf.label || sf.name ] }),
                          el('div', {}, { children })
                        ]
                      });
                      iwrap.append(row);
                      return;
                    }
    
                    const cur = (sf.type === 'date')
                      ? (App.util?.getRawForData ? App.util.getRawForData(obj, sf.name) : (obj[sf.name] ?? ''))
                      : (obj[sf.name] ?? (sf.type === 'checkbox' ? false : ''));
                    if (App.util?.showMissingOnly && !isMissingValue(sf, cur)) return;
    
                    const r = el('div', { class:'kv' });
                    const l = el('label', {}, { children:[ sf.label || sf.name ] });
                    const input = renderInputForField(
                      sf, cur,
                      async v => {
                        if (sf.type === 'date' && App.util?.setRawForData) App.util.setRawForData(obj, sf.name, v);
                        else obj[sf.name] = v;
                        await persist();
                      },
                      null,
                      { row: obj, uid:`${sectionKey}__grp_${g.name}__${sf.name}__i${i}` }
                    );
                    r.append(l, input);
                    attachTip(r, sf);
                    iwrap.append(r);
                  });
    
                  item.append(el('div', { class:'input-wrap' }, { children:[tag, iwrap] }));
                  return item;
                };
    
                ROW[KEY].forEach((_, i) => {
                  const n = renderOcc(i);
                  if (n) list.append(n);
                });
    
                if (App.util?.showMissingOnly && !list.childElementCount) {
                  return;
                }
    
                const wrap = el('div');
                wrap.append(list);
                if (!App.util?.showMissingOnly) {
                  const addGrp2 = el('button', { class:'btn sm adder', type:'button' }, { children:['Ajouter'] });
                  addGrp2.addEventListener('click', async () => {
                    ROW[KEY].push({});
                    await persist();
                    App.form?.renderForm?.();
                  });
                  wrap.append(addGrp2);
                }
    
                kv.append(lab, wrap);
                sectionNode.append(kv);
                targetHost.append(sectionNode);
                return;
              }
    
              // groupe simple (aplati)
              const legend = el('label', { class:'group-legend' }, { children:[ g.label || g.name ] });
              const gWrap  = el('div', { class:'section group-wrap' });
              let painted = 0;
              (f.fields||[]).forEach(sf=>{
                const cur = (sf.type==='date')
                  ? (App.util?.getRawForData ? App.util.getRawForData(ROW, sf.name) : (ROW[sf.name] ?? ''))
                  : (ROW[sf.name] ?? (sf.type==='checkbox'?false:''));
                if (App.util?.showMissingOnly && !isMissingValue(sf, cur)) return;
                const r = el('div', { class:'kv' });
                const l = el('label', {}, { children:[ sf.label || sf.name ] });
                const input = renderInputForField(
                  sf, cur,
                  async v=>{
                    if (sf.type==='date' && App.util?.setRawForData) App.util.setRawForData(ROW, sf.name, v);
                    else ROW[sf.name] = v;
                    await persist();
                  },
                  null,
                  { row: ROW, uid:`${sectionKey}__grp_${g.name}__${sf.name}` }
                );
                r.append(l, input);
                attachTip(r, sf);
                gWrap.append(r);
                painted++;
              });
              if (painted){
                kv.append(legend, gWrap);
                sectionNode.append(kv);
                targetHost.append(sectionNode);
              }
              return;
            }
    
            // champ répétable — ROW
            if (f?.repeatable){
              const getArr = () => {
                const a = Array.isArray(ROW[f.name]) ? ROW[f.name] : (ROW[f.name] = []);
                return a;
              };
              const all = getArr();
              const idxs = App.util?.showMissingOnly
                ? all.map((v,k)=> isMissingValue(f,v) ? k : -1).filter(k=>k>=0)
                : all.map((_,k)=>k);
    
              if (!idxs.length && App.util?.showMissingOnly) return;
    
              const list = el('div', { class:'repeatable-items' });
              const setArr = (a)=>{ ROW[f.name] = a; };
    
              const renderRow = buildRenderRow({
                field: f, getArr, setArr,
                idxToRow: ()=> ROW,
                uidBase: `${sectionKey}__${f.name}`
              });
    
              idxs.forEach(k => list.append(renderRow(k)));
    
              const children = [list];
              if (!App.util?.showMissingOnly) {
                const addBtn = el('button', { class:'btn sm adder', type:'button' }, { children:['Ajouter'] });
                addBtn.addEventListener('click', async ()=>{
                  const a = getArr().slice();
                  a.push(f.type==='checkbox' ? false : '');
                  setArr(a);
                  await persist(); App.form?.renderForm?.();
                });
                children.push(addBtn);
              }
    
              kv.append(el('label',{}, {children:[ f.label || f.name ]}), el('div',{}, {children}));
              sectionNode.append(kv);
              targetHost.append(sectionNode);
              return;
            }
    
            // champ simple — ROW
            const cur = (f.type==='date')
              ? (App.util?.getRawForData ? App.util.getRawForData(ROW, f.name) : (ROW[f.name] ?? ''))
              : (ROW[f.name] ?? (f.type==='checkbox'?false:''));
            if (App.util?.showMissingOnly && !isMissingValue(f, cur)) return;
    
            const r = el('div', { class:'kv' });
            const l = el('label', {}, { children:[ f.label || f.name ] });
            const input = renderInputForField(
              f, cur,
              async v=>{
                if (f.type==='date' && App.util?.setRawForData) App.util.setRawForData(ROW, f.name, v);
                else ROW[f.name] = v;
                await persist();
              },
              null,
              { row: ROW, uid:`${sectionKey}__${f.name}` }
            );
            r.append(l, input);
            attachTip(r, f);
            kv.append(r);
          });
    
          sectionNode.append(kv);
          targetHost.append(sectionNode);
          return;
        }
    
        // ========= Pager local (multi-process) =========
        function renderLocalPager(totalPages, current, onGoto){
          const wrap = el('div', { class:'pager local' });
          const btn = (txt, goto, disabled=false, aria='') => {
            const b = el('button', { class:'btn sm ghost', type:'button', disabled: !!disabled });
            b.textContent = txt; if (aria) b.setAttribute('aria-label', aria);
            if (!disabled) b.addEventListener('click', ()=> onGoto(goto));
            return b;
          };
          wrap.append(
            btn('‹', Math.max(0, current-1), current<=0, 'Page précédente')
          );
    
          const MAX = 7;
          const mkDot = (i) => {
            const d = el('button', { class:'btn sm ' + (i===current?'primary':'ghost'), type:'button' });
            d.textContent = (i+1);
            d.addEventListener('click', ()=> onGoto(i));
            return d;
          };
          if (totalPages <= MAX){
            for(let i=0;i<totalPages;i++) wrap.append(mkDot(i));
          } else {
            const mid = current;
            const add = (i) => wrap.append(mkDot(i));
            add(0);
            if (mid > 2) wrap.append(el('span', { class:'dots' }, { children:['…'] }));
            const start = Math.max(1, mid-1);
            const end   = Math.min(totalPages-2, mid+1);
            for(let i=start;i<=end;i++) add(i);
            if (mid < totalPages-3) wrap.append(el('span', { class:'dots' }, { children:['…'] }));
            add(totalPages-1);
          }
    
          wrap.append(
            btn('›', Math.min(totalPages-1, current+1), current>=totalPages-1, 'Page suivante')
          );
          return wrap;
        }
    
        // ========= SECTIONS (multi ou mono) =========
        if (MULTI){
          App.form._multiPage = App.form._multiPage || Object.create(null);
          const getProcPage = (key) => {
            const v = App.form._multiPage[key];
            return Number.isInteger(v) ? v : 0;
          };
          App.form.setProcPage = (key, page) => {
            App.form._multiPage[key] = Math.max(0, page|0);
            saveLS();
          };
    
          App.form._panelOpen = App.form._panelOpen || Object.create(null);
          const getProcOpen = (key) =>
            (key in App.form._panelOpen) ? !!App.form._panelOpen[key] : false;
          const setProcOpen = (key, open) => { App.form._panelOpen[key] = !!open; saveLS(); };
    
          const wrap = el('div', { class:'proc-columns' });
    
          MULTI.forEach((proc, pi)=>{
            const procKey = String(proc?.name || pi);
            const sections = proc?.sections || [];
            const totalPages = sections.length;
            let localPage = getProcPage(procKey);
    
            const panel = el('div', { class:'proc-panel' });
            const head  = el('div', { class:'proc-head', role:'button', tabindex:'0', 'aria-expanded':'true' });
            const title = el('div', { class:'proc-title' }, { children:[ proc?.name || `Processus ${pi+1}` ] });
            const stat  = el('span', { class:'proc-status' }, { children:[''] });
    
            const lockBtn = el('button', { class:'btn sm', type:'button' }, { children:['Verrouiller'] });
            const toggle  = el('button', { class:'btn sm ghost', type:'button' }, { children:['Replier'] });
            const body    = el('div', { class:'proc-body' });
    
            function setOpen(open){
              panel.classList.toggle('open', !!open);
              head.setAttribute('aria-expanded', open ? 'true' : 'false');
              toggle.textContent = open ? 'Replier' : 'Déplier';
              setProcOpen(procKey, !!open);
            }
            setOpen(getProcOpen(procKey));
    
            head.addEventListener('click', (e)=>{
              if (e.target !== toggle && e.target !== lockBtn) setOpen(!panel.classList.contains('open'));
            });
            toggle.addEventListener('click', (e)=>{ e.stopPropagation(); setOpen(!panel.classList.contains('open')); });
    
            head.append(title, stat, lockBtn, toggle);
            panel.append(head, body);
    
            const dataRoot = (App.state.currentAnalyse.data ||= {});
            const doneMap  = (dataRoot.__procDone ||= {});
            const isLocked = () => (doneMap[procKey] === true || doneMap[procKey] === 'true' || doneMap[procKey] === 1);
    
            const persistLock = async (v) => {
              doneMap[procKey] = !!v;
              await persist();
            };
    
            function setLockedUI(disabled){
              panel.classList.toggle('done', !!disabled);
              panel.classList.toggle('locked', !!disabled);
    
              body.querySelectorAll('input, select, textarea, fieldset, [contenteditable="true"]').forEach(elm=>{
                if (elm.closest('.pager')) return;
                if (elm.hasAttribute('contenteditable')) elm.setAttribute('contenteditable', disabled ? 'false' : 'true');
                if ('disabled' in elm) elm.disabled = !!disabled;
              });
    
              body.querySelectorAll('button, .btn').forEach(btn=>{
                if (btn.closest('.pager')) return;
                btn.disabled = !!disabled;
              });
    
              if (!panel.__lockGuardInstalled){
                const blocker = (e)=>{
                  if (!isLocked()) return;
                  if (e.target.closest('.pager')) return;
                  const editable = e.target.closest('input, select, textarea, [contenteditable="true"], .btn-add, .btn-del, .btn-edit, button');
                  if (editable){
                    e.preventDefault(); e.stopPropagation();
                    (App.ui?.toast || App.util?.toast || ((m)=>alert(m)))(
                      "Ce processus est verrouillé. Cliquez sur « Déverrouiller » pour modifier."
                    );
                  }
                };
                body.addEventListener('click', blocker, true);
                body.addEventListener('input', blocker, true);
                panel.__lockGuardInstalled = true;
              }
            }
    
            const setLocked = async (lock) => {
              await persistLock(!!lock);
              setLockedUI(!!lock);
              lockBtn.textContent = isLocked() ? 'Déverrouiller' : 'Verrouiller';
            };
    
            lockBtn.addEventListener('click', async (e)=>{
              e.stopPropagation();
              const next = !isLocked();
              await setLocked(next);
            });
    
            const rerenderProcess = ()=>{
              body.innerHTML = '';
    
              const per = (computeProgressByProcess(App.state.currentAnalyse) || [])[pi] || { pct:0, filled:0, total:0 };
              stat.className = 'proc-status' + (per.pct === 100 ? ' ok' : '');
              stat.textContent = `${per.pct}% (${per.filled}/${per.total})`;
    
              const renderPagerAndGetNode = (where)=>{
                App.util.renderPager(where, {
                  local: true,
                  currentPage: () => localPage,
                  totalPages:  () => totalPages,
                  goto:        (pg) => { localPage = pg; App.form.setProcPage(procKey, localPage); rerenderProcess(); },
                  finishLabel: 'Terminer',
                  onFinish: async () => {
                    await setLocked(true);
                    setOpen(false);
                  }
                });
                return Array.from(where.querySelectorAll('.pager')).pop() || where;
              };
    
              // pager haut
              renderPagerAndGetNode(body);
    
              // contenu
              let content;
              if (sections[localPage]) {
                content = el('div');
                renderOneSection(content, sections[localPage], localPage);
                body.append(content);
              } else {
                body.append(el('div', { class:'muted' }, { children:['(Aucune section)'] }));
              }
    
              if (App.util?.showMissingOnly) {
                const hasEditable = !!content?.querySelector('.repeatable-item, input, select, textarea, [contenteditable="true"]');
                if (!hasEditable) {
                  const doneCard = el('div', { class:'empty-state', style:'padding:14px;border:1px solid #d5e8d4;background:#f6ffed;border-radius:12px;margin:8px 0' }, { children:[
                    el('h4', { style:'margin:0 0 6px 0' }, { children:['Tout est complet ✅'] }),
                    el('p',  { style:'margin:0' }, { children:['Il n’y a rien à remplir pour cette étape.'] })
                  ]});
                  body.append(doneCard);
                }
              }
    
              const stepFoot = el('div', { class:'proc-step muted' }, { children:[ `Étape ${localPage + 1} / ${totalPages}` ] });
              body.append(stepFoot);
            };
    
            rerenderProcess();
            wrap.append(panel);
          });
    
          host.append(wrap);
          return;
        }
    
        // --- Mono-processus : TEMPLATE + pager global
        const TEMPLATE = App?.model?.TEMPLATE || [];
    
        function renderSectionsForTemplate_Mono(targetHost, TEMPLATE_SECTIONS){
          const pageWrap = el('div', { class:'page-wrap' });
          TEMPLATE_SECTIONS.forEach((section, sidx)=>{
            const expectedPage = sidx + 1; // page 1 = première section
            if (App.util?.currentPage != null && App.util.currentPage !== expectedPage) return;
            renderOneSection(pageWrap, section, sidx);
          });
          targetHost.append(pageWrap);
    
          if (App.util?.showMissingOnly) {
            const hasEditable = !!pageWrap.querySelector('.repeatable-item, input, select, textarea, [contenteditable="true"]');
            if (!hasEditable) {
              const doneCard = el('div', { class:'empty-state', style:'padding:14px;border:1px solid #d5e8d4;background:#f6ffed;border-radius:12px;margin:8px 0' }, { children:[
                el('h4', { style:'margin:0 0 6px 0' }, { children:['Tout est complet ✅'] }),
                el('p',  { style:'margin:0' }, { children:['Il n’y a rien à remplir pour cette étape.'] })
              ]});
              targetHost.append(doneCard);
            }
          }
        }
    
        renderSectionsForTemplate_Mono(host, TEMPLATE);
      }
    
      function attachTip(parentEl, field){
        if(!field?.tips) return;
        const t = document.createElement('div');
        t.className = 'tip-note';
        t.innerHTML = `
          <span class="tip-icn">${field.tips.icon || '💡'}</span>
          <div class="tip-body">${String(field.tips.text).replace(/\n/g,'<br>')}</div>
        `;
        parentEl.appendChild(t);
      }
    
      function renderInputForField(field, value, onChange, idxForRepeatable=null, ctx=null){
        const base = ctx?.uid ? `f_${ctx.uid}` : `f_${field.name}`;
        const fid  = base + (idxForRepeatable !== null && idxForRepeatable !== undefined ? `_${idxForRepeatable}` : '');
        const attrs = {id: fid, name: field.name, 'aria-label': field.label || field.name, required: !!field.required};
        if(field.placeholder) attrs.placeholder = field.placeholder;
    
        switch(field.type){
          case 'textarea': {
            const ta = el('textarea', attrs);
            ta.value = value || '';
            ta.addEventListener('input', e => onChange(e.target.value));
            return ta;
          }
    
          case 'select': {
            const input = el('select', attrs);
            const placeholderText = field.placeholder || '— Sélectionner —';
            const placeholderAttrs = { value: '' };
            if (field.required) { placeholderAttrs.disabled = true; placeholderAttrs.hidden = true; }
            if (!value) placeholderAttrs.selected = true;
            input.append(el('option', placeholderAttrs, { children: [placeholderText] }));
            (field.options || []).forEach(opt => {
              const o = el('option', { value: opt }, { children: [opt] });
              if (opt === value) o.selected = true;
              input.append(o);
            });
            input.value = value ?? '';
            input.addEventListener('change', e => onChange(e.target.value));
            return input;
          }
    
          case 'checkbox': {
            const input = el('input', {...attrs, type:'checkbox'});
            input.checked = !!value;
            input.addEventListener('change', e=> onChange(e.target.checked));
            return input;
          }
    
          case 'radio': {
            const wrap = el('div', {class:'row', role:'radiogroup', 'aria-label': field.label || field.name});
            (field.options||[]).forEach((opt,i)=>{
              const rid = fid + '_' + (App.util?.slug?.(opt) || i);
              const r = el('input', {type:'radio', id:rid, name: fid, value: opt, checked: value===opt, required: !!field.required,
                onchange: e=> onChange(e.target.value)});
              const lab = el('label', {for:rid},{children:[opt]});
              wrap.append(el('div', {class:'row', style:'gap:6px'}, {children:[r, lab]}));
            });
            return wrap;
          }
    
          case 'number': {
            const input = el('input', {...attrs, type:'number'});
            if(field.min!==undefined) input.min = field.min;
            if(field.max!==undefined) input.max = field.max;
            if(field.step!==undefined) input.step = field.step;
            input.value = (value ?? '') === null ? '' : value ?? '';
            input.addEventListener('input', e=> onChange(e.target.value));
            return input;
          }
    
          case 'date': {
            const hasIndex = (idxForRepeatable !== null && idxForRepeatable !== undefined);
            const container = (ctx && ctx.row) ? ctx.row : (App.state.currentAnalyse.data ||= {});
            const rawKey = `${field.name}__raw`;
    
            const raw = hasIndex
              ? (getRawForDataIdx(App.state.currentAnalyse, field.name, idxForRepeatable) || (value || ''))
              : ((container && container[rawKey]) || (value || ''));
    
            const input = el('input', {
              ...attrs,
              type: 'text',
              inputmode: 'numeric',
              placeholder: 'YYYY-MM-DD',
              value: raw
            });
            const hint = el('div', { class:'muted', style:'margin-top:2px' }, { children:[''] });
    
            async function sync(val){
              if (!App.state.currentAnalyse.data) App.state.currentAnalyse.data = {};
              if (hasIndex) {
                setRawForDataIdx(App.state.currentAnalyse, field.name, idxForRepeatable, val);
              } else {
                container[rawKey] = val;
              }
    
              const ok = App.util.parseDateStrict(val);
              if (ok){
                onChange(ok);
                hint.textContent = '';
                input.classList.remove('invalid');
              } else {
                onChange('');
                hint.textContent = val ? 'Format attendu : YYYY-MM-DD' : '';
                input.classList.add('invalid');
              }
              await persist().catch(()=>{});
              App.util?.safeUIRefresh?.();
            }
    
            input.addEventListener('input', e => sync(e.target.value));
            setTimeout(() => sync(raw), 0);
    
            const wrap = el('div', {});
            wrap.append(input, hint);
            return wrap;
          }
    
          case 'file': {
            function esc(s){
              return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
            }
    
            const root = (App.state.currentAnalyse.data ||= {});
            const row  = (ctx && ctx.row) ? ctx.row : root;
    
            const isRepeatEntry = !!field.repeatable;
            const LIST_KEY = field.name + '__listed';
    
            if (!Array.isArray(row[LIST_KEY])) row[LIST_KEY] = [];
    
            function getHist() {
              if (!isRepeatEntry) return row[LIST_KEY];
              const idx = (idxForRepeatable ?? -1);
              if (idx < 0) return [];
              if (!Array.isArray(row[LIST_KEY][idx])) row[LIST_KEY][idx] = [];
              return row[LIST_KEY][idx];
            }
    
            const wrap      = el('div', { class: 'file-input' });
            const inputRow  = el('div', { class: 'file-row' });
            const fileInput = el('input', { type: 'file', id: fid });
            const uploadBtn = el('button', { class: 'btn sm', type: 'button' }, { children: ['Uploader'] });
            uploadBtn.style.display = 'none';
            fileInput.addEventListener('change', () => {
              uploadBtn.style.display = fileInput.files?.length > 0 ? '' : 'none';
            });
    
            const list      = el('ul', { class: 'file-list' });
    
            function setStatus(li, char, title){
              let b = li.querySelector('.file-status');
              if (!b) {
                b = document.createElement('span');
                b.className = 'file-status';
                li.prepend(b);
                li.insertBefore(document.createTextNode(' '), b.nextSibling);
              }
              b.textContent = char;
              b.title = title || '';
            }
    
            function ensureStatusMap(){
              const a = App.state?.currentAnalyse;
              if (!a) return {};
              a.data ||= {};
              a.data.__fileStatus ||= {};
              return a.data.__fileStatus;
            }
    
            function getFileStatus(name){
              const m = ensureStatusMap();
              return m[name] || 'unknown';
            }
            function setFileStatus(name, state){
              const m = ensureStatusMap();
              m[name] = state;
              try { persist(); } catch {}
            }
    
            function drawList() {
              list.innerHTML = '';
              const items = getHist();
              const current = items[items.length - 1] || '';
              if (!isRepeatEntry) {
                if ((row[field.name] ?? '') !== current) row[field.name] = current || '';
              } else if (Number.isInteger(idxForRepeatable)) {
                if (!Array.isArray(row[field.name])) row[field.name] = [];
                if ((row[field.name][idxForRepeatable] ?? '') !== current) {
                  row[field.name][idxForRepeatable] = current || '';
                }
              }
    
              items.forEach((name, idx) => {
                const safe = esc(name);
                const li = document.createElement('li');
                li.dataset.name = name;
                li.className = 'file-row';
    
                const labelHTML = (idx < items.length - 1) ? `<del>${safe}</del>` : `${safe}`;
    
                const actions = document.createElement('span');
                actions.className = 'file-actions';
    
                if (name !== current) {
                  const chooseBtn = document.createElement('button');
                  chooseBtn.type = 'button';
                  chooseBtn.className = 'mini-btn';
                  chooseBtn.setAttribute('data-act','choose');
                  chooseBtn.textContent = '🎯';
                  actions.appendChild(chooseBtn);
                }
    
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'mini-btn';
                delBtn.setAttribute('data-act','delete');
                delBtn.textContent = '🗑️';
                actions.appendChild(delBtn);
    
                li.innerHTML = labelHTML + ' ';
                li.appendChild(actions);
    
                if (name !== current) {
                  setStatus(li, '🗄️', 'Ancienne version');
                } else {
                  const st = getFileStatus(name);
                  if (st === 'ok')         setStatus(li, '✅', 'Disponible');
                  else if (st==='missing') setStatus(li, '⚠️', 'Introuvable');
                  else                     setStatus(li, '❓', 'État inconnu (scan en cours)');
                }
    
                list.append(li);
              });
    
              Promise.resolve().then(() => {
                if (App.util.getCA()) App.files?.scanCurrentAnalyse?.();
              });
            }
    
            if (!list.dataset.bound) {
              list.dataset.bound = '1';
              list.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-act]');
                if (!btn) return;
                const act  = btn.getAttribute('data-act');
                const li   = btn.closest('li.file-row');
                const name = li?.dataset?.name || '';
                if (!name) return;
    
                const hist = getHist();
                const current = hist[hist.length - 1] || '';
    
                if (act === 'choose') {
                  const idx = hist.indexOf(name);
                  if (idx >= 0 && idx !== hist.length - 1) {
                    hist.splice(idx, 1);
                    hist.push(name);
                  }
                  if (isRepeatEntry) onChange?.(name);
                  else { row[field.name] = name; onChange?.(name); }
                  setFileStatus(name, 'ok');
                  persist().then(() => { 
                    drawList(); 
                    App.form?.refreshProgressUI?.(); 
                  });
                }
    
                if (act === 'delete') {
                  if (!confirm(`Retirer « ${name} » de ce bloc ?`)) return;
                  const idx = hist.indexOf(name);
                  if (idx >= 0) hist.splice(idx, 1);
    
                  if (name === current) {
                    const next = hist[hist.length - 1] || '';
                    if (isRepeatEntry) onChange?.(next);
                    else { row[field.name] = next; onChange?.(next); }
                  }
                  setFileStatus(name, 'unknown');
                  try { App.storage?.del?.('fsHandles', App.files?._key?.(App.state.currentAnalyse.id, name)); } catch {}
    
                  persist().then(() => { 
                    drawList(); 
                    App.form?.refreshProgressUI?.(); 
                  });
                }
              });
            }
    
            drawList();
    
            async function commitFile(savedName, dirHandle){
              const CA = App.util.getCA();
              if (!CA) {
                fileInput.value = '';
                uploadBtn.style.display = 'none';
                return;
              }
    
              if (isRepeatEntry) {
                onChange?.(savedName);
              } else {
                row[field.name] = savedName;
                onChange?.(savedName);
              }
    
              const hist = getHist();
              if (hist[hist.length - 1] !== savedName) hist.push(savedName);
    
              persist().catch(()=>{});
              App.form?.refreshProgressUI?.();
    
              drawList();
              setFileStatus(savedName, 'ok');
    
              const li = list.lastElementChild;
              if (li) {
                try {
                  if (dirHandle) {
                    await App.files.updateIndicator(li, { url: savedName }, { project: CA, dirHandle });
                  } else {
                    App.files.setStatus(li, '✅', 'Disponible (session, non persisté)');
                  }
                } catch {}
              }
              if (dirHandle) {
                try { await App.files.rememberHandle(CA, savedName, dirHandle); } catch {}
              }
    
              fileInput.value = '';
              uploadBtn.style.display = 'none';
            }
    
            if (!uploadBtn.dataset.bound) {
              uploadBtn.dataset.bound = '1';
              uploadBtn.addEventListener('click', async () => {
                const f = fileInput.files?.[0];
                if (!f) { alert('Choisissez un fichier.'); return; }
                const CA = App.util.getCA();
                if (!CA) { alert('Aucun projet ouvert.'); return; }
    
                uploadBtn.disabled = true;
                let savedName = f.name, dirHandle = null;
                try {
                  const saved = await App.uiList.saveToRefDir(CA, f);
                  savedName = (typeof saved === 'string') ? saved : (saved?.fileName ?? savedName);
                  dirHandle = (typeof saved === 'object' && saved?.dirHandle) ? saved.dirHandle : null;
                } catch {
                  App.uiList?.showToast?.("Fichier ajouté (non persisté dans le dossier de référence).", 2500, 'info');
                }
                await commitFile(savedName, dirHandle);
                uploadBtn.disabled = false;
              });
            }
    
            inputRow.append(fileInput, uploadBtn);
            //const wrap = el('div', {});
            wrap.append(inputRow, list);
            return wrap;
          }
    
          default: {
            const inp = el('input', {...attrs, type:'text'});
            inp.value = value || '';
            inp.addEventListener('input', e => onChange(e.target.value));
            return inp;
          }
        }
      }
    
      // -------- API exposée
      App.form = {
        renderForm,
        renderInputForField,
        computeProgress,
        buildFilterSnapshot,
        updateCompletionBannerUI,
        headerMissing,
        pruneItemFieldIfEmpty,
        computeProgressByProcess,
        refreshProgressUI
      };
    
      App.form._multiPage = App.form._multiPage || Object.create(null);
      App.form.getProcPage = (key) => {
        const v = App.form._multiPage[key];
        return Number.isInteger(v) ? v : 0;
      };
      App.form.setProcPage = (key, page) => {
        App.form._multiPage[key] = Math.max(0, page|0);
      };
    
      App._ready = App._ready || {};
      App._ready.form = true;
    
      window.addEventListener('beforeunload', saveLS);
    })();
    </script>
    

<script>
// =============================================================================
// MODULE App.files — Vérification HTTP + Fichiers locaux (File System Access)
// =============================================================================

App.files = App.files || {};

// ————— Détection du support File System Access API —————
App.files.hasFS = !!(window.showDirectoryPicker || window.FileSystemDirectoryHandle);

// ————— UI : création / mise à jour d’un badge d’état —————
App.files.setStatus = function setStatus(root, char, title) {
  if (!root) return;
  let badge = root.querySelector('.file-status');
  if (!badge) {
    badge = document.createElement('span');
    badge.className = 'file-status';
    root.insertBefore(badge, root.firstChild);
  }
  badge.textContent = char;
  badge.title = title || '';
};

// ————— Gestion des handles de dossier (stockage local) —————
App.files._key = (projectId, fileName) => `${projectId}::${fileName}`;
App.files._dirMap = new Map(); // clé: projectId → dirHandle

App.files.rememberHandle = async function rememberHandle(project, fileName, dirHandle) {
  if (!project || !fileName) return;
  try {
    await App.storage.put('fsHandles', {
      id: App.files._key(project.id, fileName),
      projectId: project.id,
      fileName,
      dirHandle: dirHandle || null
    });
    if (!App.files._dirMap) App.files._dirMap = new Map();
    if (dirHandle) App.files._dirMap.set(project.id, dirHandle);
  } catch (err) {
    console.warn('[App.files] rememberHandle: échec d’enregistrement', err);
  }
};


App.files.restoreHandles = async function restoreHandles() {
  try {
    const rows = await App.storage.all('fsHandles');
    if (!Array.isArray(rows)) return;
    App.files._dirMap.clear();
    for (const r of rows) {
      if (!r?.projectId || !r?.dirHandle) continue;
      if (!App.files._dirMap.has(r.projectId)) {
        App.files._dirMap.set(r.projectId, r.dirHandle);
      }
    }
    console.log('[App.files] handles restaurés:', App.files._dirMap.size);
  } catch (e) {
    console.warn('[App.files] restoreHandles:', e);
  }
};

App.files.getDirForAnalyse = project =>
  project ? App.files._dirMap.get(project.id) || null : null;

// ————— Vérification HTTP —————
App.files.checkHttp = async function checkHttp(url) {
  try {
    const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    if (res.ok) return { ok: true };
    return { ok: false, status: res.status };
  } catch {
    return { ok: false, status: 0 };
  }
};

// ————— Vérification locale (File System Access) —————
App.files.ensurePermission = async function ensurePermission(dirHandle, mode = 'read') {
  if (!dirHandle?.queryPermission || !dirHandle?.requestPermission) return false;
  try {
    const wanted = mode === 'readwrite' ? { mode: 'readwrite' } : { mode: 'read' };
    const state = await dirHandle.queryPermission(wanted);
    if (state === 'granted') return true;
    if (state === 'prompt') {
      const res = await dirHandle.requestPermission(wanted);
      return res === 'granted';
    }
    return false;
  } catch {
    return false;
  }
};

App.files.checkLocalFile = async function checkLocalFile(dirHandle, fileName) {
  if (!dirHandle?.getFileHandle) return { ok: false, reason: 'no-handle' };
  try {
    const perm = await App.files.ensurePermission(dirHandle, 'read');
    if (!perm) return { ok: false, reason: 'no-permission' };

    await dirHandle.getFileHandle(fileName, { create: false });
    return { ok: true };
  } catch {
    return { ok: false, reason: 'not-found' };
  }
};

// ————— Mise à jour d’un élément (icône + info) —————
App.files.updateIndicator = async function updateIndicator(root, { url }, ctx = {}) {
  if (!root) return;
  const project = ctx?.project || App?.state?.currentAnalyse;

  // Aucun fichier
  if (!url) {
    App.files.setStatus(root, '❓', 'Aucun fichier défini');
    return;
  }

  // Cas HTTP
  if (/^https?:\/\//i.test(url)) {
    try {
      const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      if (res.ok) App.files.setStatus(root, '✅', 'Fichier accessible en ligne');
      else App.files.setStatus(root, '⚠️', `Introuvable (HTTP ${res.status})`);
    } catch {
      App.files.setStatus(root, '⚠️', 'Erreur réseau / ressource inaccessible');
    }
    return;
  }

  // Cas local
  const dir = (ctx && ctx.dirHandle) || App.files.getDirForAnalyse(project);
  if (!dir) {
    App.files.setStatus(root, '⚠️', 'Dossier de référence non restauré');
    App.files._attachAssociateButton?.(root, project, String(url));
    return;
  }

  const perm = await App.files.ensurePermission(dir, 'read');
  if (!perm) {
    App.files.setStatus(root, '⚠️', 'Permission requise sur le dossier');
    App.files._attachAssociateButton?.(root, project, String(url));
    return;
  }

  try {
    await dir.getFileHandle(url, { create: false });
    App.files.setStatus(root, '✅', 'Fichier présent dans le dossier de référence');
  } catch {
    App.files.setStatus(root, '⚠️', 'Fichier introuvable dans le dossier de référence');
  }
};

// ————— Scan global de la page —————
App.files.scanCurrentAnalyse = async function scanCurrentAnalyse() {
  const project = App?.state?.currentAnalyse;
  if (!project) return;

  const items = document.querySelectorAll('li[data-file-value]');
  for (const li of items) {
    const url = li.getAttribute('data-file-value') || '';
    await App.files.updateIndicator(li, { url }, { project });
  }
};

// ————— Bouton “Associer dossier” —————
App.files._attachAssociateButton = function _attachAssociateButton(root, project, fileName) {
  if (root.querySelector('.associate-btn')) return;
  if (!window.showDirectoryPicker) return;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'associate-btn btn xs';
  btn.textContent = 'Associer dossier…';
  btn.title = 'Sélectionner le dossier contenant ce fichier pour pouvoir le vérifier';

  btn.addEventListener('click', async () => {
    try {
      const dir = await window.showDirectoryPicker();
      await App.files.rememberHandle(project, fileName, dir);
      await App.files.updateIndicator(root, { url: fileName }, { project });
      App.uiList?.showToast?.('Dossier associé. Vérification effectuée.', 2200, 'success');
    } catch (_) {}
  });

  root.append(' ', btn);
};

console.log('[App.files] Module chargé');
</script>

<script>
(() => {
  // ============================================================
  //  Preview (HTML) + ZIP + ODT export — version adaptée/robuste
  // ============================================================

  // ---------- ÉTAT ----------
  let isPreviewOpen = false;

  // ---------- HELPERS GÉNÉRIQUES ----------
  const has = (obj, k) => Object.prototype.hasOwnProperty.call(obj || {}, k);
  const el  = (t, a={}, o={}) => (App?.util?.el ? App.util.el(t,a,o) : (()=>{const n=document.createElement(t); for(const[k,v] of Object.entries(a||{})){ if(k==='class') n.className=v; else if(k.startsWith('on')&&typeof v==='function'){ n.addEventListener(k.slice(2),v);} else if(typeof v==='boolean'){ if(v) n.setAttribute(k,'');} else if(v!=null) n.setAttribute(k,v);} (o.children||[]).forEach(c=>n.append(c)); return n;})());
  const $   = (s, r=document) => (App?.util?.$ ? App.util.$(s,r) : r.querySelector(s));
  const todayISO = () => (App?.util?.todayISO ? App.util.todayISO() : new Date().toISOString().slice(0,10));
  const slug = (s) => (App?.util?.slug ? App.util.slug(s) : String(s||'').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9_-]+/g,''));
  const xmlEscape = (s) => String(s ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&apos;');
  const htmlEscape = (s) => String(s ?? '').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

  // ---------- DATES ----------
  function getDateDisplayFromRawContainer(container, fieldName){
  const key = fieldName + '__raw';
  const hasDataRaw = !!(container && container.data && has(container.data, key));
  const raw = hasDataRaw
    ? container.data[key]
    : (container && has(container, key) ? container[key] : '');
  if (raw) return raw;
  const official = hasDataRaw
    ? (container?.data ? container.data[fieldName] : '')
    : (container ? container[fieldName] : '');
  const ok = App?.util?.parseDateStrict ? App.util.parseDateStrict(official) : /^\d{4}-\d{2}-\d{2}$/.test(String(official||'').trim());
  return ok ? official : '';
}

  // ---------- RENDU CELLULE (HTML) ----------
  function renderKVCellValue(field, value){
    if (field?.type === 'textarea') {
      const val = value ?? '';
      if (val === '') return '<span>—</span>';
      const safe = String(val)
        .replace(/[&<>]/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m]))
        .replace(/\t/g, '    ')
        .replace(/ {2,}/g, m => '&nbsp;'.repeat(m.length))
        .replace(/\r?\n/g, '<br>');
      return `<div class="mono">${safe}</div>`;
    }
    if (field?.type === 'checkbox') return `<span>${value ? 'Oui' : 'Non'}</span>`;
    return (value ?? '') === '' ? '<span>—</span>'
                                : `<span>${String(value).replace(/[&<>]/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m]))}</span>`;
  }

  // ---------- LINKIFY (safe) ----------
  function linkifyHTML(input){
    if (input == null || input === '') return '';
    const esc = String(input)
      .replaceAll('&','&amp;').replaceAll('<','&lt;')
      .replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'", '&#39;');
    const pattern = /\b([a-zA-Z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})\b|(\bhttps?:\/\/[^\s<>'"]{2,})|(\bwww\.[^\s<>'"]{2,})/g;
    return esc.replace(pattern, (m, email, httpUrl, wwwUrl) => {
      if (email) return `<a href="mailto:${email}">${email}</a>`;
      if (httpUrl) return `<a href="${httpUrl}" target="_blank" rel="noopener noreferrer">${httpUrl}</a>`;
      if (wwwUrl)  return `<a href="https://${wwwUrl}" target="_blank" rel="noopener noreferrer">${wwwUrl}</a>`;
      return m;
    });
  }

  // ---------- BUILD PREVIEW HTML ----------
// ---------- BUILD PREVIEW HTML ----------
function buildPreviewHTML(project){
  const H = (lvl, txt)=> `<h${lvl}>${htmlEscape(txt)}</h${lvl}>`;
  const P = txt => `<p>${htmlEscape(txt)}</p>`;

  const headerDate = (() => {
    const raw = App?.util?.getRawHeader ? (App.util.getRawHeader(project, 'headerDate') || '') : '';
    if (raw) return raw;
    const ok = App?.util?.parseDateStrict ? App.util.parseDateStrict(project?.date) : /^\d{4}-\d{2}-\d{2}$/.test(String(project?.date||''));
    return ok ? project.date : '';
  })();

  const renderCell = (field, value) => {
    if (field?.type === 'textarea') {
      if ((value ?? '') === '') return '<span>—</span>';
      const linked = linkifyHTML(String(value))
        .replace(/\t/g,'    ').replace(/ {2,}/g,m=>'&nbsp;'.repeat(m.length))
        .replace(/\r?\n/g,'<br>');
      return `<div class="mono">${linked}</div>`;
    }
    if (field?.type === 'checkbox') return `<span>${value ? 'Oui' : 'Non'}</span>`;

    // ➕ afficher chaque item d’un champ répétable sur sa propre ligne
    if (Array.isArray(value)) {
      if (!value.length) return '<span>—</span>';
      const items = value.map(v => `<div>${linkifyHTML(String(v ?? ''))}</div>`).join('');
      return items;
    }

    return (value ?? '') === '' ? '<span>—</span>' : `<span>${linkifyHTML(String(value))}</span>`;
  };

  // Rend TOUTES les sections fournies (tableau de sections)
  const renderSectionsTable = (TPL_SECTIONS) => {
    let out = '';
    TPL_SECTIONS.forEach((section, sidx) => {
      out += H(2, section?.title || `Section ${sidx+1}`);

      const tableStart = `<table class="kv" role="table"><colgroup><col style="width:220px"><col></colgroup><tbody>`;
      let table = tableStart;

      const renderFieldsFlat = (row, fields, prefixTitle) => {
        if (prefixTitle) table += `<tr><th colspan="2"><div class="kv-group">${htmlEscape(prefixTitle)}</div></th></tr>`;
        fields.forEach(f => {
          const label = f?.label || f?.name || '';
          const val = f.type === 'date' ? getDateDisplayFromRawContainer(row, f.name) : (row?.[f.name] ?? '');
          table += `<tr><th>${htmlEscape(label)}</th><td>${renderCell(f, val)}</td></tr>`;
        });
      };

      if (section?.repeatable) {
        const key = App?.model?.sectionKeyOf ? App.model.sectionKeyOf(section, sidx) : `section-${sidx+1}`;
        const items = Array.isArray(project?.data?.[key]) ? project.data[key] : [];
        if (items.length === 0) {
          table += `<tr><th>${htmlEscape(section?.title || 'Bloc')}</th><td>—</td></tr>`;
        } else {
          items.forEach((item, i) => {
            table += `<tr><th colspan="2"><div class="kv-title">${htmlEscape(section?.title || 'Bloc')} (${i+1})</div></th></tr>`;
            (section.fields || []).forEach(entry => {
              if (entry && entry.group && Array.isArray(entry.fields)) {
                const g = entry.group;
                if (g.repeatable) {
                  const GKEY = `__grp__${g.name}`;
                  const arr = Array.isArray(item[GKEY]) ? item[GKEY] : [];
                  if (arr.length === 0) {
                    table += `<tr><th>${htmlEscape(g.label || g.name)}</th><td>—</td></tr>`;
                  } else {
                    arr.forEach((obj, j) => renderFieldsFlat(obj, entry.fields, `${g.label || g.name} (${j+1})`));
                  }
                } else {
                  renderFieldsFlat(item, entry.fields, g.label || g.name);
                }
              } else {
                const label = entry?.label || entry?.name || '';
                const val = entry.type==='date' ? getDateDisplayFromRawContainer(item, entry.name) : (item?.[entry.name] ?? '');
                table += `<tr><th>${htmlEscape(label)}</th><td>${renderCell(entry, val)}</td></tr>`;
              }
            });
            table += `<tr class="subsep"><td colspan="2"></td></tr>`;
          });
        }
        table += `</tbody></table>`;
        out += table;
        return;
      }

      // ---- section non répétable (➡ lire dans ROW namespacée)
      const key = App?.model?.sectionKeyOf ? App.model.sectionKeyOf(section, sidx) : `section-${sidx+1}`;
      const ROW = (project?.data && project.data[key]) ? project.data[key] : {};

      (section.fields || []).forEach(entry => {
        if (entry && entry.group && Array.isArray(entry.fields)) {
          const g = entry.group;
          if (g.repeatable) {
            const KEY = `__grp__${g.name}`;
            const arr = Array.isArray(ROW?.[KEY]) ? ROW[KEY] : [];
            if (arr.length === 0) {
              table += `<tr><th>${htmlEscape(g.label || g.name)}</th><td>—</td></tr>`;
            } else {
              arr.forEach((obj, i) => renderFieldsFlat(obj, entry.fields, `${g.label || g.name} (${i+1})`));
            }
          } else {
            renderFieldsFlat(ROW, entry.fields, g.label || g.name);
          }
          return;
        }

        const label = entry?.label || entry?.name || '';
        const val = entry.type==='date'
          ? getDateDisplayFromRawContainer(ROW, entry.name)
          : (ROW?.[entry.name] ?? '');
        table += `<tr><th>${htmlEscape(label)}</th><td>${renderCell(entry, val)}</td></tr>`;
      });

      table += `</tbody></table>`;
      out += table;
    });
    return out;
  };

  // ——— Début HTML ———
  let html = '';
  html += H(1, `project · ${project?.title || 'sans-titre'}`);
  html += P(`Date : ${headerDate || '—'}`);
  html += `<hr class="divider">`;

  // Multi-processus ?
  const PRO = App?.model?.PROCESSES;
  if (Array.isArray(PRO) && PRO.length){
    PRO.forEach((proc, pi)=>{
      html += H(2, proc?.name || `Processus ${pi+1}`);
      html += renderSectionsTable(proc?.sections || []);
      if (pi < PRO.length-1) html += `<hr class="divider">`;
    });
    return html;
  }

  // Mono (historique)
  const TPL = App?.model?.TEMPLATE || [];
  html += renderSectionsTable(TPL);
  return html;
}

  // ---------- ZIP UTILS (STORED, NO COMPRESSION) ----------
  function crc32(buf){
    let t=crc32.table;
    if(!t){
      t=crc32.table=new Uint32Array(256);
      for(let i=0;i<256;i++){
        let c=i;
        for(let j=0;j<8;j++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
        t[i]=c>>>0;
      }
    }
    let crc=~0;
    for(let i=0;i<buf.length;i++) crc=t[(crc^buf[i])&0xFF]^(crc>>>8);
    return (~crc)>>>0;
  }

  const strToU8 = s => new TextEncoder().encode(s);
  const u32le = n => { const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,n,true); return b; };
  const u16le = n => { const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n,true); return b; };

    // util pour DOS time/date (local time)
    function dosTimeDate(d = new Date()){
      const sec   = Math.floor(d.getSeconds() / 2);                 // 2-second resolution
      const min   = d.getMinutes();
      const hour  = d.getHours();
      const day   = d.getDate();
      const month = d.getMonth() + 1;                                // 1..12
      const year  = Math.max(1980, d.getFullYear());                 // DOS base year
      const dosTime = (hour << 11) | (min << 5) | sec;
      const dosDate = ((year - 1980) << 9) | (month << 5) | day;
      return { dosTime, dosDate };
    }
    
    // ...dans createZip(files) : au lieu de TIME/DATE constants
    function createZip(files){
      const LFH=0x04034b50, CDH=0x02014b50, EOCD=0x06054b50, VERSION=20, GP=0, METHOD=0;
      let parts=[], central=[], offset=0;
      for(const f of files){
        const nameU8 = strToU8(f.name);
        const data   = f.data;
        const crc    = crc32(data);
        const size   = data.length;
    
        // Autoriser f.mtime (Date) sinon prendre maintenant
        const { dosTime, dosDate } = dosTimeDate(f.mtime instanceof Date ? f.mtime : new Date());
    
        const lfh=[u32le(LFH),u16le(VERSION),u16le(GP),u16le(METHOD),u16le(dosTime),u16le(dosDate),
                   u32le(crc),u32le(size),u32le(size),u16le(nameU8.length),u16le(0)];
        parts.push(...lfh, nameU8, data);
    
        const lfhLen = lfh.reduce((a,b)=>a+b.length,0)+nameU8.length+data.length;
    
        const cdh=[u32le(CDH),u16le(0x031E),u16le(VERSION),u16le(GP),u16le(METHOD),u16le(dosTime),u16le(dosDate),
                   u32le(crc),u32le(size),u32le(size),u16le(nameU8.length),u16le(0),u16le(0),u16le(0),u16le(0),
                   u32le(0),u32le(offset)];
        central.push(...cdh, nameU8);
        offset+=lfhLen;
      }
      const centralSize=central.reduce((a,b)=>a+b.length,0), centralStart=offset;
      const eocd=[u32le(EOCD),u16le(0),u16le(0),u16le(files.length),u16le(files.length),u32le(centralSize),u32le(centralStart),u16le(0)];
      const blobParts=[...parts,...central,...eocd], out=new Uint8Array(blobParts.reduce((a,b)=>a+b.length,0));
      { let p=0; for(const part of blobParts){ out.set(part,p); p+=part.length; } }
      return new Blob([out],{type:'application/zip'});
    }


  // ---------- ODT (OpenDocument Text) ----------
  function buildODTContent(project) {
  const title = project?.title || 'sans-titre';
  const date  = project?.date  || todayISO();

  function odtTextPreserve(txt) {
    if (txt == null || txt === '') return '<text:p text:style-name="Body">—</text:p>';
    const esc = xmlEscape(String(txt));
    const withTabs   = esc.replace(/\t/g, '<text:tab/>');
    const withSpaces = withTabs.replace(/ {2,}/g, m => `<text:s text:c="${m.length}"/>`);
    const lines = withSpaces.split(/\r?\n/);
    return `<text:p text:style-name="Body">${lines.map((l,i)=> (i?'<text:line-break/>':'') + l).join('')}</text:p>`;
  }

  const humanizeValue = (field, raw) => {
    if (field?.type === 'checkbox') return raw ? 'Oui' : 'Non';
    if (raw == null || raw === '') return '—';
    return String(raw);
  };

  const H = (lvl, txt) =>
    `<text:h text:outline-level="${lvl}" text:style-name="${lvl===1?'H1':'H2'}">${xmlEscape(txt)}</text:h>`;
  const P = txt => `<text:p text:style-name="Body">${xmlEscape(txt)}</text:p>`;
  const GAP = () => `<text:p text:style-name="Spacer"/>`;

  const kvRow = (label, valueXML) => `
    <table:table-row>
      <table:table-cell table:style-name="KVLabelCell" office:value-type="string">
        <text:p text:style-name="Label">${xmlEscape(label)}</text:p>
      </table:table-cell>
      <table:table-cell table:style-name="KVCell" office:value-type="string">
        ${valueXML}
      </table:table-cell>
    </table:table-row>`;

  const valueToXML = (field, raw) => {
    if (field?.type === 'textarea') return odtTextPreserve(raw);
    return `<text:p text:style-name="Body">${xmlEscape(humanizeValue(field, raw))}</text:p>`;
  };

  let body = '';
  body += H(1, `project · ${title}`);
  body += P(`Date : ${date}`);
  body += `<text:p text:style-name="Body"/>`;

  // ---- Rendu des sections en ODT (mono ou multi)
  const renderSections = (SECTIONS) => {
    SECTIONS.forEach((section, idx) => {
      body += H(2, section?.title || `Section ${idx + 1}`);

      if (section?.repeatable) {
        const sectionKey = App?.model?.sectionKeyOf ? App.model.sectionKeyOf(section, idx) : `section-${idx+1}`;
        const items = Array.isArray(project?.data?.[sectionKey]) ? project.data[sectionKey] : [];
        body += `<table:table table:style-name="KVTable">`;
        if (items.length === 0) {
          body += kvRow(section?.title || 'Bloc', `<text:p text:style-name="Body">—</text:p>`);
        } else {
          items.forEach((item, i) => {
            // titre de bloc
            body += kvRow(`${section?.title || 'Bloc'} (${i+1})`, `<text:p text:style-name="Body"></text:p>`);
            (section.fields || []).forEach(entry => {
              if (entry && entry.group && Array.isArray(entry.fields)) {
                const g = entry.group;
                if (g.repeatable) {
                  const GKEY = `__grp__${g.name}`;
                  const arr = Array.isArray(item[GKEY]) ? item[GKEY] : [];
                  let block = '';
                  if (arr.length === 0) {
                    block = `<text:p text:style-name="Body">—</text:p>`;
                  } else {
                    arr.forEach((gobj, gi) => {
                      block += `<text:p text:style-name="Label">${xmlEscape((g.label||g.name)+` (${gi+1}) :`)}</text:p>`;
                      (entry.fields||[]).forEach(sf=>{
                        const raw = sf.type==='date'
                          ? getDateDisplayFromRawContainer(gobj, sf.name)
                          : gobj?.[sf.name];
                        const pretty = (sf.type==='textarea') ? odtTextPreserve(raw)
                          : `<text:p text:style-name="Body">${xmlEscape(humanizeValue(sf, raw))}</text:p>`;
                        block += `<text:p text:style-name="Label">${xmlEscape((sf?.label||sf?.name)+ ' :')}</text:p>`;
                        block += pretty;
                      });
                      if (gi < arr.length-1) block += GAP();
                    });
                  }
                  body += kvRow(g.label || g.name, block);
                } else {
                  let block = '';
                  (entry.fields||[]).forEach(sf=>{
                    const raw = sf.type==='date'
                      ? getDateDisplayFromRawContainer(item, sf.name)
                      : item?.[sf.name];
                    block += `<text:p text:style-name="Label">${xmlEscape((sf?.label||sf?.name)+ ' :')}</text:p>`;
                    block += valueToXML(sf, raw);
                  });
                  body += kvRow(g.label || g.name, block);
                }
                return;
              }

              const label = entry?.label || entry?.name || '';
              const raw   = (entry.type==='date')
                ? getDateDisplayFromRawContainer(item, entry.name)
                : item?.[entry?.name];
              body += kvRow(label, valueToXML(entry, raw));
            });
          });
        }
        body += `</table:table><text:p text:style-name="Body"/>`;
        return;
      }

      // ---- section non répétable (mono) ➜ lire dans ROW namespacée
      const sectionKey = App?.model?.sectionKeyOf ? App.model.sectionKeyOf(section, idx) : `section-${idx+1}`;
      const ROW = (project?.data && project.data[sectionKey]) ? project.data[sectionKey] : {};

      body += `<table:table table:style-name="KVTable">`;
      (section.fields || []).forEach(field => {
        if (field && field.group && Array.isArray(field.fields)) {
          const g = field.group;
          let block = '';
          if (g.repeatable) {
            const KEY = `__grp__${g.name}`;
            const arr = Array.isArray(ROW?.[KEY]) ? ROW[KEY] : [];
            if (arr.length === 0) {
              block = `<text:p text:style-name="Body">—</text:p>`;
            } else {
              arr.forEach((obj, i) => {
                block += `<text:p text:style-name="Label">${xmlEscape((g.label||g.name)+` (${i+1}) :`)}</text:p>`;
                (field.fields||[]).forEach(sf=>{
                  const raw = sf.type==='date'
                    ? getDateDisplayFromRawContainer(obj, sf.name)
                    : obj?.[sf.name];
                  block += `<text:p text:style-name="Label">${xmlEscape((sf?.label||sf?.name)+ ' :')}</text:p>`;
                  block += valueToXML(sf, raw);
                });
                if (i < arr.length-1) block += GAP();
              });
            }
            body += kvRow(g.label || g.name, block);
            return;
          }
          // groupe simple
          (field.fields||[]).forEach(sf=>{
            const raw = sf.type==='date'
              ? getDateDisplayFromRawContainer(ROW, sf.name)
              : ROW?.[sf.name];
            body += kvRow(sf?.label || sf?.name, valueToXML(sf, raw));
          });
          return;
        }

        const label = field?.label || field?.name || '';
        const raw   = (field.type==='date')
          ? getDateDisplayFromRawContainer(ROW, field.name)
          : ROW?.[field?.name];
        body += kvRow(label, valueToXML(field, raw));
      });
      body += `</table:table><text:p text:style-name="Body"/>`;
    });
  };

  // 👉 multi-processus : on boucle sur chaque process, sinon mono
  const PRO = App?.model?.PROCESSES;
  if (Array.isArray(PRO) && PRO.length){
    PRO.forEach((proc, pidx)=>{
      body += H(2, proc?.name || `Processus ${pidx+1}`);
      renderSections(proc?.sections || []);
      body += `<text:p text:style-name="Body"/>`;
    });
  } else {
    renderSections(App?.model?.TEMPLATE || []);
  }

  const contentXML =
`<?xml version="1.0" encoding="UTF-8"?>
<office:document-content
 xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"
 xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0"
 xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0"
 xmlns:table="urn:oasis:names:tc:opendocument:xmlns:table:1.0"
 xmlns:draw="urn:oasis:names:tc:opendocument:xmlns:drawing:1.0"
 xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0"
 office:version="1.2">
  <office:automatic-styles>
    <style:style style:name="H1" style:family="paragraph">
      <style:paragraph-properties fo:margin-top="3mm" fo:margin-bottom="2mm"/>
      <style:text-properties fo:font-size="16pt" fo:font-weight="bold"/>
    </style:style>
    <style:style style:name="H2" style:family="paragraph">
      <style:paragraph-properties fo:margin-top="2.5mm" fo:margin-bottom="1.5mm"/>
      <style:text-properties fo:font-size="13pt" fo:font-weight="bold" fo:color="#556070"/>
    </style:style>
    <style:style style:name="Label" style:family="paragraph">
      <style:text-properties fo:font-weight="bold" fo:color="#556070"/>
    </style:style>
    <style:style style:name="Body" style:family="paragraph">
      <style:paragraph-properties fo:margin-bottom="1.2mm"/>
    </style:style>
    <style:style style:name="Spacer" style:family="paragraph">
      <style:paragraph-properties fo:margin-top="0mm" fo:margin-bottom="1.8mm"/>
    </style:style>
    <style:style style:name="KVTable" style:family="table">
      <style:table-properties table:border-model="collapsing"/>
    </style:style>
    <style:style style:name="KVCell" style:family="table-cell">
      <style:table-cell-properties fo:padding="2mm" fo:border="0.5pt solid #e7e9ef"/>
    </style:style>
    <style:style style:name="KVLabelCell" style:family="table-cell">
      <style:table-cell-properties fo:padding="2mm" fo:border="0.5pt solid #e7e9ef" fo:background-color="#fafbff"/>
    </style:style>
  </office:automatic-styles>
  <office:body>
    <office:text>${body}</office:text>
  </office:body>
</office:document-content>`;

  const metaXML =
`<?xml version="1.0" encoding="UTF-8"?>
<office:document-meta
 xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"
 xmlns:meta="urn:oasis:names:tc:opendocument:xmlns:meta:1.0"
 xmlns:dc="http://purl.org/dc/elements/1.1/"
 office:version="1.2">
  <office:meta>
    <dc:title>${xmlEscape(`${date} - project - ${title}`)}</dc:title>
    <meta:creation-date>${new Date().toISOString()}</meta:creation-date>
    <meta:generator>projets Single-File</meta:generator>
  </office:meta>
</office:document-meta>`;

  const stylesXML =
`<?xml version="1.0" encoding="UTF-8"?>
<office:document-styles
 xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"
 xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0"
 xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0"
 office:version="1.2">
  <office:styles/>
  <office:automatic-styles/>
  <office:master-styles/>
</office:document-styles>`;

  const manifestXML =
`<?xml version="1.0" encoding="UTF-8"?>
<manifest:manifest
 xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0"
 manifest:version="1.2">
  <manifest:file-entry manifest:full-path="/" manifest:media-type="application/vnd.oasis.opendocument.text"/>
  <manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/>
  <manifest:file-entry manifest:full-path="meta.xml"    manifest:media-type="text/xml"/>
  <manifest:file-entry manifest:full-path="styles.xml"  manifest:media-type="text/xml"/>
</manifest:manifest>`;

  return [
    { name: 'mimetype', data: strToU8('application/vnd.oasis.opendocument.text') }, // doit être premier, non compressé
    { name: 'content.xml',  data: strToU8(contentXML) },
    { name: 'meta.xml',     data: strToU8(metaXML) },
    { name: 'styles.xml',   data: strToU8(stylesXML) },
    { name: 'META-INF/manifest.xml', data: strToU8(manifestXML) }
  ];
}

  // remplace/complete ta getAllFilesForAnalyse actuelle
async function getAllFilesForAnalyse(project) {
  // ------------- utils
  const norm = (s) => String(s ?? '')
    .replace(/[\u200B-\u200D\uFEFF]/g, '') // zero-width
    .replace(/\u00A0/g, ' ')               // nbsp -> espace
    .normalize('NFKC')
    .trim()
    .replace(/\s+/g, ' ')
    .toLocaleLowerCase();

  const isFilename = (s) => /\.[a-z0-9]{2,8}$/i.test(String(s || ''));

  // ------------- collecte des noms attendus (clé normalisée -> 1er libellé)
  const expected = new Map();

  // (A) DOM du process courant (si présent)
  try {
    // data-file-value (ex: <div data-file-value="x.pdf">)
    document.querySelectorAll('[data-file-value]').forEach(el => {
      const raw = el.getAttribute('data-file-value') || '';
      if (!isFilename(raw)) return;
      const k = norm(raw);
      if (k && !expected.has(k)) expected.set(k, String(raw).trim());
    });

    // lignes avec data-name / classes usuelles porteurs du nom
    document.querySelectorAll('[data-name], .file-name, .filename, [class*="file"][class*="name"]').forEach(el => {
      const raw = el.getAttribute?.('data-name') ?? el.textContent ?? '';
      if (!isFilename(raw)) return;
      const k = norm(raw);
      if (k && !expected.has(k)) expected.set(k, String(raw).trim());
    });
  } catch {}

  // (B) project.data (listes __listed) — avec garde-fous pour ne pas “fuir” d’un autre process
  try {
    // détecter les clés __listed vraiment visibles (si on les a)
    const visible = new Set();
    document.querySelectorAll('input[name$="__listed"], textarea[name$="__listed"], [data-listed-key$="__listed"]')
      .forEach(el => {
        const k = el.getAttribute('name') || el.getAttribute('data-listed-key');
        if (k) visible.add(k);
      });

    const useFilter = visible.size > 0;

    const addFromDataDeep = (obj) => {
      if (!obj || typeof obj !== 'object') return;
      if (Array.isArray(obj)) { obj.forEach(addFromDataDeep); return; }
      for (const [k, v] of Object.entries(obj)) {
        if (k.endsWith('__listed')) {
          if (useFilter && !visible.has(k)) continue; // on filtre si on connaît les listes visibles
          const arr = Array.isArray(v) ? (Array.isArray(v[0]) ? v.flat() : v)
                                       : (typeof v === 'string' ? [v] : []);
          for (const s of arr) {
            if (typeof s !== 'string' || !isFilename(s)) continue;
            const key = norm(s);
            if (key && !expected.has(key)) expected.set(key, s.trim());
          }
        } else if (v && typeof v === 'object') {
          addFromDataDeep(v);
        }
      }
    };

    // --- stratégie SÛRE contre la fuite inter-process -----------------
    // On ne lit project.data que si des listes __listed sont VISIBLES dans l'UI.
    if (useFilter) {
      // On connaît les clés visibles → on peut compléter depuis project.data,
      // mais uniquement pour ces clés (le filtre est déjà appliqué plus haut).
      addFromDataDeep(project?.data);
    } else {
      // Aucune liste de fichiers visible dans le process courant :
      // on NE lit PAS project.data pour éviter d'embarquer des noms d'un ancien process.
      // On se contente de ce que le DOM a détecté (expected), éventuellement vide.
    }
  } catch {}

  // Rien trouvé ? on rend []
  if (expected.size === 0) {
    console.debug('[export] Aucun nom de fichier attendu détecté.');
    return [];
  }

  // ------------- buckets METIER (current / old) avec normalisation
  const toKey = norm; // même normalisation des deux côtés
  let current = new Set(), old = new Set();
  try {
    if (typeof computeFileBuckets === 'function') {
      const b = computeFileBuckets(project) || {};
      const asNormSet = (iterable) => {
        const S = new Set();
        for (const x of (iterable || [])) {
          const k = toKey(x);
          if (k) S.add(k);
        }
        return S;
      };
      current = asNormSet(b.current);
      old     = asNormSet(b.old);
    }
  } catch (e) {
    console.warn('[export] computeFileBuckets a échoué, tous en "current".', e);
  }

  // ------------- accès au dossier du projet (pour marquer présent/absent)
  let dir = App.files.getDirForAnalyse(project);
  if (!dir) { try { await App.files.restoreHandles(); } catch {} dir = App.files.getDirForAnalyse(project); }
  let canRead = false;
  if (dir && dir.getFileHandle) { try { canRead = await App.files.ensurePermission(dir, 'read'); } catch {} }

  // ------------- construction de la liste finale
  const out = [];
  for (const [, displayName] of expected) {
    const k = toKey(displayName);
    const inCur = current.has(k);
    const inOld = old.has(k);

    // Règle d’apparition :
    // - dans les 2 sets  → 2 lignes (current + old)
    // - seulement old    → 1 ligne barrée
    // - sinon            → 1 ligne non barrée
    const variants = (inCur && inOld) ? ['current', 'old'] : (inOld ? ['old'] : ['current']);

    // on lit le fichier (si possible) une seule fois par nom
    let okFile = null;
    if (canRead) {
      try {
        const fh = await dir.getFileHandle(displayName, { create: false });
        okFile = await fh.getFile();
      } catch {}
    }

    for (const variant of variants) {
      out.push({
        name: displayName,      // libellé original (préserve casse/espaces pour l’export)
        file: okFile || null,   // Blob | null
        missing: !okFile,       // pour l’UI
        variant                 // 'current' | 'old'
      });
    }
  }

  console.debug('[export] Fichiers attendus (variants):', out);
  return out;
}


     function computeFileBuckets(project){
           const norm = (s) => String(s ?? '').trim().normalize('NFKC');
           const current = new Set();
           const old = new Set();
           const data = project?.data || {};
     
           // rend "old/current" pour une pile donnée (liste plate)
           const feed = (list) => {
             const items = (Array.isArray(list) ? list : []).filter(v => typeof v === 'string');
             items.forEach((name, idx) => {
               const n = norm(name); if (!n) return;
               (idx < items.length - 1 ? old : current).add(n);
             });
           };
     
           Object.keys(data).forEach(k => {
             if (!k.endsWith('__listed')) return;
             const arr = Array.isArray(data[k]) ? data[k] : [];
             if (!arr.length) return;
             if (Array.isArray(arr[0])) {               // ← cas des sections répétables
               arr.forEach(sub => feed(sub));
             } else {
               feed(arr);
             }
           });
           return { current, old };
         }


async function exportFullBundleZip() {
  console.log('→ exportFullBundleZip déclenché');
  if (!App?.state?.currentAnalyse) {
    alert('Aucun projet ouvert.');
    return;
  }

  // 0) zip.js requis pour chiffrer le ZIP
  if (typeof zip === 'undefined' || !zip.ZipWriter) {

    throw new Error('zip.js requis pour export ZIP chiffré');
  }
  try { zip.configure?.({ useWebWorkers: false }); } catch {}

  const enq = App.state.currentAnalyse;

  // 1) Construire l’ODT à jour
  const odtFiles = buildODTContent(enq);
  const odtBlob  = createZip(odtFiles);
  const odtU8    = new Uint8Array(await odtBlob.arrayBuffer());
  const odtName  = `${(App?.util?.slug ? App.util.slug(enq?.title) : (s=>String(s||'').toLowerCase().replace(/\W+/g,'-'))(enq?.title)) || 'sans-titre'}.odt`;

  // 2) Récupérer tous les fichiers liés
  let fileRefs = [];
  try { fileRefs = await getAllFilesForAnalyse(enq); } catch { fileRefs = []; }

  // 3) Sélection utilisateur
  const resolved = await App.uiExport.openResolutionDialog(fileRefs);
  if (resolved === null) {
    console.log('Export annulé par l’utilisateur.');
    return;
  }

  // 4) Construire la liste finale des entrées (Uint8Array + nom)
  const entries = [];
  entries.push({ name: odtName, data: odtU8 });

  const { current, old } = computeFileBuckets(enq);
  for (const ref of resolved) {
    if (!ref.include || !ref.file) continue;
    const buf  = new Uint8Array(await ref.file.arrayBuffer());
    const norm = (s) => String(s ?? '').trim().normalize('NFKC');
    const key  = norm(ref.name);
    const inCurrent = current.has(key);
    const inOld     = old.has(key);
    if (inCurrent && inOld) {
      entries.push({ name: `files/${ref.name}`,     data: buf });
      entries.push({ name: `old_files/${ref.name}`, data: buf });
    } else if (inOld) {
      entries.push({ name: `old_files/${ref.name}`, data: buf });
    } else {
      entries.push({ name: `files/${ref.name}`,     data: buf });
    }
  }

  // 4bis) analysis.json en clair (le conteneur ZIP sera chiffré)
  const analysisJson = { type:'project-export', version:2, project: enq };
  entries.push({
    name: 'analysis.json',
    data: new TextEncoder().encode(JSON.stringify(analysisJson, null, 2))
  });

  // 5) Mot de passe obligatoire pour ce mode
  const pass = await App.uiList?.openPasswordDialog?.({ mode: 'unlock' });
  if (!pass) { App?.uiList?.showToast?.('Export annulé.', 2000, 'warn'); return; }

  // 6) Écrire le ZIP avec AES-256 (WinZip AES)
  const writer = new zip.ZipWriter(new zip.BlobWriter('application/zip'));
  const entryOpts = {
    password: pass,
    encryptionStrength: 3,   // 1=128, 2=192, 3=256
    compression: 'STORE'     // ou 'DEFLATE' si tu veux compresser
    // level: 6               // (optionnel) si 'DEFLATE'
  };

  for (const e of entries) {
    await writer.add(e.name, new zip.Uint8ArrayReader(e.data), entryOpts);
  }

  const zipBlob = await writer.close();

  // 7) Télécharger
  const titleSlug = (App?.util?.slug ? App.util.slug(enq?.title) : slug(enq?.title)) || 'sans-titre';
  const base      = `project_${titleSlug}`;
  const zipName   = App.helpers.makeTimestampedFilename(base, 'zip');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob);
  a.download = zipName;
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(a.href);
  a.remove();
}
