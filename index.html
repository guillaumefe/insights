<script>
/* =====================================================================
   Import ZIP (stored-only) — prêt pour passage en ES module
   ===================================================================== */

(function(){
  'use strict';

  const _createImporter = ({ secStore, uiList, state }) => {
    const LFH = 0x04034b50, CDH = 0x02014b50, EOCD = 0x06054b50;

    function unzipStoredOnly(u8){
      const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
      let p = u8.length - 22;
      while (p >= 0 && dv.getUint32(p, true) !== EOCD) p--;
      if (p < 0) throw new Error('ZIP invalide (EOCD introuvable)');
      const centralSize  = dv.getUint32(p + 12, true);
      const centralStart = dv.getUint32(p + 16, true);
      const out = [];
      let c = centralStart;
      while (dv.getUint32(c, true) === CDH){
        const compMethod = dv.getUint16(c + 10, true);
        const nameLen    = dv.getUint16(c + 28, true);
        const extraLen   = dv.getUint16(c + 30, true);
        const commLen    = dv.getUint16(c + 32, true);
        const lfhOff     = dv.getUint32(c + 42, true);
        const name = new TextDecoder().decode(u8.subarray(c + 46, c + 46 + nameLen));
        const n = lfhOff;
        if (dv.getUint32(n, true) !== LFH) throw new Error('ZIP invalide (LFH)');
        const nNameLen  = dv.getUint16(n + 26, true);
        const nExtraLen = dv.getUint16(n + 28, true);
        const compSize  = dv.getUint32(n + 18, true);
        const dataStart = n + 30 + nNameLen + nExtraLen;
        if (compMethod === 0) out.push({ name, data: u8.subarray(dataStart, dataStart + compSize) });
        c += 46 + nameLen + extraLen + commLen;
        if (c >= centralStart + centralSize) break;
      }
      return out;
    }

    // --- NOUVEAU : flux qui préserve la user gesture pour les 2 pickers
    function startZipImportFlow(){
      if (!isRealDirSupported()){
        showUnsupportedDirPickerNotice();
        return;
      }
      (async () => {
        try {
          // 1) Dossier d’abord (encore dans le clic de menu = user gesture OK)
          const dirHandle = await window.showDirectoryPicker();
          await dirHandle.requestPermission?.({ mode: 'readwrite' });

          // 2) Puis le ZIP
          const input = document.createElement('input');
          input.type = 'file'; input.accept = '.zip,application/zip';
          input.addEventListener('change', async () => {
            const f = input.files?.[0]; if (!f) return;
            try {
              await importZipBlobWithHandle(f, dirHandle);
            } catch(e) {
              alert('Échec import ZIP : ' + (e?.message || e));
            }
          }, { once:true });

          // ⬇️ Toujours dans la même pile d’événements que le clic initial
          input.click();
        } catch(e){
          // Annulé ou bloqué
          if (e?.name !== 'AbortError') alert('Import annulé : ' + (e?.message || e));
        }
      })();
    }
    
    async function importZipBlobWithHandle(blob, dirHandle){
      // 1) lire le ZIP
      const u8 = new Uint8Array(await blob.arrayBuffer());
      const entries = unzipStoredOnly(u8);
    
      // 2) analysis.json → données (clair OU chiffré)
      const metaEntry = entries.find(e => e.name === 'analysis.json');
      if (!metaEntry) throw new Error('analysis.json manquant');
    
      // --- helpers (locaux, pour patch minimal) ---
      async function deriveKeyFromPass(pass, saltU8, iter = 150000) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pass), { name:'PBKDF2' }, false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', hash:'SHA-256', salt: saltU8, iterations: iter },
          keyMaterial,
          { name:'AES-GCM', length:256 },
          false,
          ['encrypt','decrypt']
        );
      }
      const b64u = {
        e: (u8) => btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
        d: (s)  => new Uint8Array([...atob(s.replace(/-/g,'+').replace(/_/g,'/'))].map(c=>c.charCodeAt(0)))
      };
    
      let src; // objet enquête restauré (décrypté ou clair)
      try {
        const metaText = new TextDecoder().decode(metaEntry.data);
        const meta = JSON.parse(metaText);
    
        if (meta && meta.encrypted) {
          // 🔒 ZIP protégé par mot de passe (AES-GCM + PBKDF2)
          const pass = window.prompt('Mot de passe du ZIP :', '');
          if (!pass) throw new Error('Mot de passe requis');
    
          const salt = b64u.d(meta.salt);
          const iv   = b64u.d(meta.iv);
          const key  = await deriveKeyFromPass(pass, salt, meta.iter || 150000);
    
          let pt;
          try {
            pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, b64u.d(meta.ct));
          } catch {
            throw new Error('Mot de passe invalide ou données corrompues');
          }
          const plain = JSON.parse(new TextDecoder().decode(new Uint8Array(pt)));
          if (plain?.type !== 'project-export' || !plain?.project) throw new Error('Export déchiffré incomplet');
          src = plain.project;
    
        } else {
          // Compat : JSON non chiffré (ancienne version)
          if (meta?.type !== 'project-export' || !meta?.project) throw new Error('Export incompatible');
          src = meta.project;
        }
      } catch {
        throw new Error('analysis.json invalide');
      }
    
      // 3) créer l’enquête (nouvel id)
      const enq  = { ...src, id: undefined };
      const id   = await secStore.putEncryptedAnalyse(enq);
      const open = await secStore.getEncryptedAnalyse(id);
      state.currentAnalyse = open;
    
      // 4) enregistrer/associer le dossier choisi (si l’app expose un setter)
      if (uiList.setRefDirHandle) {
        await uiList.setRefDirHandle(state.currentAnalyse, dirHandle);
      }
      // Si pas de setter, uiList.saveToRefDir utilisera souvent son cache interne
      // après le premier appel; à défaut, on écrit nous-mêmes via le handle.
    
      // 5) écrire les fichiers du ZIP dans ce dossier
      const bins = entries.filter(e => e.name.startsWith('files/') || e.name.startsWith('old_files/'));
      const seen = new Set();
      for (const e of bins){
        const simpleName = e.name.replace(/^files\/|^old_files\//,'');
        if (seen.has(simpleName)) continue;
        seen.add(simpleName);
    
        // a) Essayer d’utiliser l’API de l’app (si elle mémorise le handle)
        if (uiList.saveToRefDir) {
          const f = new File([e.data], simpleName);
          try {
            await uiList.saveToRefDir(state.currentAnalyse, f);
            continue; // tout bon
          } catch(_) { /* on passe en écriture directe */ }
        }
        // b) Écriture directe via le handle
        const fileHandle = await dirHandle.getFileHandle(simpleName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(e.data);
        await writable.close();
      }
    
      // 6) UI refresh
      await uiList.refreshList();
      uiList.openDetail?.();
      (window.App?.form?.renderForm || Function.prototype)();
      (window.App?.files?.scanCurrentAnalyse || Function.prototype)();
      uiList.showToast?.('ZIP importé : enquête recréée.', 2200, 'success');
    }


    // Ancienne API — laissée pour compat descendante si tu l’appelles encore
    async function importZipBlob(blob){
      // Appel sans handle → on retombe sur le flux interactif
      const dirHandle = await window.showDirectoryPicker();
      await dirHandle.requestPermission?.({ mode: 'readwrite' });
      return importZipBlobWithHandle(blob, dirHandle);
    }

    return { startZipImportFlow, importZipBlobWithHandle, importZipBlob };
  };

  (window.App ||= {}).createImporter = _createImporter;

  try {
    const App = window.App;
    App.importer = App.createImporter({
      secStore: App.secStore,
      uiList:   App.uiList,
      state:    App.state
    });
  } catch(e){
    console.warn('Importer init skipped:', e);
  }

})();
</script>

<script>
(() => {
  // ============================================================
  // CRUD — version adaptée / robuste
  // ============================================================

  // Fallback local pour un titre unique si App.helpers pas prêt
  function localNextAvailableTitle(desired){
    const raw = String(desired || '').trim();
    if (!raw) return raw;
    const base = raw.replace(/\s*\(\d+\)\s*$/,'').trim();
    const titles = (App?.state?.allAnalysesCache || []).map(e => (e.title || '').trim());
    const taken = new Set(titles.map(t => t.toLowerCase()));
    if (!taken.has(raw.toLowerCase())) return raw;
    let n = 2;
    while (taken.has(`${base} (${n})`.toLowerCase())) n++;
    return `${base} (${n})`;
  }

  async function createAnalyse(){
    const titleEl = document.getElementById('newTitle');
    const dateEl  = document.getElementById('newDate');

    const rawTitle = (titleEl?.value || '').trim();
    if (!rawTitle){
      App?.uiList?.showToast?.('Veuillez saisir un titre.', 3000, 'error') ?? alert('Veuillez saisir un titre.');
      titleEl?.focus();
      return;
    }

    // Titre unique (utilise helper s’il existe, sinon fallback local)
    const title = (App?.helpers?.nextAvailableTitle || localNextAvailableTitle)(rawTitle);

    // Date : RAW conservé pour UX ; officiel si strict
    const rawDate = (dateEl?.value || '').trim();
    const parsed  = App?.util?.parseDateStrict ? App.util.parseDateStrict(rawDate) : ( /^\d{4}-\d{2}-\d{2}$/.test(rawDate) ? rawDate : '' );

    const enq = {
      title,
      date: parsed ? parsed : '',
      created: Date.now(),
      data: {}
    };
    // RAW d’en-tête pour affichage partiel
    App?.util?.setRawHeader?.(enq, 'headerDate', rawDate);

    try{
      const id = await App.secStore.putEncryptedAnalyse(enq);
      enq.id = id;

      // Mémoriser comme "dernier ouvert"
      try { await App.storage.put('ui', { id:'last', value: id }); } catch(_){}

      // Rafraîchir la liste + ouvrir

      const opened = await App.secStore.getEncryptedAnalyse(id);

      App.state.currentAnalyse = opened;

      // Nettoyage des champs de création

      if (dateEl)  dateEl.value  = App?.util?.todayISO?.() || new Date().toISOString().slice(0,10);

      App?.uiList?.showToast?.('Analyse créée.', 1800, 'success');

      App?.uiList?.showToast?.('Échec de création : ' + (e?.message || e), 4000, 'error') ?? alert('Échec : ' + (e?.message || e));
    }
  }

    const cur = App?.state?.currentAnalyse;
    if (!cur){
      App?.uiList?.showToast?.('Aucun projet ouvert sélectionné.', 3000, 'error') ?? alert('Aucun projet ouvert sélectionné.');
      return;
    }
    const label = cur.title ? `« ${cur.title} »` : 'ce projet';
    const ok = App?.helpers?.confirm?.(`Supprimer définitivement ${label} ?`) ?? confirm(`Supprimer définitivement ${label} ?`);
    if (!ok) return;

    try{
      await App.storage.del('projets', cur.id);
      try { await App.secStore.clearFsHandle(cur.id); } catch(_){}
      App.uiList.closeDetail();
      await App.uiList.refreshList();
      // Si on supprimait le "dernier", on nettoie l’info
      try {
        const last = await App.storage.get('ui','last');
        if (last?.value === cur.id) await App.storage.put('ui', { id:'last', value: null });
      } catch(_){}

<script>
/* =========================================================
   Inactivité utilisateur → verrouillage automatique
   ========================================================= */
App.idle = (function () {
  let timer = null;

  // Configurable (15 min par défaut)
  const config = { timeoutMs: 15 * 60 * 1000 };

  function resetTimer() {
    clearTimeout(timer);
    if (!App.crypto?.currentKey) return; // déjà verrouillé
    timer = setTimeout(lockApp, config.timeoutMs);
  }

  async function lockApp() {
    if (!App.crypto?.currentKey) return; // déjà verrouillé

    // Utilise le gestionnaire central si dispo
    if (App.lock?.lockNow) {
      await App.lock.lockNow();
    } else {
      // Fallback ultra-minimal si App.lock n'est pas chargé
      App.crypto.currentKey = null;
      App.uiList?.showToast?.('Verrouillage automatique après inactivité.', 4000, 'info');
      document.body.classList.add('locked');
    }

    // Le timer restera inactif tant qu'on est verrouillé (resetTimer sortira)
  }

  function init() {
    // Interactions courantes
    const activityEvents = [
      'mousemove', 'keydown', 'scroll', 'touchstart',
      'pointerdown' // + fiable que click (souris, stylet, tactile)
    ];
    activityEvents.forEach(ev =>
      window.addEventListener(ev, resetTimer, { passive: true })
    );

    // Quand l’onglet revient au 1er plan, on relance le timer
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) resetTimer();
    });

    resetTimer();
  }

  function restart() {
    resetTimer();
  }

  return { init, restart, config };
})();
</script>

<script>
  (() => {
    // Namespace global garanti
    const App = (globalThis.App = globalThis.App || {});
    const toast = (m, ms = 2500, t = 'info') => App.uiList?.showToast?.(m, ms, t);
  
    let _offlineToastShown = false; // évite le spam
    
    // Stub PWA avec file d'attente pour appels précoces
    App.pwa = App.pwa || { _q: [] };
    const qpush = (name, args) => new Promise((res, rej) => App.pwa._q.push([name, args, res, rej]));
  
    // -------- Manifest (si absent) --------
    function ensureManifest(href = 'manifest.webmanifest') {
      if (document.querySelector('link[rel="manifest"]')) return;
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = href;
      document.head.appendChild(link);
    }
  
    // -------- CacheStorage (offline public) --------
    const HTTP_CACHE = 'app-http-v1';
    async function cacheOpen(){ return 'caches' in self ? caches.open(HTTP_CACHE) : null; }
    async function cachePut(req, resp){
      try { const c = await cacheOpen(); if (c) await c.put(req, resp.clone()); } catch {}
    }
    async function cacheMatch(req){
      try { const c = await cacheOpen(); return c ? await c.match(req) : undefined; } catch { return undefined; }
    }
  
    // -------- Snapshot chiffré (offline privé) --------
    const apiCache = {
      async save(key, data) {
        try {
          if (!App.crypto?.currentKey || !App.crypto?.aesEncryptJson || !App.storage?.put) return;
          const env = await App.crypto.aesEncryptJson(App.crypto.currentKey, { ts: Date.now(), data });
          await App.storage.put('ui', { id: 'api:' + key, value: env });
        } catch {}
      },
      async load(key) {
        try {
          if (!App.storage?.get) return null;
          const rec = await App.storage.get('ui', 'api:' + key);
          if (!rec?.value || !App.crypto?.aesDecryptJson || !App.crypto?.currentKey) return null;
          return await App.crypto.aesDecryptJson(App.crypto.currentKey, rec.value); // {ts,data}
        } catch { return null; }
      }
    };
  
    // -------- Fetch helpers (réseau → cache → snapshot) --------
    async function getText(url, init = {}) {
      // Réseau d’abord
      try {
        const r = await fetch(url, { cache: 'no-store', credentials: 'include', ...init });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        await cachePut(url, r);
        return { data: await r.text(), offline: false };
      } catch (e) {
        // Fallback CacheStorage
        const c = await cacheMatch(url);
        if (c) return { data: await c.text(), offline: true };
        // Pas de snapshot chiffré pertinent pour du texte générique → on remonte l’erreur
        throw e;
      }
    }
  
    async function getJSON(url, { key = url, fetchInit } = {}) {
      // Réseau d’abord
      try {
        const r = await fetch(url, { cache: 'no-store', credentials: 'include', ...fetchInit });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        try { // cache chiffré si dispo
          const env = await App.crypto?.aesEncryptJson?.(App.crypto.currentKey, { ts: Date.now(), data });
          await App.storage?.put?.('ui', { id: 'api:' + key, value: env });
        } catch {}
        return { data, offline: false };
      } catch (e) {
        try {
          const rec = await App.storage?.get?.('ui', 'api:' + key);
          if (rec?.value && App.crypto?.aesDecryptJson) {
            const snap = await App.crypto.aesDecryptJson(App.crypto.currentKey, rec.value);
            if (!_offlineToastShown) {
              toast('Version hors-ligne chargée', 2500, 'info');
              _offlineToastShown = true;
            }
            return { data: snap.data, offline: true, ts: snap.ts };
          }
        } catch {}
        throw e; // pas de snapshot ⇒ on relance l’erreur
      }
      App.pwa = App.pwa || {};
      App.pwa.getJSON = getJSON;
    }
  
    async function putCache(url, body, headers){
      const resp = new Response(body, { status: 200, headers: headers || {'Content-Type':'application/octet-stream'} });
      await cachePut(url, resp);
    }
    async function invalidate(url){
      try { const c = await cacheOpen(); if (c) await c.delete(url); } catch {}
    }
  
    // Expose API réelle + draine la file d’attente
    Object.assign(App.pwa, { getJSON, getText, putCache, invalidate });
    if (Array.isArray(App.pwa._q)) {
      App.pwa._q.splice(0).forEach(([name, args, res, rej]) => {
        const fn = App.pwa[name];
        if (typeof fn === 'function') fn.apply(App.pwa, args).then(res, rej);
        else rej(new Error('App.pwa.' + name + ' indisponible'));
      });
    }
    delete App.pwa._q;
  
    // -------- SW registration (au load) --------
    function registerSW(path = 'sw.js') {
      if (!('serviceWorker' in navigator)) return;

      // Défense : si on reçoit un Event par erreur, retomber sur la valeur par défaut
      if (path && typeof path === 'object') path = 'sw.js';

      navigator.serviceWorker.register(path).then(reg => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              App.uiList?.showToast?.('Mise à jour prête — rafraîchissement…', 1800, 'info');
              reg.waiting?.postMessage?.({ type: 'SKIP_WAITING' });
            }
          });
        });
      }).catch(err => {
        console.error('[PWA] SW register error:', err);
        App.uiList?.showToast?.('Version hors-ligne indisponible.', 3000, 'warning');
      });

      navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
    }

    // Wrapper sur 'load' (NE PAS passer registerSW directement)
    function init() {
      ensureManifest();
      bindOnlineOfflineToasts();
      handleInstallPrompt();

      const swPath = 'sw.js';
      if (document.readyState === 'complete') {
        registerSW(swPath);
      } else {
        window.addEventListener('load', () => registerSW(swPath), { once: true });
      }
    }

    // -------- Online/Offline toasts --------
    function bindOnlineOfflineToasts() {
      const on  = () => toast?.('Mode connecté', 1600, 'success');
      const off = () => toast?.('Mode déconnecté', 2600, 'warning');
      window.addEventListener('online', on);
      window.addEventListener('offline', off);
      if (!navigator.onLine) off();
    }
  
    // -------- beforeinstallprompt (optionnel) --------
    function handleInstallPrompt() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        App.pwa._deferredPrompt = e;
        toast?.('Installe l’app depuis le menu du navigateur', 3000, 'info');
      });
    }
  
    // -------- Init --------
    function init() {
      ensureManifest();
      bindOnlineOfflineToasts();
      handleInstallPrompt();
      // registre le SW au load (ne bloque pas le rendu)
      if (document.readyState === 'complete') registerSW();
      else addEventListener('load', registerSW, { once: true });
    }
  
    // Auto-init (robuste à l’ordre des balises <script>)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
      init();
    }
  })();
  </script>

  /* ===================== attachTemplateLoader ===================== */
  function attachTemplateLoader(){
  const fileInput = App.dom.getById('templateFile');
  const pickBtn   = App.dom.getById('pickTemplateBtn');
  const applyBtn  = App.dom.getById('applyTemplateBtn');
  let stagedTemplate = null;

  // petit wrapper: tente d'utiliser App.model.autoFixTemplateCollisions, sinon no-op
  const runAutoFix = (tpl) => {
    try {
      const fixer = App?.model?.autoFixTemplateCollisions || (typeof autoFixTemplateCollisions === 'function' ? autoFixTemplateCollisions : null);
      if (!fixer) return { fixed: tpl, changes: [] };
      const out = fixer(tpl);
      return { fixed: out?.fixed ?? tpl, changes: out?.changes ?? [] };
    } catch (_e) {
      // si l’auto-fix plante, on continue avec l’original
      return { fixed: tpl, changes: [] };
    }

    try { text = await f.text(); }
    catch (e) {
      showJsonErrorPopup('Erreur de lecture du fichier', e?.message || String(e));
      return;
    }

    let json;
    try { json = JSON.parse(text); }
    catch (err) {
      const looksLikeJsLiteral = /[\r\n\s{[],\s]*[A-Za-z_][A-Za-z0-9_]*\s*:/.test(text);
      let msg = "Le fichier n'est pas un JSON valide.\n\n" +
                "Assurez-vous que le contenu respecte la syntaxe JSON :\n" +
                "• Toutes les clés et chaînes entre guillemets doubles\n" +
                "• Pas de commentaires ou de virgules finales\n";
      if (looksLikeJsLiteral)
        msg += "\n💡 Il semble que votre fichier soit un littéral JavaScript. Essayez de mettre des guillemets sur les clés.";
      msg += "\n\nDétail technique : " + (err?.message || String(err));
      showJsonErrorPopup('JSON invalide', msg);
      return;

    // --- (C) MODE PERMISSIF : AUTO-FIX AVANT VALIDATION ---
    const { fixed: fixedTemplate, changes } = runAutoFix(json);

    // validation sur le template corrigé

                  `• [mono] tableau de sections: [{ title, fields:[...] }]\n` +
                  `• [multi] tableau de processus: [{ name, sections:[{ title, fields:[...] }]}]`;
      showJsonErrorPopup('Modèle invalide', msg);
      return;
    }

    // prêt à appliquer
    stagedTemplate = fixedTemplate;
    if (applyBtn) applyBtn.disabled = false;

    if (changes?.length) {
      const preview = changes.slice(0, 5).map(c =>
        `• ${c.kind==='group'?'groupe':'champ'} “${c.from}” → “${c.to}” [${c.section}${c.proc?`, ${c.proc}`:''}]`

      App?.uiList?.showToast?.('Processus réinitialisé.', 2000, 'success');

}

    const local = (s)=> {

      const base = raw.replace(/\s*\(\d+\)\s*$/,'').trim();

    App.secStore.setNewKdfSaltAndIters?.();
    App.crypto.currentKey = await App.crypto.deriveKeyFromPassword(res.next);

    // ne pas poser le sentinel ici (pour éviter le double appel)
    return res;
  }
  
  function forceClosePwdModal () {
    const m = document.getElementById('pwdModal');
    if (!m) return;
    m.classList.remove('is-open', 'is-unlock', 'is-change', 'is-setup');
    m.setAttribute('aria-hidden', 'true');
    // nettoie les champs
    const ids = ['pwdCurrent','pwdNew','pwdNew2'];
    ids.forEach(id => { const i = document.getElementById(id); if (i) i.value = ''; });
  };

  async function isFirstUse(){
    const hasSalt = !!localStorage.getItem('kdfSalt');
    let hasRows = false;
    try {
      const rows = await App.storage.all('projets');
      hasRows = Array.isArray(rows) && rows.length > 0;
    } catch(_) {}
    return !hasSalt && !hasRows;
  }

  async function hardResetAndSetup(){
    const ok = App.helpers.confirm(
      "Réinitialiser l'application ?\n\n" +
      "• Toutes les projets seront SUPPRIMÉES\n" +
      "• Le mot de passe sera effacé\n" +
      "• Vous créerez ensuite un nouveau mot de passe"
    );
    if (!ok) return;

    // Efface toutes les projets
    try {
      const rows = await App.storage.all('projets');
      for (const r of (rows || [])) { await App.storage.del('projets', r.id); }
    } catch(_) {}

    // Efface UI/fsHandles si présents (best effort)
    try {
      const ui = await App.storage.all('ui');
      for (const u of (ui || [])) { await App.storage.del('ui', u.id); }
    } catch(_) {}
    try {
      const fh = await App.storage.all('fsHandles');
      for (const h of (fh || [])) { await App.storage.del('fsHandles', h.projectId); }
    } catch(_) {}

    // Efface paramètres KDF
    localStorage.removeItem('kdfSalt');
    localStorage.removeItem('pbkdf2Iters');

    App.crypto.currentKey = null;
    await App.uiList.refreshList();

    // Demander un nouveau mot de passe tout de suite
    await promptSetupPassword();

    App.uiList.showToast('Réinitialisation effectuée. Nouveau mot de passe créé.', 3000, 'success');
  }

  function makeTimestampedFilename (baseName, ext = 'json') {
    // Format date/heure sans caractères spéciaux
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    // Nettoyage du baseName (lettres, chiffres, tirets, underscores)
    const safeBase = (baseName || 'export')
      .replace(/[^a-z0-9_-]+/gi, '_')
      .replace(/_+/g, '_')
      .replace(/^_+|_+$/g, '');
    return `${safeBase}_${stamp}.${ext}`;
  }
  
  /* =========================
   Gestion du verrouillage
   ========================= */
  App.lock = {
      
    updateUI() {
      const locked = !App.crypto?.currentKey;
      document.body.classList.toggle('locked', locked);

      const hasPwd = !!localStorage.getItem('kdfSalt');
      const unlockBtn = document.getElementById('unlockBtn');
      const changeBtn = document.getElementById('changePwdBtn');

      // Libellé du bouton principal
      if (unlockBtn) {
        unlockBtn.textContent = hasPwd ? '🔓 Déverrouiller' : '🗝️ Créer un mot de passe';
      }

      // Montrer "Changer le mot de passe" seulement si un mot de passe existe ET qu’on est déverrouillé
      if (changeBtn) {
        changeBtn.style.display = (hasPwd && !locked) ? 'inline-flex' : 'none';
      }

      // Désactiver certains boutons si verrouillé (tu avais déjà cette logique via CSS ; on garde)
      const disableIds = ['pickTemplateBtn','applyTemplateBtn','resetTemplateBtn'];
      for (const id of disableIds) {
        const el = document.getElementById(id);
        if (el) el.disabled = locked;
      }
    },

    async unlockFlow() {
      // 0) Demande le mot de passe
      const pass = await App.uiList.openPasswordDialog({ mode: 'unlock' });
      if (!pass) return;

      const toast = App.uiList?.showToast ?? ((msg) => alert(String(msg)));

      try {
        // 1) Blocage si pas de crypto
        if (App.compat?.unsafeMode) {
          toast('Impossible de déverrouiller : chiffrement indisponible sur ce navigateur.', 4500, 'error');
          return;
        }

        // 2) Vérifie qu’un mot de passe a été défini
        const hasPwd = !!localStorage.getItem('kdfSalt');
        if (!hasPwd) {
          toast('Aucun mot de passe défini. Cliquez sur « Créer un mot de passe ».', 4000, 'error');
          App.lock?.setLocked?.(true);
          App.lock?.updateUI?.();
          return;
        }

        // 3) Dérive la clé candidate (sans la fixer)
        const candidateKey = await App.crypto.deriveKeyFromPassword(pass);

        // 4) Vérification via sentinel (fallback : 1er projet)
        let valid = false;
        try { valid = await App.secStore.verifyPasswordWithSentinel(pass); } catch {}

        if (!valid) {
          let rows = [];
          try { rows = await App.storage.all('projets'); } catch {}
          if (Array.isArray(rows) && rows.length > 0) {
            try { await App.crypto.aesDecryptJson(candidateKey, rows[0]._enc); valid = true; } catch {}
          }
        }

        // 5) Gestion KO
        if (!valid) {
          toast('Mot de passe invalide.', 3200, 'error');
          App.lock?.setLocked?.(true);              // reste verrouillé
          App.lock?.updateUI?.();
          return;
        }

        // 6) Succès : fixe la clé en 1er, puis UI, puis rafraîchis
        App.crypto.currentKey = candidateKey;
        App.lock?.setLocked?.(false);               // retire le blur + bascule boutons
        App.lock?.updateUI?.();

        // Migrations + sentinel (ne gênent plus l’UI car clé déjà posée)
        try { await App.secStore.migrateIfNeeded?.(); } catch {}
        try { await App.secStore.ensureVaultSentinel?.(App.crypto.currentKey); } catch {}

        // Rafraîchis la liste après avoir la clé
        try { await App.uiList?.refreshList?.(); } catch {}

        // (re)charge un éventuel template custom
        // inside App.lock.unlockFlow() après refreshList()
        try {
          // migration legacy -> chiffré (one-shot)
          const legacy = App.kv?.get?.('customTemplateJSON') || localStorage.getItem('customTemplateJSON');
          const already = await App.storage.get('ui','customTemplate');
          if (legacy && !already?.value) {
            const env = await App.crypto.aesEncryptJson(App.crypto.currentKey, JSON.parse(legacy));
            await App.storage.put('ui', { id:'customTemplate', value: env });
            try { App.kv?.remove?.('customTemplateJSON'); } catch {}
            try { localStorage.removeItem('customTemplateJSON'); } catch {}
          }
        
          // lecture chiffrée
          const rec = await App.storage.get('ui','customTemplate');
          if (rec?.value && App.crypto?.aesDecryptJson) {
            const tpl = await App.crypto.aesDecryptJson(App.crypto.currentKey, rec.value);
            App.model.setTemplate(tpl);
          } else {
            // compat: ancien stockage en clair
            const savedTpl = App.kv?.get?.('customTemplateJSON') || localStorage.getItem('customTemplateJSON');
            if (savedTpl) App.model.setTemplate(JSON.parse(savedTpl));
          }
        } catch {}

        toast('Déverrouillé ✅', 1800, 'success');
        App.idle?.restart?.();

      } catch (e) {
        console.error('[unlockFlow]', e);
        toast('Impossible de déverrouiller (erreur technique).', 3500, 'error');
        App.lock?.setLocked?.(true);
        App.lock?.updateUI?.();
      }
    },
    
    setLocked(flag){
      document.body.classList.toggle('locked', !!flag);
      const unlockBtn = document.getElementById('unlockBtn');
      const changeBtn = document.getElementById('changePwdBtn');
      if (unlockBtn)  unlockBtn.style.display  = flag ? '' : 'none';
      if (changeBtn)  changeBtn.style.display  = flag ? 'none' : '';
    },

    async lockNow() {
      App.crypto.currentKey = null;

      // En cas de verrouillage, remettre le processus par défaut
      try {
        App.model.setTemplate(App.model.DEFAULT_TEMPLATE.slice());
      } catch (_) {}

      this.updateUI();
      App.uiList.showToast?.('Application verrouillée 🔒', 1800, 'info');
    }
  };
  
  // Bind des boutons (à exécuter une fois le DOM prêt)
  document.addEventListener('DOMContentLoaded', () => {
    const unlockBtn = document.getElementById('unlockBtn');
    const changeBtn = document.getElementById('changePwdBtn');

    if (unlockBtn) {
      unlockBtn.addEventListener('click', async () => {
        const hasPwd = !!localStorage.getItem('kdfSalt');

        if (!hasPwd) {
          // ✅ toujours repartir d’une modale propre
          App.helpers.forceClosePwdModal();
          try {
            const res = await App.helpers.promptSetupPassword?.(); // doit RENVOYER null si annulé
            if (!res) {
              App.helpers.forceClosePwdModal(); // re-armement si annulé
              return;
            }
            await App.secStore.ensureVaultSentinel?.(App.crypto.currentKey);
            App.uiList?.showToast?.('Mot de passe créé ✅', 1800, 'success');
          } catch {
            App.helpers.forceClosePwdModal(); // re-armement si erreur
          } finally {
            App.lock?.updateUI?.();
          }
          return;
        }

        // Mot de passe déjà présent → flux de déverrouillage
        await App.lock.unlockFlow?.();
      });
    }

    if (changeBtn) {
      changeBtn.addEventListener('click', () => App.secStore.changePasswordFlow());
    }

    App.lock?.updateUI?.();
  });

  /* ===================== Boot ===================== */
  async function boot(){
    // 1) DB
    try {
      await App.storage.openDB();
    } catch (e) {
      (App?.helpers?.alert || alert)('Erreur base de données : ' + (e?.message || e));
      return;
    }

    // 2) État initial UI : verrouillé tant que la clé n’est pas posée
    App.lock?.setLocked?.(true);
    App.lock?.updateUI?.();

    // 3) Première utilisation / déverrouillage immédiat
    const hasPwd = !!localStorage.getItem('kdfSalt');
    try {
      if (!hasPwd) {
        // Première utilisation : on force l’ouverture immédiate de la modale setup
        try {
          // attendre que App.uiList soit chargé si besoin (max ~2s)
          for (let i = 0; i < 20 && !App?.uiList?.openPasswordDialog; i++) {
            await new Promise(r => setTimeout(r, 100));
          }

          const res = await App.helpers.promptSetupPassword?.();
          if (res?.next) {
            await App.secStore.ensureVaultSentinel?.(App.crypto.currentKey);
            App.uiList?.showToast?.('Mot de passe créé ✅', 2000, 'success');

            App.lock?.setLocked?.(false);
            App.lock?.updateUI?.();
            await App.uiList?.refreshList?.();
          }
        } catch (e) {
          console.warn('setup password skipped', e);
        }
      } else {
        await App.lock.unlockFlow();
      }
    } catch (_) {
      // Annulé ou erreur technique ⇒ rester verrouillé, pas de toast supplémentaire ici
      App.crypto.currentKey = null;
    }

    // 4) Migrations/idle uniquement si déverrouillé
    if (App.crypto.currentKey) {
      try { await App.secStore.migrateIfNeeded(); } catch {}
      App.idle?.restart?.();
    
      await App.files?.restoreHandles?.(); // Restaure les dirHandle avant toute réouverture/scan
    }

    // 5) Liste gauche (fonctionne verrouillé → liste vide) + hooks
    await App?.uiList?.refreshList?.();

    // Boutons principaux
    App.dom.on(App.dom.getById('createBtn'),   'click', App?.crud?.createAnalyse);
    App.dom.on(App.dom.getById('exportBtn'),   'click', App?.exporter?.exportODT);
    App.dom.on(App.dom.getById('exportZipBtn'),'click', App?.exporter?.exportFullBundleZip);
    App.dom.on(App.dom.getById('deleteBtn'),   'click', App?.crud?.deleteCurrent);
    App.dom.on(App.dom.getById('backBtn'),     'click', ()=>{
      App?.uiList?.closeDetail?.();
      App.dom.getById('projectList')?.querySelectorAll('.item.selected')?.forEach(n=>n.classList.remove('selected'));
    });
    App.dom.on(App.dom.getById('previewBtn'),  'click', App?.preview?.togglePreview);
    App.dom.on(App.dom.getById('toggleMissingBtn'), 'click', ()=>{
      App.util.showMissingOnly = !App.util.showMissingOnly;
      App?.util?.updateMissingButton?.();
      App?.form?.renderForm?.();
      App.files?.scanCurrentAnalyse?.();
    });
    App?.util?.updateMissingButton?.();

    attachBundleMenu();
    attachTemplateLoader();

    // 6) Charger le processus custom seulement si déverrouillé
    if (App.crypto.currentKey) {
      const savedTpl = App.kv.get('customTemplateJSON');
      if (savedTpl) {
        try { App.model.setTemplate(JSON.parse(savedTpl)); }
        catch { App.log?.warn?.('Processus dans localStorage illisible — défaut conservé.'); }
      }
    }

    // 7) Bind “changer le mot de passe”
    App.dom.on(App.dom.getById('changePwdBtn'), 'click', App?.secStore?.changePasswordFlow);

    // 8) Champs et recherche
    const nd = App.dom.getById('newDate');
    if (nd) nd.value = todayISO();

    let t=null;
    App.dom.on(App.dom.getById('searchBox'), 'input', (e)=>{
      App.state.currentSearch = e.target.value || '';
      if(t) App.timing.cancelRaf(t);
      t = App.timing.raf(App?.uiList?.renderList);
    });

    // 9) Rouvrir le dernier projet uniquement si déverrouillé
    if (App.crypto.currentKey) {
      try{
        const last = await App.storage.get('ui','last');
        if (last?.value != null) {
          const opened = await App.secStore.getEncryptedAnalyse(last.value);
          if (opened) {
            App.state.currentAnalyse = opened;
            const p = (App?.helpers?.loadPageFor?.(opened.id) ?? 0);
            App?.util?.gotoPage?.(p);
            App?.uiList?.openDetail?.();
            App?.form?.renderForm?.();
            App.files?.scanCurrentAnalyse?.();
          }
        }
      }catch(_){}
    }

    // 10) Placeholder + visibilité recherche + état final
    App?.uiList?.updatePlaceholder?.();
    App?.uiList?.updateSearchVisibility?.();
    // Ré-applique l’état (évite les doubles appels inutiles)
    App.lock?.setLocked?.(!App.crypto.currentKey);
    App.lock?.updateUI?.();
  }

  boot().catch(err=>{
    App?.log?.error?.(err);
    (App?.helpers?.alert || alert)('Erreur au démarrage : ' + (err?.message || err));
  });

  /* ===================== Vérification ===================== */
  function assertReady(){
    const r = App._ready || {};
    const missing = Object.entries(r).filter(([_,v]) => !v).map(([k])=>k);
    if (missing.length) App?.log?.warn?.("Modules non prêts:", missing.join(", "));
  }

  App._ready = App._ready || {};
  App._ready.helpers = true;
  assertReady();
  App._ready.boot = true;

  // Exposition helpers
  App.helpers = Object.assign(App.helpers || {}, {
    nextAvailableTitle, loadPageFor, savePageFor, promptPassword,
    attachBundleMenu, attachTemplateLoader, showJsonErrorPopup,
    hardResetAndSetup, makeTimestampedFilename, forceClosePwdModal, promptSetupPassword
  });
  
    
  // Mise en place de l'inactivité
  App.idle.init();
  const SECONDS = 600; // n * 60
  App.idle.config.timeoutMs = SECONDS * 1000;
  //App.idle.config.timeoutMs = 30 * 1000; // (debug) 30sec

})();
</script>

<script>
/* =========================================================================
   Glossaire v2.7
   - Délégation d’événements : boutons toujours cliquables (même après re-render)
   - Barre de tri A→Z / Z→A au-dessus du tableau (par défaut A→Z)
   - Export JSON : Annuler + Tout (dé)cocher fonctionnent
   - Export ODT en haut (#glossaryExportOdtBtn)
   - Merge / Éditer tags, Import JSON, filtres, recherche, saisie fluide
   ========================================================================= */
(() => {
  'use strict';

  const STORE_KEY = 'app.glossary.v2';

  const state = {
    items: [],
    q: '',
    mode: 'list',             // 'list' | 'edit'
    selectedId: null,
    selectedTags: new Set(),  // filtres actifs (AND)
    tagsPanelOpen: true,      // A→Z visible ?
    exportPanelOpen: false,   // panneau d'export JSON
    exportSelected: new Set(),// tags cochés pour l’export
    mergeArmed: false,        // toggle “Confirmer fusion”
    sortDir: 'asc',           // 'asc' (A→Z par défaut) | 'desc'
  };

  const $  = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const uid = () => crypto?.randomUUID?.() || ('g_' + Math.random().toString(36).slice(2));
  const norm = s => (s||'').toString().normalize('NFKD').toLowerCase();
  const escapeHTML = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const collFR = new Intl.Collator('fr', { sensitivity: 'base' });

  /* ---------------------------- Storage ---------------------------- */
  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(state.items));
  const load = () => {
    try {
      const v2 = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      state.items = Array.isArray(v2) ? v2 : [];
      if (!state.items.length) {
        const v1 = JSON.parse(localStorage.getItem('app.glossary.v1') || '[]');
        if (Array.isArray(v1) && v1.length) {
          state.items = v1.map(x => ({ id: x.id || uid(), term: x.term||'', def: x.def||'', tags: [] }));
          save();
        }
      }
    } catch { state.items = []; }
  };

  const allTags = () => {
    const set = new Set();
    for (const it of state.items) (it.tags||[]).forEach(t => set.add(t));
    return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr',{sensitivity:'base'}));
  };

  /* ---------------------------- Vue manager ------------------------ */
  function showView(mode){
    state.mode = mode;
    const listView = $('#glossaryListView');
    const editView = $('#glossaryEditorView');
    if (!listView || !editView) return;

    if (mode === 'list'){
      listView.hidden = false;
      editView.hidden = true;
      editView.innerHTML = '';
      const sug = $('#gTagSug'); if (sug){ sug.style.display='none'; sug.innerHTML=''; }
      const tb = $('#tagsToolbar'); if (tb) tb.style.display = '';
      const btn = $('#glossaryToggleBtn');
      if (btn){ btn.textContent='➕ Ajouter'; btn.title='Ajouter une entrée'; btn.dataset.mode='add'; }
    } else {
      listView.hidden = true;
      editView.hidden = false;
      const btn = $('#glossaryToggleBtn');
      if (btn){ btn.textContent='← Liste'; btn.title='Revenir à la liste'; btn.dataset.mode='back'; }
    }
    const body = $('#glossaryBody'); if (body) body.scrollTo({ top:0, behavior:'instant' });
  }

  /* ---------------------------- Filtrage + Tri --------------------- */
  function toggleTagFilter(tag){
    if (state.selectedTags.has(tag)) state.selectedTags.delete(tag);
    else state.selectedTags.add(tag);
    renderListView();
  }
  function resetTagFilters(){ state.selectedTags.clear(); renderListView(); }

  function deleteSelectedTagsFromAllItems(){
    if (!state.selectedTags.size) return;
    const tags = Array.from(state.selectedTags);
    const confirmMsg =
`Supprimer définitivement ces ${tags.length} tag(s) de toutes les entrées ?

${tags.map(t=>'#'+t).join(', ')}

Cette action est irréversible. Continuer ?`;
    if (!confirm(confirmMsg)) return;

    let affected = 0, removed = 0;
    for (const it of state.items){
      const before = (it.tags||[]).length;
      it.tags = (it.tags||[]).filter(t => !state.selectedTags.has(t));
      const after = it.tags.length;
      if (after < before){ affected++; removed += (before - after); }
    }
    save();
    state.selectedTags.clear();
    renderListView();
  }

  function getFilteredItems(){
    const q = state.q.trim();
    const qn = norm(q);

    // 1) Filtre AND par tags sélectionnés
    let arr = state.items.filter(it => {
      if (state.selectedTags.size === 0) return true;
      const tags = new Set((it.tags||[]));
      for (const t of state.selectedTags) if (!tags.has(t)) return false;
      return true;
    });

    // 2) Recherche dans le scope filtré
    if (!q) return arr;
    if (q.startsWith('#')){
      const tagq = norm(q.slice(1));
      return arr.filter(it => (it.tags||[]).some(t => norm(t).includes(tagq)));
    }
    return arr.filter(it => {
      const hay = [it.term, it.def, ...(it.tags||[])].map(norm).join(' ');
      return hay.includes(qn);
    });
  }

  function sortItemsByTerm(arr){
    const dir = state.sortDir === 'desc' ? -1 : 1;
    return [...arr].sort((a,b) => collFR.compare(a.term || '', b.term || '') * dir);
  }

  /* ---------------------------- LISTE ------------------------------ */
  function renderListView(){
    const listView = $('#glossaryListView');
    const editView = $('#glossaryEditorView');
    if (!listView || !editView) return;

    showView('list');

    const filtered = getFilteredItems();
    const sorted   = sortItemsByTerm(filtered);
    const countText = `${sorted.length} élément${sorted.length>1?'s':''}`;

    listView.innerHTML = `
      <!-- Toolbar TAGS + TRI -->
      <div id="tagsToolbar" class="card" style="margin:0 0 10px; padding:12px">
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <strong>🧩 Tous les mots-clés</strong>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <button class="btn ghost sm" id="browseAllTagsBtn"     type="button">${state.tagsPanelOpen ? 'Fermer' : 'Parcourir les mots-clés'}</button>
            <button class="btn ghost sm" id="resetTagFiltersBtn"   type="button" ${state.selectedTags.size? '':'disabled'}>Réinitialiser filtres</button>
            <button class="btn ghost sm" id="deleteTagFiltersBtTn"  type="button" ${state.selectedTags.size? '':'disabled'}>Supprimer filtres</button>
            <button class="btn ghost sm" id="mergeTagsBtn"         type="button">${state.mergeArmed ? 'Confirmer fusion' : 'Fusionner tags'}</button>
            <button class="btn ghost sm" id="editTagBtn"           type="button">Éditer tag</button>
            <button class="btn ghost sm" id="exportJsonBtn"        type="button">${state.exportPanelOpen ? 'Confirmer l’export' : 'Exporter mon glossaire'}</button>
            <button class="btn ghost sm" id="importJsonBtn"        type="button">Importer mon glossaire</button>
          </div>
        </div>

        <!-- Filtres actifs -->
        <div id="activeTagFilters" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px"></div>
        <!-- Liste A→Z -->
        <div id="allTagsList" style="${state.tagsPanelOpen?'display:flex':'display:none'};gap:8px;flex-wrap:wrap"></div>

        <!-- Panneau EXPORT (checkbox tags) -->
        <div id="exportPanel" style="${state.exportPanelOpen?'':'display:none'};margin-top:10px;padding:10px;border:1px dashed var(--border);border-radius:8px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <button class="btn ghost sm" id="cancelExportBtn" type="button">Annuler</button>
              <em style="opacity:.85">Sélectionner les tags à exporter (les entrées contenant au moins un de ces tags seront incluses)</em>
            </div>
            <button class="btn ghost sm" id="toggleAllExportTagsBtn" type="button">Tout (dé)cocher</button>
          </div>
          <div id="exportTagsList" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
        </div>
      </div>
            <div id="sortBar" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <label for="glSortDir" style="opacity:.75">Tri</label>
              <select id="glSortDir" class="btn ghost sm">
                <option value="asc"  ${state.sortDir==='asc' ? 'selected' : ''}>A → Z</option>

  function renderTagsInline(tags=[]){

    return `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px">
      ${tags.map(t=>`<span class="badge">#${escapeHTML(t)}</span>`).join('')}

  function paintTagsPanel(){

  /* --------------------- MERGE & EDIT TAGS ------------------------- */
  function onMergeTagsClick(){
    if (!state.mergeArmed){
      if (state.selectedTags.size < 2){
        alert('Sélectionne au moins 2 tags à fusionner (clique-les dans A→Z).');
        return;
      }
      state.mergeArmed = true;
      renderListView(); // bouton devient “Confirmer fusion”
      return;
    }
    // Confirmer fusion
    const newTag = prompt('Nom du nouveau tag (fusion de : ' + Array.from(state.selectedTags).join(', ') + ') ?');
    if (!newTag || !newTag.trim()){ state.mergeArmed=false; renderListView(); return; }

    const newT = newTag.trim();
    for (const it of state.items){
      const set = new Set(it.tags||[]);
      let touched = false;
      for (const t of state.selectedTags){ if (set.delete(t)) touched = true; }
      if (touched) set.add(newT);
      it.tags = Array.from(set);
    }
    state.mergeArmed = false;
    state.selectedTags.clear();
    save(); renderListView();
  }

  function onEditTagClick(){
    const tags = allTags();
    if (!tags.length){ alert('Aucun tag existant.'); return; }

    let from = null;
    if (state.selectedTags.size === 1){
      from = Array.from(state.selectedTags)[0];
    } else {
      from = prompt('Quel tag veux-tu renommer ? (parmi : ' + tags.join(', ') + ')');
      if (!from) return;
      if (!tags.includes(from)){ alert('Tag introuvable.'); return; }
    }
    const to = prompt(`Nouveau nom pour "${from}" ?`);
    if (!to || !to.trim()) return;

    const newT = to.trim();
    for (const it of state.items){
      const set = new Set(it.tags||[]);
      if (set.delete(from)) set.add(newT);
      it.tags = Array.from(set);
    }
    save();
    state.selectedTags.delete(from);
    state.selectedTags.add(newT);
    renderListView();
  }

    /* -------------------------- EXPORT JSON (CHIFFRÉ) -------------------------- */
    async function onExportJsonClick(){
      if (!state.exportPanelOpen){
        state.exportPanelOpen = true;
        state.exportSelected = new Set(allTags()); // Tout coché à l’ouverture
        renderListView();
        return;
      }
    
      if (!state.exportSelected.size){
        alert('Sélectionne au moins un tag à exporter.');
        return;
      }
    
      const globalTag = prompt('Entrer un tag global pour le paquet exporté :');
      if (!globalTag || !globalTag.trim()){
        alert('Tag global requis.');
        return;
      }
      const g = globalTag.trim();
      const selected = Array.from(state.exportSelected);
      const items = state.items.filter(it => (it.tags||[]).some(t => selected.includes(t)));
    
      // payload “fonctionnel”
      const payload = {
        type: 'glossary-export',
        version: 2,
        exportedAt: new Date().toISOString(),
        globalTag: g,
        selectedTags: selected,
        items: items.map(it => ({ term: it.term, def: it.def, tags: it.tags||[] }))
      };
    
      // === mot de passe via modale (caractères masqués) ===
      const pass = await App.uiList?.openPasswordDialog?.({ mode: 'unlock' });
      // Mot de passe obligatoire (min 8 caractères par ex.)
      if (!pass || pass.trim().length < 8) {
        alert('⚠️ Mot de passe obligatoire (8 caractères minimum) pour l’export ZIP.');
        return;
      }

      // === KDF PBKDF2 + AES-GCM ===
      const enc = new TextEncoder();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv   = crypto.getRandomValues(new Uint8Array(12));
    
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pass), { name:'PBKDF2' }, false, ['deriveKey']);
      const iterations  = 200000; // durcir un peu
      const key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', hash:'SHA-256', salt, iterations },
        keyMaterial,
        { name:'AES-GCM', length:256 },
        false,
        ['encrypt']
      );
    
      const pt = enc.encode(JSON.stringify(payload));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, pt));
    
      // Base64URL helpers
      const b64u = {
        e: (u8) => btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')
      };
    
      // paquet “enveloppe” portable
      const envelope = {
        type: 'glossary-export',
        version: 2,
        encrypted: true,
        alg: 'AES-GCM',
        kdf: 'PBKDF2',
        hash: 'SHA-256',
        iter: iterations,
        salt: b64u.e(salt),
        iv:   b64u.e(iv),
        ct:   b64u.e(ct)
      };
    
      const blob = new Blob([JSON.stringify(envelope, null, 2)], {type:'application/json'});
      triggerDownload(blob, `glossaire-export-${g}.enc.json`);
      state.exportPanelOpen = false;
      renderListView();
    }

    function paintExportPanel(){
      const host = $('#exportPanel'); if (!host) return;
      const list = $('#exportTagsList'); if (!list) return;
    
      if (!state.exportPanelOpen){ host.style.display = 'none'; return; }
      host.style.display = '';
    
      const tags = allTags();
    
      list.innerHTML = '';
      if (!tags.length){
        list.innerHTML = `<span style="opacity:.7">Aucun tag disponible.</span>`;
        return;
      }
      for (const t of tags){
        const id = `exp_${t.replace(/\W+/g,'_')}`;
        const w = document.createElement('label');
        w.style.cssText = 'display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 10px;cursor:pointer;';
        w.innerHTML = `<input type="checkbox" id="${id}" ${state.exportSelected.has(t)?'checked':''}> <span>#${escapeHTML(t)}</span>`;
        const cb = w.querySelector('input');
        cb.addEventListener('change', () => {
          if (cb.checked) state.exportSelected.add(t);
          else state.exportSelected.delete(t);
        });
        list.appendChild(w);
      }
    }


  function toggleAllExportTags(){
    const tags = allTags();
    if (!tags.length) return;
    const allChecked = state.exportSelected.size === tags.length;

  /* -------------------------- IMPORT JSON -------------------------- */
  function onImportJsonClick(){
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'application/json';
    input.addEventListener('change', async () => {
      const file = input.files?.[0]; if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (data?.type !== 'glossary-export' || !data?.items || !data?.globalTag){
          alert('Fichier incompatible.');
          return;
        }
        const g = String(data.globalTag).trim();
        const items = Array.isArray(data.items) ? data.items : [];
        let added = 0;
        for (const it of items){
          const tags = Array.isArray(it.tags) ? it.tags : [];
          const prefixed = tags.map(t => `${g}:${t}`);
          const mergedTags = Array.from(new Set([g, ...prefixed]));
          state.items.push({
            id: uid(),
            term: it.term || '',
            def: it.def || '',
            tags: mergedTags
          });
          added++;
        }
        save(); renderListView();
        alert(`${added} élément(s) importé(s) avec le tag global “${g}”.`);
      } catch (e){
        console.error(e);
        alert('Erreur lors de la lecture du fichier.');
      }
    });
    input.click();
  }

/* -------------------------- IMPORT JSON (DÉCHIFFRÉ) -------------------------- */
function onImportJsonClick(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json';
  input.addEventListener('change', async () => {
    const file = input.files?.[0]; if (!file) return;
    try {
      const text = await file.text();
      let data = JSON.parse(text);

      // Détecter l’enveloppe chiffrée
      if (data?.encrypted === true && data?.alg === 'AES-GCM' && data?.kdf === 'PBKDF2') {
        const pass = await App.uiList?.openPasswordDialog?.({ mode: 'unlock' });
        if (!pass) return;

        // helpers
        const b64u = { d: (s) => new Uint8Array([...atob(s.replace(/-/g,'+').replace(/_/g,'/'))].map(c=>c.charCodeAt(0))) };
        const enc = new TextEncoder();

        const salt = b64u.d(data.salt);
        const iv   = b64u.d(data.iv);
        const iter = Number(data.iter) || 200000;

        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pass), { name:'PBKDF2' }, false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name:'PBKDF2', hash:'SHA-256', salt, iterations: iter },
          keyMaterial,
          { name:'AES-GCM', length:256 },
          false,
          ['decrypt']
        );

        let pt;
        try {
          pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, b64u.d(data.ct));
        } catch {
          alert('Mot de passe invalide ou fichier corrompu.');
          return;
        }
        data = JSON.parse(new TextDecoder().decode(new Uint8Array(pt)));
      }

      // À ce stade, data = payload fonctionnel
      if (data?.type !== 'glossary-export' || !data?.items || !data?.globalTag){
        alert('Fichier incompatible.');
        return;
      }

      const g = String(data.globalTag).trim();
      const items = Array.isArray(data.items) ? data.items : [];
      let added = 0;
      for (const it of items){
        const tags = Array.isArray(it.tags) ? it.tags : [];
        const prefixed = tags.map(t => `${g}:${t}`);
        const mergedTags = Array.from(new Set([g, ...prefixed]));
        state.items.push({ id: uid(), term: it.term || '', def: it.def || '', tags: mergedTags });
        added++;
      }
      save(); renderListView();
      alert(`${added} élément(s) importé(s) avec le tag global “${g}”.`);
    } catch (e){
      console.error(e);
      alert('Erreur lors de la lecture du fichier.');
    }
  });
  input.click();
}

  function currentEditorTags(){ return $$('#gTags .chip').map(ch=>ch.dataset.tag); }
  function makeChip(tag){
    const el = document.createElement('span');
    el.className = 'chip';
    el.dataset.tag = tag;
    el.innerHTML = `#${escapeHTML(tag)} <button type="button" class="mini-btn" aria-label="Retirer ${escapeHTML(tag)}">✕</button>`;
    el.querySelector('button').addEventListener('click', (e)=> e.currentTarget.closest('.chip').remove());
    return el;
  }
  function addTag(tag){
    tag = tag.trim().replace(/\s+/g,' ');
    if (!tag) return;
    const cur = new Set(currentEditorTags());
    if (cur.has(tag)) return;
    $('#gTags').appendChild(makeChip(tag));
  }
  function processTagInputStreaming(){
    const input = $('#gTagsInput'); if (!input) return;
    const parts = input.value.split(/[,\n;]+/);
    if (parts.length <= 1) return;
    const complete = parts.slice(0, -1).map(s=>s.trim()).filter(Boolean);
    for (const t of complete) addTag(t);
    input.value = parts[parts.length - 1];
  }
  function commitTagInput(){
    const input = $('#gTagsInput'); if (!input) return;
    const raw = input.value.trim();
    if (!raw) return hideSug();
    const parts = raw.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);
    const seen = new Set(currentEditorTags());
    for (const p of parts){ if (!seen.has(p)) { addTag(p); seen.add(p); } }
    input.value = ''; hideSug();
  }

  /* ------------------------ Suggestions de tags -------------------- */
  function hideSug(){ const s = $('#gTagSug'); if (s){ s.style.display = 'none'; s.innerHTML = ''; } }
  function showSug(){
    const inp = $('#gTagsInput'); const box = $('#gTagSug'); if (!inp || !box) return;
    const q = norm(inp.value).trim();
    const tags = allTags().filter(t => norm(t).includes(q));
    if (!q || !tags.length) { hideSug(); return; }
    box.innerHTML = '';
    for (const t of tags){
      const b = document.createElement('button');
      b.type='button'; b.className='btn ghost sm'; b.textContent=t; b.setAttribute('role','option');
      b.addEventListener('click', ()=>{ addTag(t); inp.value=''; hideSug(); });
      box.appendChild(b);
    }
    box.style.display = 'flex';
  }
  function showAllTagsSug(){
    const inp = $('#gTagsInput'); const box = $('#gTagSug'); const tags = allTags();
    box.innerHTML = '';
    if (!tags.length) box.innerHTML = `<span style="opacity:.7">Aucun mot-clé.</span>`;
    else for (const t of tags){ const b=document.createElement('button'); b.type='button'; b.className='btn ghost sm'; b.textContent=t; b.addEventListener('click', ()=>{ addTag(t); inp.value=''; hideSug(); }); box.appendChild(b); }
    box.style.display = 'flex'; inp.focus();
  }

  function bindGlobal(modal){

      renderListView(); showView('list');

    modal.addEventListener('click', (e)=>{ if (e.target===modal) modal.classList.remove('is-open'); });
    window.addEventListener('keydown', (e)=>{ if (e.key==='Escape' && modal.classList.contains('is-open')) modal.classList.remove('is-open'); });

    // Recherche
    $('#glossarySearch')?.addEventListener('input', (e)=>{
      state.q = e.target.value;

    document.addEventListener('click', (e) => {
      const b = e.target.closest('button');

      switch (b.id) {
        case 'toggleAllExportTagsBtn':
          e.preventDefault(); toggleAllExportTags(); break;

        case 'exportJsonBtn':
          e.preventDefault(); onExportJsonClick(); break;
        case 'resetTagFiltersBtn':
          e.preventDefault(); resetTagFilters(); break;
        case 'deleteTagFiltersBtn':
          e.preventDefault(); deleteSelectedTagsFromAllItems(); break;
        case 'mergeTagsBtn':
          e.preventDefault(); onMergeTagsClick(); break;
        case 'editTagBtn':
          e.preventDefault(); onEditTagClick(); break;
        case 'importJsonBtn':
          e.preventDefault(); onImportJsonClick(); break;
        case 'browseAllTagsBtn':
          e.preventDefault(); state.tagsPanelOpen = !state.tagsPanelOpen; renderListView(); break;
      }
    });

    // Délégation pour le SELECT de tri
    document.addEventListener('change', (e) => {
      const sel = e.target.closest('#glSortDir');
      if (sel) {
        state.sortDir = sel.value === 'desc' ? 'desc' : 'asc';

  /* --------------------------- Export ODT -------------------------- */
  function exportGlossaryODT(){
    const items = getFilteredItems().map(it => ({ term: it.term||'', def: (it.def||'').replace(/\r?\n/g,'\n') }));
    if (!items.length){ alert("Aucun élément à exporter."); return; }
    if (window.JSZip) exportAsODT(items); else exportAsFODT(items);
  }
  function exportAsODT(items){
    const zip = new JSZip();
    zip.file('mimetype','application/vnd.oasis.opendocument.text',{compression:'STORE'});
    const manifestXml = `<?xml version="1.0" encoding="UTF-8"?><manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0"><manifest:file-entry manifest:media-type="application/vnd.oasis.opendocument.text" manifest:full-path="/"/><manifest:file-entry manifest:media-type="text/xml" manifest:full-path="content.xml"/><manifest:file-entry manifest:media-type="" manifest:full-path="styles.xml"/></manifest:manifest>`;
    const stylesXml = `<?xml version="1.0" encoding="UTF-8"?><office:document-styles xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" office:version="1.2"><office:styles><style:default-style style:family="paragraph"><style:paragraph-properties fo:margin-left="0" fo:margin-right="0" fo:text-indent="0"/><style:text-properties fo:font-size="11pt"/></style:default-style><style:style style:name="TH" style:family="table-cell"><style:text-properties fo:font-weight="bold"/></style:style></office:styles></office:document-styles>`;
    const makeCell=(t,th=false)=>`<table:table-cell${th?' table:style-name="TH"':''}><text:p>${escapeXml(t)}</text:p></table:table-cell>`;
    const rows = [`<table:table-row>${makeCell('Terme',true)}${makeCell('Définition',true)}</table:table-row>`,...items.map(it=>`<table:table-row>${makeCell(it.term)}${makeCell(it.def)}</table:table-row>`)].join('');
    const contentXml = `<?xml version="1.0" encoding="UTF-8"?><office:document-content xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:table="urn:oasis:names:tc:opendocument:xmlns:table:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" office:version="1.2"><office:body><office:text><text:h text:outline-level="1">Glossaire</text:h><table:table table:name="Glossaire"><table:table-column/><table:table-column/>${rows}</table:table></office:text></office:body></office:document-content>`;
    zip.file('content.xml', contentXml); zip.file('styles.xml', stylesXml); zip.folder('META-INF').file('manifest.xml', manifestXml);
    zip.generateAsync({type:'blob',compression:'DEFLATE'}).then(b=>triggerDownload(b,'Glossaire.odt')).catch(()=>exportAsFODT(items));
  }
  function exportAsFODT(items){
    const makeRow = (term,def)=>`<table:table-row><table:table-cell><text:p>${escapeXml(term)}</text:p></table:table-cell><table:table-cell><text:p>${escapeXml(def)}</text:p></table:table-cell></table:table-row>`;
    const rows=[makeRow('Terme','Définition'),...items.map(it=>makeRow(it.term,it.def))].join('');
    const xml=`<?xml version="1.0" encoding="UTF-8"?><office:document xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:table="urn:oasis:names:tc:opendocument:xmlns:table:1.0" office:version="1.2" office:mimetype="application/vnd.oasis.opendocument.text"><office:body><office:text><text:h text:outline-level="1">Glossaire</text:h><table:table table:name="Glossaire"><table:table-column/><table:table-column/>${rows}</table:table></office:text></office:body></office:document>`;
    const blob=new Blob([xml],{type:'application/vnd.oasis.opendocument.text'}); triggerDownload(blob,'Glossaire.fodt');
  }

  function triggerDownload(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },0);
  }
  function escapeXml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }

  /* -------------------------------- Init --------------------------- */
  function init(){
    load();
    const modal = ensureModalStructure(); if (!modal) return;
    bindGlobal(modal);
    state.mode='list'; state.selectedId=null;
    renderListView(); showView('list');
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
