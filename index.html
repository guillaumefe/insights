<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>!nsights</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<meta name="color-scheme" content="light dark">

<!-- ZIP AES (7-Zip/WinZip) -->
<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.31/dist/zip.min.js"></script>

<style>
/* ======================================================================
   Thème / variables
   ====================================================================== */
:root {
  --bg: #0b0b0c;
  --fg: #f5f7fb;
  --muted: #9aa3b2;

  --card: #14161a;
  --border: #23262d;

  --accent: #4f8cff;
  --accent-2: #22c55e;
  --danger: #ef4444;

  --radius: 12px;
  --space: 12px;
  --space-sm: 8px;

  --badge-size: 24px;
  --badge-gap: 6px;

  /* Z-index scale */
  --z-drag: 20;
  --z-drag-during: 500;
  --z-header: 2000;
  --z-overlay: 9000;
  --z-modal: 10000;
  --z-toast: 11000;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f7f8fb;
    --fg: #0f1420;
    --muted: #556070;

    --card: #ffffff;
    --border: #e7e9ef;
  }
}

/* ======================================================================
   Reset / base / typographie
   ====================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
html, body { margin: 0; padding: 0; width: 100%; }
body {
  margin: 0;
  font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial;
  background: var(--bg);
  color: var(--fg);
}
h1 { font-size: 1.25rem; margin: 0; }
.subtitle { color: var(--muted); font-size: .9rem; }
label { font-weight: 600; font-size: .85rem; margin: 0; }
.muted { color: var(--muted); margin: 0; font-size: 15px; opacity: .5; }
.divider { height: 1px; background: var(--border); margin: 10px 0; }

/* ======================================================================
   Layout général
   ====================================================================== */
.wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
main.wrap, .wrap { padding: 0; margin: 1%; max-width: 97.5%; width: 97.5%; }

header {
  position: sticky;
  top: 0;
  z-index: var(--z-header);
  -webkit-backdrop-filter: none;
  backdrop-filter: saturate(1.2) blur(8px);
  background: color-mix(in oklab, var(--bg) 85%, transparent);
  border-bottom: 1px solid var(--border);
}
@supports not (position: sticky) {
  header { position: static; }
}
header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  border-radius: 10px;
  display: inline-block;
  padding: 6px 14px;
  color: var(--fg);
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  letter-spacing: -.3px;
  margin-bottom: .7em;
}

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top-actions { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
header .topbar, header .top-actions { position: relative; z-index: 2; }

.grid { display: grid; gap: 16px; grid-template-columns: 1fr; padding: 16px; }
@media (min-width: 960px) { .grid { grid-template-columns: 360px 1fr; } }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 12px 40px rgba(0,0,0,.08);
}
.card h2 { margin: .2rem 0 .6rem; font-size: 1rem; }

/* ======================================================================
   Form controls
   ====================================================================== */
input[type="text"],
input[type="date"],
input[type="number"],
textarea,
select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg);
  border-radius: 10px;
  outline: none;
  margin-bottom: 6px;
}
input[type="text"][placeholder="YYYY-MM-DD"].invalid { border-color: var(--danger); }
textarea { min-height: 90px; resize: vertical; }
input[type="radio"], input[type="checkbox"] { margin-bottom: 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

input.invalid, textarea.invalid, select.invalid {
  border-color: #f23d3d !important;
  box-shadow: 0 0 0 2px rgba(242,61,61,.15);
}
label.invalid { border: 0 !important; box-shadow: none !important; }

/* ======================================================================
   Boutons
   ====================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--fg);
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 6px;
  font-size: .9rem;
}
.btn.primary  { background: var(--accent);   border-color: var(--accent);   color: #fff; }
.btn.success  { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
.btn.danger   { background: var(--danger);   border-color: var(--danger);   color: #fff; }
.btn.ghost    { background: transparent; }
.btn.sm       { padding: 6px 10px; border-radius: 8px; font-size: .9rem; }
.btn.adder    { width: auto; align-self: flex-start; border-radius: 999px; }
.btn.adder::before { content: "+"; font-weight: 800; margin-right: .25rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; pointer-events: none; }

.icon-btn,
.icon-btn.x {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  padding: 6px;
  border-radius: 10px;
  cursor: pointer;
  line-height: 0;
  position: relative;
  z-index: 1;
  pointer-events: auto;
}
.icon-btn:hover,
.icon-btn.x:hover { color: var(--fg); border-color: var(--accent); }
.icon-btn.x {
  width: 28px;
  height: 28px;
  min-width: 28px;
  display: inline-grid;
  place-items: center;
}

/* Mini boutons */
.mini-btn {
  font-size: .85rem;
  padding: .25rem .5rem;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 8px;
}

/* ======================================================================
   Sections & KV
   ====================================================================== */
.section {
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 10px;
  margin-bottom: 12px;
  background: color-mix(in oklab, var(--card) 90%, transparent);
}
.section h3 {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 0 0 14px 0;
  padding-bottom: 6px;
  border-bottom: 2px solid color-mix(in oklab, var(--accent) 28%, transparent);
}

.kv {
  display: grid !important;
  grid-template-columns: 220px minmax(0, 1fr);
  column-gap: 16px;
  row-gap: 8px;
  align-items: start;
}
.kv + .kv { margin-top: 10px; }
.kv > label { grid-column: 1; align-self: start; line-height: 1.35; padding-top: 6px; font-weight: 600; }
.kv > :not(label) { grid-column: 2; min-width: 0; }
.kv textarea { width: 100%; min-height: 120px; resize: vertical; }
.kv input[type="file"] { width: auto; max-width: 100%; }
.kv input[type="checkbox"], .kv input[type="radio"] { transform: translateY(2px); }

.group-legend { font-weight: 700; font-size: .95rem; margin: 6px 0 4px; }
.group-wrap { display: flex; flex-direction: column; gap: 10px; padding: 2px 0 6px; }
.section .group-wrap .kv { margin-top: 6px; }

#formHost .kv {
  display: grid;
  grid-template-columns: 220px minmax(0,1fr);
  column-gap: 16px;
  row-gap: 12px;
  align-items: start;
}
#formHost .kv > :not(label) { grid-column: 2; }
#formHost .kv > label { grid-column: 1; padding-top: 6px; font-weight: 600; }
#formHost .kv > .group-legend,
#formHost .kv > .group-wrap,
#formHost .kv > .repeatable,
#formHost .kv > .pager,
#formHost .kv > .kv { grid-column: 1 / -1; }
#formHost .kv .kv {
  display: grid;
  grid-template-columns: inherit;
  column-gap: inherit;
  row-gap: inherit;
  align-items: start;
}
#formHost .kv .kv > label { grid-column: 1; padding-top: 6px; }
#formHost .kv .kv > :not(label) { grid-column: 2; }

/* KV responsive */
@media (max-width: 860px) {
  #formHost .kv, .kv {
    grid-template-columns: 1fr !important;
    column-gap: 12px;
    row-gap: 8px;
  }
  .kv > label,
  .kv > :not(label) {
    grid-column: 1 !important;
    padding-top: 0;
    min-width: 0;
  }
  .kv input[type="checkbox"], .kv input[type="radio"] { transform: none; }
}
@media (max-width: 780px) {
  #formHost .kv,
  #formHost .kv .kv { grid-template-columns: 1fr; }
  #formHost .kv > label,
  #formHost .kv .kv > label,
  #formHost .kv > :not(label),
  #formHost .kv .kv > :not(label) {
    grid-column: 1; padding-top: 0;
  }
}

/* ======================================================================
   Liste de process en cours
   ====================================================================== */
.list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow: auto; }
.item {
  display: flex; align-items: center; gap: 10px; padding: 10px;
  border: 1px solid var(--border); border-radius: 12px; background: transparent; cursor: pointer;
}
.item .meta { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.item .title { font-weight: 700; }
.item .sub { color: var(--muted); font-size: .85rem; }
.item.selected {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 6%, transparent);
}
.progress .pill, .progress-pill, .pill { white-space: nowrap; }
.list .item { padding-inline-end: 16px !important; overflow: visible !important; box-sizing: border-box; }
.list .item > *:last-child { margin-inline-start: auto; }
.list .item .icon-btn, .list .item .mini-btn { flex: 0 0 auto; flex-shrink: 0; }
.list .item::after { content: none !important; }

/* Badges / pills / progress */
.pill {
  display: inline-flex; align-items: center; gap: .4rem; padding: .25rem .6rem;
  border-radius: 999px; background: color-mix(in oklab, var(--accent) 18%, transparent);
  border: 1px solid var(--border); font-size: .75rem;
}
.prog {
  height: 8px; width: 90px; border-radius: 999px;
  background: color-mix(in oklab, var(--bg) 70%, var(--card));
  overflow: hidden; border: 1px solid var(--border);
}
.prog > span { display: block; height: 100%; background: var(--accent-2); width: 0%; }

body:not(.detail-open) .col-detail { display: none; }

/* ======================================================================
   Répétables
   ====================================================================== */
.repeatable { display: grid; gap: 8px; }
.repeatable-item {
  position: relative;
  border: 1px dashed var(--border);
  border-radius: 10px;
  padding: calc(8px + var(--badge-size) + var(--badge-gap)) 8px 6px 8px;
  background: color-mix(in oklab, var(--card) 95%, transparent);
}
.repeatable .repeatable .repeatable-item {
  padding: calc(6px + var(--badge-size) + 4px) 6px 6px 6px;
  border-radius: 8px;
}
.repeatable-item > .input-wrap { display: block; }
.repeatable-item .input-wrap > * { display: block; margin: 0 0 6px 0; }

.tagbar, .mini-tags {
  position: absolute; top: 6px; left: 6px; display: flex; gap: 6px; z-index: 1;
}
.tag-btn, .mini-btn {
  width: var(--badge-size); height: var(--badge-size);
  display: inline-grid; place-items: center;
  border: 1px solid var(--border); border-radius: 999px;
  background: color-mix(in oklab, var(--card) 96%, transparent);
  padding: 0; font-size: 14px; line-height: 1; color: var(--muted); cursor: pointer;
}
.tag-btn:hover, .mini-btn:hover { color: var(--fg); border-color: var(--accent); }

.repeatable.gutter .repeatable-item { padding-left: 36px; }
.repeatable.gutter .tagbar, .repeatable.gutter .mini-tags { left: 8px; }

/* Radios compacts */
[role="radiogroup"] .row { gap: 6px; margin: 0; }

/* ======================================================================
   Fichiers (édition + preview)
   ====================================================================== */
.file-row { display: flex; align-items: center; gap: 8px; }
.file-chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 10px; font-size: .85rem;
}
.file-actions { margin-left: .5rem; display: inline-flex; gap: .25rem; }

.file-list {
  list-style: none; margin: 6px 0 0; padding-left: 0;
  font-size: .85rem; color: var(--muted);
}
.file-list > li, .file-item {
  display: flex; align-items: center; gap: .5rem; line-height: 1.4;
  padding: 2px 0; white-space: normal; overflow-wrap: anywhere;
}
.file-bullet {
  width: .4rem; height: .4rem; border-radius: 999px; background: currentColor;
  opacity: .35; flex: 0 0 .4rem; transform: translateY(1px);
}
.file-link {
  text-decoration: none; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; max-width: 100%; flex: 1 1 auto;
}
.file-item.is-removed .file-link,
.file-list > li.is-removed .file-link,
.file-list > li.old .file-link { text-decoration: line-through; opacity: .6; }
.file-item.is-removed .file-bullet,
.file-list > li.is-removed .file-bullet,
.file-list > li.old .file-bullet { opacity: .15; }
.file-meta { font-size: .875em; opacity: .7; }

/* ======================================================================
   Prévisualisation
   ====================================================================== */
body.preview-open #formHost,
body.preview-open #progressInfo { display: none !important; }
body.preview-open #previewWrap { display: block !important; }

#previewWrap { display: flex; flex-direction: column; height: calc(100vh - 64px); margin-top: 0; min-height: 0; }
#previewWrap .section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#preview {
  flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; background: color-mix(in oklab, var(--card) 92%, transparent);
}
.preview {
  border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  background: color-mix(in oklab, var(--card) 92%, transparent); overflow: auto;
}
.preview h1, .preview h2 { margin: .2rem 0; }
.preview h1 { font-size: 1.1rem; }
.preview h2 { font-size: 1rem; color: var(--muted); }
.preview .mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  white-space: pre-wrap;
}
.preview table.kv {
  display: table !important; width: 100%; table-layout: fixed; border-collapse: collapse; margin: 8px 0 14px;
}
.preview table.kv th, .preview table.kv td { border: 1px solid var(--border); padding: 6px; vertical-align: top; }
.preview table.kv th { background: color-mix(in oklab, var(--card) 96%, transparent); text-align: left; }
.preview .kv-title { margin: .2rem 0 .4rem; color: var(--muted); font-weight: 600; }
.preview .subsep { height: 8px; }
.preview td, .preview .mono { overflow-wrap: anywhere; word-break: break-word; }
.preview a { word-break: break-word; text-decoration: underline; }

@media (max-width: 680px) {
  .preview table.kv { table-layout: auto; }
  .preview table.kv th, .preview table.kv td { display: block; width: auto !important; }
}

/* Uniformisation preview valeurs */
.preview table.kv td { font-size: .85rem; color: var(--muted); font-weight: 400; line-height: 1.4; }
.preview table.kv td :where(p, span, a, ul, ol, li, code, strong, em) { font: inherit; color: inherit; }
.preview table.kv td > :first-child { margin-top: 0; }
.preview table.kv td > :last-child { margin-bottom: 0; }

/* ======================================================================
   Placeholder (colonne droite fermée)
   ====================================================================== */
body:not(.detail-open) .col-detail { display: block; }
body:not(.detail-open) #detailToolbar,
body:not(.detail-open) #formHost,
body:not(.detail-open) #progressInfo,
body:not(.detail-open) #previewWrap { display: none !important; }

.placeholder {
  display: none; min-height: 280px; border: 1px dashed var(--border); border-radius: var(--radius);
  padding: 18px; background: color-mix(in oklab, var(--card) 94%, transparent); place-items: center;
}
.placeholder .inner { max-width: 560px; text-align: center; margin: auto; display: grid; gap: 10px; }
.placeholder h3 { margin: .2rem 0; font-size: 1.05rem; }
.placeholder p { margin: 0; color: var(--muted); }
.placeholder .steps { text-align: left; margin-top: 6px; padding-left: 1.1rem; }
.placeholder .steps li { margin: .25rem 0; }
.placeholder .actions { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }

/* ======================================================================
   Toast
   ====================================================================== */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(30px);
  background: color-mix(in oklab, var(--card) 92%, transparent);
  border: 1px solid var(--border); color: var(--fg);
  padding: 10px 16px; border-radius: 999px;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
  font-size: .9rem; opacity: 0; pointer-events: none;
  transition: all .3s ease; z-index: var(--z-toast);
  min-width: 240px; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success {
  background: color-mix(in oklab, var(--accent-2) 25%, var(--card));
  border-color: var(--accent-2);
  color: #fff;
  box-shadow: 0 4px 16px rgba(34,197,94,.35);
}
.toast.error {
  background: color-mix(in oklab, #f44336 25%, var(--card));
  border-color: #f44336;
  color: #fff;
  box-shadow: 0 4px 16px rgba(244,67,54,.35);
}
.toast.info {
  background: color-mix(in oklab, var(--accent) 25%, var(--card));
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 4px 16px rgba(79,140,255,.35);
}
.toast.warning {
  background: color-mix(in oklab, #f59e0b 25%, var(--card));
  border-color: #f59e0b;
  color: #fff;
  box-shadow: 0 4px 16px rgba(245,158,11,.35);
}
@media (prefers-color-scheme: light) {
  .toast.success { background: color-mix(in oklab, var(--accent-2) 85%, #fff); color: #031; }
  .toast.info    { background: color-mix(in oklab, var(--accent) 85%, #fff);   color: #013; }
  .toast.error   { background: color-mix(in oklab, #f44336 85%, #fff);         color: #300; }
  .toast.warning { background: color-mix(in oklab, #f59e0b 85%, #fff);         color: #432; }
}

/* ======================================================================
   Highlight champs (animation)
   ====================================================================== */
@keyframes fieldHighlight {
  0%   { box-shadow: 0 0 0 0 var(--accent); background: color-mix(in oklab, var(--accent) 15%, transparent); }
  60%  { box-shadow: 0 0 0 6px color-mix(in oklab, var(--accent) 30%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent;   background: transparent; }
}
.highlighted { animation: fieldHighlight 1.8s ease-out; }

/* ======================================================================
   Menus
   ====================================================================== */
.menu {
  position: absolute;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
  padding: 6px; z-index: 20; min-width: 180px;
}
.menu button { width: 100%; justify-content: flex-start; }
.menu .sep { height: 1px; background: var(--border); margin: 6px 0; }

/* ======================================================================
   Modale mot de passe
   ====================================================================== */
#pwdModal {
  position: fixed; inset: 0; display: none; place-items: center;
  background: color-mix(in oklab, #000 55%, transparent);
  -webkit-backdrop-filter: blur(6px) saturate(1.05);
  backdrop-filter: blur(6px) saturate(1.05);
  z-index: var(--z-overlay);
}
#pwdModal.is-open { display: grid; }
#pwdModal .modal-box {
  position: relative;
  width: 92%; max-width: 480px; min-width: 300px; background: var(--card);
  border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 24px 80px rgba(0,0,0,.45);
  padding: 22px; z-index: var(--z-modal);
}
#pwdModal h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; }
#pwdModal .lab { display: block; font-weight: 600; font-size: .9rem; margin: 6px 0 4px; }
#pwdModal .row.stack { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
#pwdModal input[type="password"],
#pwdModal input[type="text"] {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem;
  background: var(--bg,#fff); outline: none; transition: border-color .2s, box-shadow .2s;
}
#pwdModal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 35%, transparent); }
#pwdModal .only-unlock, #pwdModal .only-change { display: none !important; }
#pwdModal.is-unlock .only-unlock,
#pwdModal.is-change  .only-change,
#pwdModal.is-setup   .only-change,
#pwdModal.is-change .only-unlock { display: block !important; }
#pwdModal .row.actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 20px; }

/* Quand une modale s’ouvre, on planque la barre de split */
body.modal-open #dragbar,
body.locked #dragbar { display: none; }

/* ======================================================================
   Modale d’erreur JSON
   ====================================================================== */
.json-modal {
  position: fixed; inset: 0;
  background: color-mix(in oklab, #000 55%, transparent);
  -webkit-backdrop-filter: blur(4px) saturate(1.02);
  backdrop-filter: blur(4px) saturate(1.02);
  display: flex; align-items: center; justify-content: center;
  z-index: var(--z-overlay);
}
.json-modal.hidden { display: none; }
.json-modal-content {
  background: #fff; max-width: 600px; width: 90%; border-radius: 8px; padding: 20px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35); color: #333;
}
.json-modal-content h2 { margin-top: 0; font-size: 1.3rem; color: #c00; }
.json-modal-content pre {
  background: #f8f8f8; padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; font-size: .9rem; line-height: 1.3;
}
.json-modal-content button {
  margin-top: 16px; padding: 8px 14px; border: none; border-radius: 4px; background: #c00; color: #fff; font-size: 1rem; cursor: pointer;
}
.json-modal-content button:hover { background: #a00; }

/* ======================================================================

.modal.export-dialog .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }

.modal.export-dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

.modal.export-dialog .actions button:first-child { background: #2563eb; border-color: #2563eb; color: #fff; }
.modal.export-dialog .actions button:last-child { background: #e5e7eb; border-color: #e5e7eb; }

/* ======================================================================
   Bannière de complétion
   ====================================================================== */
.completion-banner {
  display: flex; align-items: center; gap: 14px; justify-content: space-between;
  padding: 14px 16px; margin: 0 0 12px 0;
  border: 1px solid var(--border); border-radius: 12px;
  background: #7ED957; color: #0b0b0c;
  box-shadow: 0 6px 24px rgba(0,0,0,.18);
}
.completion-banner .info { display: flex; flex-direction: column; gap: 2px; min-width: 220px; }
.completion-banner .info .title { font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: .95rem; }
.completion-banner .info .sub { font-size: .95rem; opacity: .9; }
.completion-banner .bar { flex: 1; height: 12px; border-radius: 999px; overflow: hidden; background: rgba(0,0,0,.15); }
.completion-banner .bar > span { display: block; height: 100%; width: 0%; background: rgba(0,0,0,.45); transition: width .25s ease; }

@media (max-width: 720px) {
  .completion-banner { flex-direction: column; align-items: stretch; }

}

/* ======================================================================
   Recherche / Création
   ====================================================================== */
#searchSection input[type="search"],
#searchSection input[type="text"]#searchBox {
  width: 100%; max-width: 600px; padding: 14px 18px; font-size: 1rem;
  border-radius: 8px; border: 1px solid #ccc; box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  margin-top: 8px; transition: all .2s ease;
}
#searchSection input[type="search"]:focus,
#searchSection input[type="text"]#searchBox:focus {

}
#newTitle {
  width: 100%; max-width: 600px; padding: 14px 18px; font-size: 1rem; font-weight: 500;
  border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.08);

}

/* ======================================================================
   Pager
   ====================================================================== */
.pager.global { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
.pager-left, .pager-right { display: flex; gap: 8px; }

.pager.local.prevnext {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin: 6px 0 8px;
}
.pager.local.prevnext .pager-center,
.pager.local.prevnext .pager-count { display: none !important; }

.pager.local .badge {
  margin-left: auto; background: transparent; border: 1px solid var(--border);
  padding: 6px 10px; border-radius: 999px; color: var(--muted);
}

/* ======================================================================
   Locked state
   ====================================================================== */
body.locked main#app {
  filter: blur(6px); pointer-events: none; user-select: none; transition: filter .3s ease;
}
body.locked #pwdModal.is-open { filter: none; pointer-events: auto; }
body.locked #unlockBtn { display: inline-flex !important; }
body.locked #changePwdBtn { display: none !important; }
body:not(.locked) #unlockBtn { display: none !important; }
body:not(.locked) #changePwdBtn { display: inline-flex !important; }
body.locked #bundleBtn,
body.locked #importBtn,
body.locked #exportBtn { opacity: 1; pointer-events: auto; cursor: pointer; }
body.locked #pickTemplateBtn,
body.locked #applyTemplateBtn,
body.locked #resetTemplateBtn { opacity: .5; pointer-events: none; cursor: not-allowed; }

/* ======================================================================
   Process multiprocessus
   ====================================================================== */
.proc-columns {
  display: flex !important;
  flex-direction: column !important;
  gap: 14px !important;
}
.proc-panel {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: color-mix(in oklab, var(--card) 95%, transparent);
  width: 100%;
}
.proc-panel.done { border-color: color-mix(in oklab, var(--accent-2) 45%, var(--border)); }
.proc-panel.open .proc-body { display: flex; flex-direction: column; gap: 10px; }

.proc-head {
  background: color-mix(in oklab, var(--card) 98%, transparent);
  padding: 14px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);

}
.proc-title { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.2px; }
.proc-status { margin-right: auto; margin-left: 10px; font-size: .8rem; color: var(--muted); }
.proc-status.ok {
  color: #0a7f3f;
  background: color-mix(in oklab, var(--accent-2) 18%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent-2) 35%, transparent);
  border-radius: 999px; padding: 2px 8px; font-weight: 700;
}
.proc-body { padding: 10px; display: none; }
.proc-step { margin: 8px 0 0; font-size: .9rem; text-align: right; opacity: .75; }

.prog-multi { display: flex; flex-direction: column; gap: 6px; margin-left: auto; }
.pm-row { display: grid; grid-template-columns: auto 90px auto; gap: 8px; align-items: center; }
.pm-lab { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

@media (min-width: 1100px) {
  .proc-columns { display: flex !important; }
}

/* ======================================================================
   Split en Flex (desktop)
   ====================================================================== */
#app {
  --left: 420px;
  display: flex !important;
  gap: 24px;
  align-items: stretch;
}
#leftPane { flex: 0 0 var(--left); min-width: 260px; }
#rightPane { flex: 1 1 auto; min-width: 420px; }

/* Barre draggable */
#dragbar {
  flex: 0 0 8px;
  background: #ddd;
  border-left: 1px solid #cfcfcf;
  border-right: 1px solid #cfcfcf;
  cursor: col-resize;
  touch-action: none;
  position: relative;
  z-index: var(--z-drag);
}
#dragbar:hover { background: #ccc; }
body.is-dragging { user-select: none; -webkit-user-select: none; cursor: col-resize; }
body.is-dragging #dragbar { z-index: var(--z-drag-during); }

@media (max-width: 900px) {
  #app { flex-direction: column !important; gap: 16px; }
  #leftPane, #rightPane { flex: 1 1 auto; min-width: 0; }
  #dragbar { display: none; }
}

/* ======================================================================
   Tips
   ====================================================================== */
.tip-note {
  grid-column: 2;
  display: flex; gap: 8px; align-items: flex-start;
  background: #fff8c7; border: 1px solid #e6dc8a;
  padding: 8px 10px; border-radius: 8px; margin-top: -2px;
}
.tip-icn { font-size: 14px; }
.tip-body { font-size: .85rem; white-space: pre-wrap; }

/* ======================================================================
   Full modal générique
   ====================================================================== */
.full-modal {
  position: fixed; inset: 0; display: none;
  background: color-mix(in oklab, #000 55%, transparent);
  -webkit-backdrop-filter: blur(6px) saturate(1.05);
  backdrop-filter: blur(6px) saturate(1.05);
  z-index: var(--z-overlay);
}
.full-modal.is-open { display: block; }
.full-modal-box {
  position: relative; margin: 24px auto; width: min(1200px, 96vw); height: calc(100vh - 48px);
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 24px 80px rgba(0,0,0,.45);
  display: flex; flex-direction: column;
}
.full-modal-head {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
}
.full-modal-head h3 { margin: 0; font-size: 1.15rem; }
.full-modal-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
#glossaryCloseBtn { margin-left: auto; position: absolute; top: 10px; right: 12px; }

@media (max-width: 900px) {
  .full-modal-box { width: 96vw; }
  .full-modal-head { flex-wrap: wrap; gap: 8px; }
}

/* ======================================================================
   Glossaire (icône, modale, liste/éditeur)
   ====================================================================== */
/* Icône dans le header (sticky) */
header .wrap { position: relative; }
#glossaryIconBtn {
  position: sticky;
  top: 14px;
  margin-left: auto;
  right: 0;
  width: 62px; height: 62px; border-radius: 18px;
  display: grid; place-items: center; font-size: 1.85rem;
  background: var(--card); border: 1px solid var(--border); color: var(--fg);
  box-shadow: 0 10px 28px rgba(0,0,0,.18); z-index: 3; cursor: pointer;
  transition: transform .15s, filter .2s;
}
#glossaryIconBtn:hover,
#glossaryIconBtn:focus {
  border-color: var(--accent);
  filter: brightness(1.05);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 35%, transparent);
  outline: none;
}
@media (max-width: 900px) {
  #glossaryIconBtn { width: 46px; height: 46px; border-radius: 12px; font-size: 1.35rem; top: 10px; }
}

/* Modale Glossaire */
#glossaryModal .full-modal-box { display: flex; flex-direction: column; min-height: 0; }
#glossaryModal .full-modal-head {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 10px 12px; backdrop-filter: blur(6px);
}
#glossaryModal .full-modal-head .row { display: flex; align-items: center; gap: 8px; }
#glossaryModal .full-modal-body { overflow: auto; min-height: 0; padding: 12px; }

#glossaryBody { padding-inline: 12px; padding-right: 16px; }

/* Barre de recherche */
#glossarySearch {
  height: 40px; padding: 0 14px 0 40px;
  border: 1px solid var(--border);
  border-radius: 999px; outline: none;
  background: var(--surface, #fff);
  box-shadow: inset 0 2px 8px rgba(0,0,0,.05);
  transition: box-shadow .2s, border-color .2s;
  background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='11' cy='11' r='7' stroke='%239aa3b2' stroke-width='2'/%3E%3Cpath d='M20 20L17 17' stroke='%239aa3b2' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: 12px center;
}
#glossarySearch:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent);
}

/* Bouton Ajouter (toggle) */
#glossaryToggleBtn {
  margin-left: auto; border-radius: 999px; padding: 8px 16px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); border: 1px solid var(--accent); color: #fff;
  box-shadow: 0 10px 20px rgba(0,0,0,.15);
}
#glossaryToggleBtn:hover { filter: brightness(1.05); }
#glossaryToggleBtn[data-mode="back"] {
  background: transparent; color: var(--fg);
  border-color: var(--border); box-shadow: none;
}

/* Glossaire split */
.glossary-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
.glossary-list, .templates-list { display: flex; flex-direction: column; gap: 8px; }
.glossary-list { overflow: auto; min-height: 0; }
.glossary-item, .template-item {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
  padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: transparent;
}
.item-title { font-weight: 700; }
.item-sub {
  color: var(--muted); font-size: .9rem; overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.item-actions { display: flex; gap: 6px; }

.glossary-editor {
  overflow: auto; min-height: 0; padding: 12px; border: 1px solid var(--border);
  border-radius: 10px; background: transparent; display: flex; flex-direction: column; gap: 12px;
}
.kv label { font-weight: 600; margin-bottom: .35rem; display: block; }
.kv input, .kv textarea {
  width: 100%; border: 1px solid var(--border); background: var(--surface, transparent);
  border-radius: 10px; padding: .6rem .7rem; font: inherit; resize: vertical;
}
#glossaryEditorView #gTags { display: flex; flex-wrap: wrap; gap: 6px; }
#glossaryEditorView .chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 999px;
}
#glossaryEditorView .chip .mini-btn { border: 0; background: transparent; cursor: pointer; }
#glossaryEditorView #gTagSug {
  max-height: 180px; overflow: auto; border: 1px solid var(--border); border-radius: 10px;
  padding: 6px; display: flex; gap: 6px; flex-wrap: wrap;
}

@media (max-width: 900px) {
  .glossary-split { grid-template-columns: 1fr; }
}

/* Tags / badges génériques */
.badge {
  display: inline-flex; align-items: center; gap: .35rem;
  font-size: .75rem; padding: .2rem .5rem;
  border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
}

/* Toolbar tags au-dessus du tableau */
#tagsToolbar { margin: 0 0 10px; padding: 12px; }
.tag-toggle.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag-toggle.is-active:hover { filter: brightness(1.05); }
.tag-active {
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px;
  background: var(--surface, #fff); cursor: pointer;
}
.tag-active:hover { border-color: var(--accent); }

/* ======================================================================
   Table-like (Glossaire) — base + responsive
   ====================================================================== */
.table-like {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--card, #fff);
}
.table-like, .table-like .tr, .table-like .td, .table-like .th { overflow: visible; }

.table-like .thead {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface, #f7f8fb);
  border-bottom: 1px solid var(--border);
}
.table-like .thead .tr { display: grid; grid-template-columns: 1fr 2fr 112px; } /* 112px actions (desktop) */
.table-like .th { padding: 12px 14px; font-weight: 700; }

.table-like .tbody .tr {
  position: relative;
  display: grid; grid-template-columns: 1fr 2fr 112px; gap: 0;
  border-bottom: 1px solid var(--border);
  padding-right: 120px; /* réserve pour actions flottantes (desktop) */
}
.table-like .tbody .tr:last-child { border-bottom: 0; }

.table-like .td {
  padding: 12px 14px; display: flex; align-items: flex-start; gap: 8px;
}
.table-like .td:nth-child(1) strong { font-size: 1rem; }

/* Zone actions (desktop) */
.table-actions,
.table-actions-cell { width: 112px; }
.table-actions-cell {
  box-sizing: border-box;
  padding-right: 12px;
  display: flex; gap: 8px; justify-content: flex-end; align-items: center;
  position: absolute; inset-inline-end: 12px; top: 50%; transform: translateY(-50%);
}

/* Mobile : 760px — pile lisible */
@media (max-width: 760px) {
  .table-like .thead { display: none; }
  .table-like .tbody .tr {
    grid-template-columns: 1fr;
    padding: 10px 12px;
  }
  .table-like .td { padding: 4px 0; }
  .table-like .tbody .tr + .tr { border-top: 1px solid var(--border); }
  .table-like .tbody .tr .td:nth-child(1) { order: 1; font-weight: 700; }
  .table-like .tbody .tr .td:nth-child(2) { order: 2; opacity: .95; }
  .table-like .tbody .tr .td:nth-child(3) { order: 3; margin-top: 6px; }
}

/* Mobile : 640px — actions en plein largeur sous la ligne */
@media (max-width: 640px) {
  .table-like { padding-inline: 12px; }
  .table-like .tr { display: block; padding: 12px 0; }
  .table-like .td { overflow: visible; }

  .table-like .tbody .tr { padding-right: 12px; }
  .table-actions, .table-actions-cell { width: auto; }
  .table-actions-cell {
    position: static; transform: none; margin-top: 8px; justify-content: flex-start; flex-wrap: wrap; padding-right: 0;
  }
  .table-actions-cell .btn.sm {
    flex: 1 1 140px; min-width: 0; text-align: center; padding: 6px 10px; font-size: .9rem;
  }
}

/* ======================================================================
   Badges (inline)
   ====================================================================== */
.badge { border-radius: 999px; padding: 2px 8px; border: 1px solid var(--border); }

/* ======================================================================
   Tagbar / actions compactes
   ====================================================================== */
.actions-compact { display: flex; gap: 6px; align-items: center; }

/* ======================================================================
   Divers
   ====================================================================== */
.tip-icn { font-size: 14px; }

/* ======================================================================
   Icône Glossaire (toggle bouton)
   ====================================================================== */
#glossaryToggleBtn[data-mode="back"] {
  background: transparent; color: var(--fg); border-color: var(--border); box-shadow: none;
}

/* ======================================================================
   Radios / mini-tags
   ====================================================================== */
.mini-tags { display: inline-flex; gap: 6px; margin-bottom: 6px; }
.mini-btn { font-size: 12px; padding: 2px 6px; border-radius: 6px; }

/* ======================================================================
   Header actions / menu (compléments)
   ====================================================================== */
.top-actions { display: flex; align-items: center; gap: 8px; }

/* ======================================================================
   Placeholder d’affichage conditionnel
   ====================================================================== */
body.preview-open #progressInfo { display: none !important; }

/* ======================================================================
   Sécurité : anti-overlay clic
   ====================================================================== */
.icon-btn { cursor: pointer; }

/* ======================================================================
   Ajustements finaux
   ====================================================================== */
#glossaryBody { padding-right: 16px; } /* compat */
.table-like .td { overflow: visible; }
#glossaryCloseBtn { margin-left: auto; }

</style>

    <div class="divider"></div>

    <section id="searchSection" role="search" aria-labelledby="searchTitle">
      <h2 id="searchTitle">Recherche</h2>
    <p style="
      display:block;
