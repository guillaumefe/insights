              row.append(legend, wrap);
              inner.append(row);
              return;
            }
    
            // --- Champ simple répétable
            if (entry?.repeatable) {
              const getArr = () => {
                const a = Array.isArray(item[entry.name]) ? item[entry.name] : [];
                if (!Array.isArray(item[entry.name])) item[entry.name] = a;
                return item[entry.name];
              };
              const setArr = (a) => { item[entry.name] = a; };
    
              const box = el('div', { class:'repeatable-list' });
              const list2 = el('div', { class:'repeatable-items' });
    
              const add2 = el('button', { class:'btn sm adder', type:'button' }, { children:['Ajouter'] });
              add2.addEventListener('click', async () => {
                const a = getArr().slice(); a.push(entry.type==='checkbox'?false:''); setArr(a);
                await persist(); list2.innerHTML=''; getArr().forEach((_, i) => list2.append(renderRow(i)));
              });
    
              const renderRow = buildRenderRow({
                field: entry, getArr, setArr,
                idxToRow: () => item,
                uidBase: `${key}__blk${idx}__${entry.name}`
              });
    
              getArr().forEach((_, i) => list2.append(renderRow(i)));
              box.append(list2, add2);
              inner.append(el('div', { class:'kv' }, { children:[ el('label', {}, { children:[ entry.label || entry.name ] }), box ] }));
              return;
            }
    
            // --- Champ simple non répétable
            const r = el('div', { class:'kv' });
            const l = el('label', {}, { children:[ entry.label || entry.name ] });
            const cur = (entry.type === 'date')
              ? (App.util?.getRawForData ? App.util.getRawForData(item, entry.name) : (item[entry.name] ?? ''))
              : (item[entry.name] ?? (entry.type === 'checkbox' ? false : ''));
    
            const input = renderInputForField(
              entry, cur,
              async (val) => {
                if (entry.type === 'date' && App.util?.setRawForData) App.util.setRawForData(item, entry.name, val);
                else item[entry.name] = val;
                await persist();
              },
              idx,
              { row: item, uid: `${key}__blk${idx}__${entry.name}` }
            );
    
            r.append(l, input);
            attachTip(r, entry);
            inner.append(r);
          });
    
          block.append(el('div', { class:'input-wrap' }, { children:[tag, inner] }));
          secEl.append(block);
        });
    
        secEl.append(addBlock);
      }
    
      function buildRenderRow({ field, getArr, setArr, idxToRow, uidBase }) {
        return function renderRow(i) {
          const input = renderInputForField(
            field,
            getArr()[i],
            newVal => {
              const a = getArr();
              a[i] = newVal;
              setArr(a);
              persist()
                .then(() => { App.util?.safeUIRefresh?.(); })
                .catch(()=>{});
            },
            i,
            {
              row: idxToRow ? idxToRow(i) : undefined,
              uid: uidBase ? `${uidBase}__i${i}` : undefined
            }
          );
    
          const tag = el('div', { class: 'mini-tags' });
          const dup = el('button', { class:'mini-btn', type:'button' }, { children:['⧉'] });
          const rm  = el('button', { class:'mini-btn', type:'button' }, { children:['✕'] });
          tag.append(dup, rm);
    
          dup.addEventListener('click', async () => {
            const arr = getArr().slice();
            const cur = arr[i];
            const cloned = (cur && typeof cur === 'object') ? structuredClone(cur) : cur;
            arr.push(cloned);
            setArr(arr);
            await persist().catch(()=>{});
            App.util?.safeUIRefresh?.();
            App.form?.renderForm?.();
          });
    
          rm.addEventListener('click', async () => {
            if (!confirm('Voulez-vous vraiment supprimer cet élément ?')) return;
            const arr = getArr().slice();
            arr.splice(i, 1);
            setArr(arr);
            await persist();
            App.form?.refreshProgressUI?.();
            App.form?.renderForm?.();
          });
    
          const wrap = el('div', { class: 'input-wrap' }, { children: [tag, input] });
          attachTip(wrap, field);
          return el('div', { class: 'repeatable-item' }, { children: [wrap] });
        };
      }
    
      // -------- Rendu du formulaire + filtrage
      function renderForm(){
        const host = $('#formHost') || document.getElementById('formHost') || document.body;
        if (!host) return;
    
        if (!App.state) App.state = {};
        App.form = App.form || {};
        App.util = App.util || {};
        App.util.getCA = App.util.getCA || (() => App.state?.currentAnalyse || null);
    
        // Dates strictes + RAW (format à plat + compat legacy)
        App.util.parseDateStrict = App.util.parseDateStrict || function (s) {
          return (typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s)) ? s : '';
        };
    
        App.util.getRawForData = App.util.getRawForData || function (obj, key) {
          if (!obj) return '';
          const flat = obj[key + '__raw'];
          if (typeof flat === 'string') return flat;
          const legacy = obj.__raw && obj.__raw[key];
          if (typeof legacy === 'string') return legacy;
          const plain = obj[key];
          return (typeof plain === 'string') ? plain : '';
        };
    
        App.util.setRawForData = App.util.setRawForData || function (obj, key, val) {
          if (!obj || typeof obj !== 'object') return;
          obj[key + '__raw'] = String(val ?? '');
          if (obj.__raw && Object.prototype.hasOwnProperty.call(obj.__raw, key)) {
            delete obj.__raw[key];
          }
          const parsed = App?.util?.parseDateStrict ? App.util.parseDateStrict(val) : null;
          obj[key] = parsed || '';
        };
    
        App.util.getRawHeader = App.util.getRawHeader || function (project, key) {
          project.__rawHeader = project.__rawHeader || {};
          return project.__rawHeader[key] ?? '';
        };
        App.util.setRawHeader = App.util.setRawHeader || function (project, key, val) {
          project.__rawHeader = project.__rawHeader || {};
          project.__rawHeader[key] = String(val ?? '');
        };
    
        // lecture du localStorage
        let LS = {};
        try { LS = JSON.parse(localStorage.getItem('formState') || '{}') || {}; } catch { LS = {}; }
    
        // bootstrap
        if (!App.state._bootstrapped) {
          App.state._bootstrapped = true;
    
          if (LS.currentAnalyseId && App.uiList?.findById) {
            const found = App.uiList.findById(LS.currentAnalyseId);
            if (found) {
              App.state.currentAnalyse = found;
              App.state._explicitAnalyseSelection = true;
            }
          }
    
          if (LS.panelOpen) App.form._panelOpen = LS.panelOpen;
          if (LS.multiPage) App.form._multiPage = LS.multiPage;
    
          if (typeof LS.showMissingOnly === 'boolean') {
            App.util.showMissingOnly = LS.showMissingOnly;
          }
        }
    
        if (!App.state?.currentAnalyse && LS.currentAnalyseId && !App.uiList?.findById) {
          setTimeout(() => {
            try {
              const found = App.uiList?.findById?.(LS.currentAnalyseId);
              if (found) {
                App.state.currentAnalyse = found;
                App.state._explicitAnalyseSelection = true;
                App.form?.renderForm?.();
              }
            } catch {}
          }, 0);
        }
    
        host.innerHTML = '';
    
        if (!App.state.currentAnalyse) {
          App.uiList?.clearDetail?.();
          return;
        }
    
        // Sauvegarde immédiate
        saveLS();
    
        App.state._explicitAnalyseSelection = true;
        if (!App.state.currentAnalyse.data) App.state.currentAnalyse.data = {};
    
        const MULTI = Array.isArray(App?.model?.PROCESSES) && (App.model.PROCESSES.length > 0) ? App.model.PROCESSES : null;
    
        // Pager global (mono-process uniquement)
        App.util?.clampPage?.();
        if (!MULTI) App.util?.renderPager?.(host);
    
        // Filtre "manquants"
        if (App.util?.showMissingOnly){
          window.FILTER_SNAPSHOT = buildFilterSnapshot(App.state.currentAnalyse);
        } else {
          window.FILTER_SNAPSHOT = null;
        }
        const SNAP = window.FILTER_SNAPSHOT;
    
        // Toggle barre filtre
        (function renderMissingToggle(){
          const bar = document.getElementById('missingToggleBar') || el('div', { id:'missingToggleBar', class:'toolbar' });
          const btn = bar.querySelector('button') || el('button', { class:'btn sm ghost', type:'button' });
          btn.textContent = App.util?.showMissingOnly ? 'Actif : manquants seulement' : 'Inactif : tout afficher';
          btn.setAttribute('aria-pressed', App.util?.showMissingOnly ? 'true' : 'false');
          btn.onclick = () => {
            App.util.showMissingOnly = !App.util.showMissingOnly;
            window.FILTER_SNAPSHOT = App.util.showMissingOnly ? buildFilterSnapshot(App.state.currentAnalyse) : null;
            saveLS();
            App.form?.renderForm?.();
          };
          if (!bar.contains(btn)) bar.append(btn);
          if (!host.querySelector('#missingToggleBar')) host.prepend(bar);
        })();
    
        // Migration douce fichiers (flag)
        try {
          const a = App.state?.currentAnalyse;
          if (a) {
            const data = (a.data ||= {});
            if (!data.__files_migrated_v2) {
              data.__files_migrated_v2 = true;
              persist().catch(() => {});
            }
          }
        } catch {}
    
        const afterPersist = async () => {
          await persist();
          App.form?.refreshProgressUI?.();
          if (App.util?.showMissingOnly && App.util.getCA()) {
            const { pct, filled, total } = computeProgress(App.util.getCA());
            updateCompletionBannerUI(pct, filled, total);
          }
        };
    
        // ========= PAGE EN-TÊTE (page 0) =========
        if ((App.util?.currentPage ?? 0) === 0){
          const sec = el('div', { class:'section' });
          sec.append(el('h3',{}, {children:['En-tête']}));
    
          // Titre
          const rowTitle = el('div', { class:'kv' });
          const inpTitle = el('input', {
            id:'hdr_title', type:'text',
            value: App.state.currentAnalyse.title || '',
            placeholder:'Titre',
            'aria-label':'Nom du projet concerné'
          });
          inpTitle.addEventListener('input', async (e)=>{
            if (!App.state?.currentAnalyse) return;
            App.state.currentAnalyse.title = e.target.value;
            await afterPersist();
          });
          rowTitle.append(el('label',{for:'hdr_title'},{children:['Titre']}), inpTitle);
          sec.append(rowTitle);
    
          // Date (header) — conserve l'incomplet
          const rowDate = el('div', { class:'kv' });
          const rawDate =
            (App?.util?.getRawHeader && App.state?.currentAnalyse
              ? (App.util.getRawHeader(App.state.currentAnalyse, 'headerDate') || '')
              : '') || (App.state?.currentAnalyse?.date || '');
    
          const inpDate = el('input', {
            id:'hdr_date',
            type:'text',
            inputmode:'numeric',
            placeholder:'YYYY-MM-DD',
            value: rawDate,
            'aria-label':'Date du projet'
          });
          const hint = el('div', { class:'muted', style:'margin-top:2px' }, { children:[''] });
    
          async function syncHeaderDate(val){
            const project = App?.state?.currentAnalyse;
            if (!project) return;
            if (App.util?.setRawHeader) App.util.setRawHeader(project, 'headerDate', val);
            const ok = App.util.parseDateStrict(val);
            project.date = ok || '';
            hint.textContent = ok ? '' : (val ? 'Format attendu : YYYY-MM-DD' : '');
            inpDate.classList.toggle('invalid', !ok && !!val);
            await afterPersist();
          }
          inpDate.addEventListener('input', e => { syncHeaderDate(e.target.value); });
          setTimeout(() => { if (App?.state?.currentAnalyse) syncHeaderDate(rawDate); }, 0);
    
          rowDate.append(
            el('label', { for:'hdr_date' }, { children:['Date'] }),
            el('div', {}, { children:[inpDate, hint] })
          );
          sec.append(rowDate);
    
          host.append(sec);
        }
    
        // ===== Helpers de filtrage "manquants seulement" =====
        function isMissingValue(f, v){
          if (App.util?.isFilled) return !App.util.isFilled(f, v);
          if (f?.type === 'checkbox') return !(v === true || v === false);
          if (f?.type === 'date')     return !App.util?.parseDateStrict?.(v);
          if (f?.type === 'file'){
            if (Array.isArray(v)) return v.length === 0;
            if (v && typeof v === 'object') return !v.name && !v.url && !v.path;
            return !v;
          }
          if (Array.isArray(v)) return v.length === 0;
          return v === '' || v == null;
        }
        function groupOccHasMissing(entryGroup, obj){
          return (entryGroup.fields||[]).some(sf=>{
            if (!sf) return false;
            if (sf.repeatable){
              const arr = Array.isArray(obj?.[sf.name]) ? obj[sf.name] : [];
              return arr.some(v => isMissingValue(sf, v));
            }
            return isMissingValue(sf, obj?.[sf.name]);
          });
        }
        function blockHasMissing(section, item){
          return (section.fields||[]).some(entry=>{
            if (entry && entry.group && Array.isArray(entry.fields)){
              const g = entry.group;
              if (g.repeatable){
                const GKEY = `__grp__${g.name}`;
                const arr = Array.isArray(item?.[GKEY]) ? item[GKEY] : [];
                return arr.some(obj => groupOccHasMissing(entry, obj));
              }
              return groupOccHasMissing(entry, item);
            }
            if (!entry) return false;
            if (entry.repeatable){
              const arr = Array.isArray(item?.[entry.name]) ? item[entry.name] : [];
              return arr.some(v => isMissingValue(entry, v));
            }
            return isMissingValue(entry, item?.[entry.name]);
          });
        }
    
        // ========= Rendu d'UNE SECTION (mode pager mono/multi) =========
        function renderOneSection(targetHost, section, sidx){
          const sectionKey = App?.model?.sectionKeyOf ? App.model.sectionKeyOf(section, sidx) : `section-${sidx+1}`;
          const sectionNode = el('div', { class:'section', 'aria-labelledby':`sec-${sidx}` });
          sectionNode.append(el('h3', { id:`sec-${sidx}` }, { children:[ section?.title || `Section ${sidx+1}` ] }));
    
          // Section répétable
          if (section?.repeatable) {
            const data = (App.state.currentAnalyse.data ||= {});
            const items = (Array.isArray(data[sectionKey]) ? data[sectionKey] : (data[sectionKey] = []));
    
            const renderBlock = (i) => {
              const item = items[i] || (items[i] = {});
              if (App.util?.showMissingOnly && !blockHasMissing(section, item)) return null;
    
              const outer = el('div', { class:'repeatable-item' });
              const inner = el('div', { class:'input-wrap' });
    
              const tag = el('div', { class:'mini-tags' });
              const btnDup = el('button', { class:'mini-btn', type:'button' }, { children:['⧉'] });
              const btnDel = el('button', { class:'mini-btn', type:'button' }, { children:['✕'] });
              tag.append(btnDup, btnDel);
    
              btnDup.addEventListener('click', async ()=>{
                items.splice(i+1, 0, structuredClone(item));
                await persist(); App.form?.renderForm?.();
              });
              btnDel.addEventListener('click', async ()=>{
                if (!confirm("Voulez-vous vraiment supprimer cet élément ?")) return;
                items.splice(i, 1);
                await persist(); App.form?.renderForm?.();
              });
    
              (section.fields||[]).forEach(f=>{
                // groupe
                if (f && f.group && Array.isArray(f.fields)) {
                  const g = f.group;
    
                  if (g.repeatable) {
                    const GKEY = `__grp__${g.name}`;
                    if (!Array.isArray(item[GKEY])) item[GKEY] = [];
    
                    const row  = el('div', { class:'kv' });
                    const lab  = el('label', {}, { children:[ g.label || g.name ] });
                    const list = el('div', { class:'repeatable' });
    
                    const renderOcc = (j) => {
                      const obj = item[GKEY][j] || (item[GKEY][j] = {});
                      if (App.util?.showMissingOnly && !groupOccHasMissing(f, obj)) return null;
    
                      const cell = el('div', { class:'repeatable-item' });
                      const wrap = el('div', { class:'input-wrap' });
    
                      const tag2 = el('div', { class:'mini-tags' });
                      const dup2 = el('button', { class:'mini-btn', type:'button' }, { children:['⧉'] });
                      const rm2  = el('button', { class:'mini-btn', type:'button' }, { children:['✕'] });
                      tag2.append(dup2, rm2);
    
                      dup2.addEventListener('click', async ()=>{
                        item[GKEY].push(structuredClone(obj));
                        await persist(); App.form?.renderForm?.();
                      });
                      rm2.addEventListener('click', async ()=>{
                        if (!confirm("Voulez-vous vraiment supprimer cet élément ?")) return;
                        item[GKEY].splice(j, 1);
                        await persist(); App.form?.renderForm?.();
                      });
    
                      (f.fields || []).forEach(sf => {
                        if (sf.repeatable) {
                          if (!Array.isArray(obj[sf.name])) obj[sf.name] = [];
                          const all = obj[sf.name];
                          const idxs = App.util?.showMissingOnly
                            ? all.map((v,k)=> isMissingValue(sf,v) ? k : -1).filter(k=>k>=0)
                            : all.map((_,k)=>k);
    
                          if (!idxs.length && App.util?.showMissingOnly) return;
    
                          const list = el('div', { class:'repeatable-items' });
                          const getArr = () => obj[sf.name];
                          const setArr = (a) => { obj[sf.name] = a; };
    
                          const renderRow = buildRenderRow({
                            field: sf, getArr, setArr,
                            idxToRow: () => obj,
                            uidBase: `${sectionKey}__blk${i}__grp_${g.name}__${sf.name}__i${j}`
                          });
    
                          idxs.forEach(k => list.append(renderRow(k)));
    
                          const children = [list];
                          if (!App.util?.showMissingOnly) {
                            const add = el('button', { class:'btn sm adder', type:'button' }, { children:['Ajouter'] });
                            add.addEventListener('click', async ()=>{
                              const a = getArr().slice();
                              a.push(sf.type === 'checkbox' ? false : '');
                              setArr(a);
                              await persist(); App.form?.renderForm?.();
                            });
                            children.push(add);
                          }
    
                          const row = el('div', { class:'kv' }, {
                            children: [
                              el('label', {}, { children:[ sf.label || sf.name ] }),
                              el('div', {}, { children })
                            ]
                          });
                          wrap.append(row);
                          return;
                        }
    
                        const cur = (sf.type === 'date')
                          ? (App.util?.getRawForData ? App.util.getRawForData(obj, sf.name) : (obj[sf.name] ?? ''))
                          : (obj[sf.name] ?? (sf.type === 'checkbox' ? false : ''));
                        if (App.util?.showMissingOnly && !isMissingValue(sf, cur)) return;
    
                        const r = el('div', { class:'kv' });
                        const l = el('label', {}, { children:[ sf.label || sf.name ] });
                        const input = renderInputForField(
                          sf, cur,
                          async v => {
                            if (sf.type === 'date' && App.util?.setRawForData) App.util.setRawForData(obj, sf.name, v);
                            else obj[sf.name] = v;
                            await persist();
                          },
                          null,
                          { row: obj, uid: `${sectionKey}__blk${i}__grp_${g.name}__${sf.name}__i${j}` }
                        );
                        r.append(l, input);
                        attachTip(r, sf);
                        wrap.append(r);
                      });
    
                      cell.append(el('div', { class:'input-wrap' }, { children:[tag2, wrap] }));
                      return cell;
                    };
    
                    item[GKEY].forEach((_, j) => {
                      const n = renderOcc(j);
                      if (n) list.append(n);
                    });
    
                    if (App.util?.showMissingOnly && !list.childElementCount) return;
    
                    const children = [list];
                    if (!App.util?.showMissingOnly) {
                      const addGrp = el('button', { class:'btn sm adder', type:'button' }, { children:['Ajouter'] });
                      addGrp.addEventListener('click', async () => {
                        item[GKEY].push({});
                        await persist();
                        App.form?.renderForm?.();
                      });
                      children.push(addGrp);

                    row.append(lab, el('div', {}, { children }));
    
                    inner.append(row);
                    return;

                  // groupe simple

                  const gWrap  = el('div', { class:'section group-wrap' });
                  let painted = 0;
                  (f.fields||[]).forEach(sf=>{
                    const cur = (sf.type==='date')
                      ? (App.util?.getRawForData ? App.util.getRawForData(item, sf.name) : (item[sf.name] ?? ''))
                      : (item[sf.name] ?? (sf.type==='checkbox'?false:''));
                    if (App.util?.showMissingOnly && !isMissingValue(sf, cur)) return;
                    const r = el('div', { class:'kv' });
                    const l = el('label', {}, { children:[ sf.label || sf.name ] });
                    const input = renderInputForField(
                      sf, cur,
                      async v=>{
                        if (sf.type==='date' && App.util?.setRawForData) App.util.setRawForData(item, sf.name, v);
                        else item[sf.name] = v;
                        await persist();
                      },
                      `${i}`,
                      { row: item, uid: `${sectionKey}__blk${i}__${sf.name}` }
                    );
                    r.append(l, input);
                    attachTip(r, sf);
                    gWrap.append(r);
                    painted++;
                  });
                  if (painted) inner.append(el('div', { class:'kv' }, { children:[ legend, gWrap ] }));
                  return;
                }
    
                // champ répétable (dans bloc)
                if (f?.repeatable){
                  const getArr = () => {
                    const a = Array.isArray(item[f.name]) ? item[f.name] : (item[f.name] = []);
                    return a;
                  };
                  const all = getArr();
                  const idxs = App.util?.showMissingOnly
                    ? all.map((v,k)=> isMissingValue(f,v) ? k : -1).filter(k=>k>=0)
                    : all.map((_,k)=>k);
    
                  if (!idxs.length && App.util?.showMissingOnly) return;
    
                  const list = el('div', { class:'repeatable-items' });
                  const setArr = (a)=>{ item[f.name] = a; };
                  const renderRow = buildRenderRow({
                    field: f, getArr, setArr,
                    idxToRow: ()=> item,
                    uidBase: `${sectionKey}__blk${i}__${f.name}`
                  });
    
                  idxs.forEach(k => list.append(renderRow(k)));
    
                  const children = [list];
                  if (!App.util?.showMissingOnly) {
                    const add = el('button', { class:'btn sm adder', type:'button' }, { children:['Ajouter'] });
                    add.addEventListener('click', async ()=>{
                      const a = getArr().slice();
                      a.push(f.type==='checkbox' ? false : '');
                      setArr(a);
                      await persist(); App.form?.renderForm?.();
                    });
                    children.push(add);
                  }
    
                  inner.append(el('div', { class:'kv' }, {
                    children:[ el('label',{}, {children:[ f.label || f.name ]}), el('div',{}, {children}) ]
                  }));

                }
    
                // champ simple (dans bloc)
                const cur = (f.type==='date')
                  ? (App.util?.getRawForData ? App.util.getRawForData(item, f.name) : (item[f.name] ?? ''))
                  : (item[f.name] ?? (f.type==='checkbox'?false:''));
                if (App.util?.showMissingOnly && !isMissingValue(f, cur)) return;
    
                const r = el('div', { class:'kv' });
                const l = el('label', {}, { children:[ f.label || f.name ] });
                const input = renderInputForField(
                  f, cur,
                  async v=>{

                    else item[f.name] = v;

                  `${i}`,
                  { row: item, uid:`${sectionKey}__blk${i}__${f.name}` }
