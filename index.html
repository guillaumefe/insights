<script>
(function () {
  const app  = document.getElementById('app');
  const left = document.getElementById('leftPane');
  const right= document.getElementById('rightPane');
  const bar  = document.getElementById('dragbar');
  if (!app || !left || !right || !bar) return;

  const LEFT_GUARD   = 25;
  const RIGHT_GUARD  = 145;
  const DEFAULT_LEFT = 420;  // largeur par défaut du panneau gauche
  const bp = window.matchMedia('(max-width:900px)');

  // === Bornes issues du CSS + environnement ===
  const stylesApp  = getComputedStyle(app);
  const gapPx      = parseInt(stylesApp.columnGap || stylesApp.gap || '0', 10) || 0;
  const barW       = Math.round(bar.getBoundingClientRect().width) || 8;

  const minLeftCSS  = parseInt(getComputedStyle(left).minWidth, 10)  || 320;
  const minRightCSS = parseInt(getComputedStyle(right).minWidth, 10) || 420;

  const LEFT_MIN  = minLeftCSS  + LEFT_GUARD;
  const RIGHT_MIN = minRightCSS + RIGHT_GUARD;

  function hardMax() {
    const box = app.getBoundingClientRect();
    // largeur max autorisée pour le panneau gauche = largeur totale - ce qu'on doit garder à droite - barre - gap
    return box.width - RIGHT_MIN - barW - gapPx;
  }
  function clampWidth(px){
    return Math.max(LEFT_MIN, Math.min(px, hardMax()));
  }

  // Init (desktop) : on clamp directement la valeur restaurée
  const saved = +localStorage.getItem('split-left') || 0;
  if (!bp.matches) {
    const init = clampWidth(saved || DEFAULT_LEFT);
    left.style.flexBasis = init + 'px';
    document.documentElement.style.setProperty('--left', init + 'px');
  }

  let dragging = false;

  function clampClientX(clientX){
    const box  = app.getBoundingClientRect();
    const relX = clientX - box.left;
    return clampWidth(relX);
  }

  function start(e){
    if (bp.matches) return;
    dragging = true;
    document.body.classList.add('is-dragging');
    if (e.pointerId && bar.setPointerCapture) { try { bar.setPointerCapture(e.pointerId); } catch(_){} }
    e.preventDefault();
  }
  function move(e){
    if (!dragging || bp.matches) return;
    const clientX = e.clientX || (e.touches && e.touches[0]?.clientX) || 0;
    const x = clampClientX(clientX);
    left.style.flexBasis = x + 'px';
    document.documentElement.style.setProperty('--left', x + 'px');
  }
  function end(e){
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('is-dragging');
    if (e?.pointerId && bar.releasePointerCapture) { try { bar.releasePointerCapture(e.pointerId); } catch(_){} }
    const cur = parseInt(getComputedStyle(left).flexBasis, 10) || 0;
    if (!bp.matches && cur) localStorage.setItem('split-left', String(clampWidth(cur)));
  }

  // Events (pointer + fallback souris)
  bar.addEventListener('pointerdown', start);
  window.addEventListener('pointermove',  move);
  window.addEventListener('pointerup',    end);
  window.addEventListener('pointercancel',end);
  bar.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup',   end);

  // Double-clic : reset (clampe aussi)
  bar.addEventListener('dblclick', ()=>{
    const v = clampWidth(DEFAULT_LEFT);
    left.style.flexBasis = v + 'px';
    document.documentElement.style.setProperty('--left', v + 'px');
    localStorage.setItem('split-left', String(v));
  });

  // Breakpoint + resize : recalcule les bornes
  const applyDesktop = () => {
    const s = +localStorage.getItem('split-left') || DEFAULT_LEFT;
    const v = clampWidth(s);
    left.style.flexBasis = v + 'px';
    document.documentElement.style.setProperty('--left', v + 'px');
  };
  bp.addEventListener('change', () => bp.matches ? (left.style.flexBasis = '') : applyDesktop());
  window.addEventListener('resize', () => { if (!bp.matches) applyDesktop(); });

})();
</script>

<script>
/* =============== Polyfills/ponyfills sûrs (non-énumérables) =============== */
(() => {
  const def = (proto, name, fn) => {
    if (!(name in proto)) {
      Object.defineProperty(proto, name, {
        value: fn, writable: true, configurable: true, enumerable: false
      });
    }
  };

  // String.prototype.replaceAll (spec-like)
  def(String.prototype, 'replaceAll', function (search, replacement) {
    const str = String(this);
    if (search instanceof RegExp) {
      if (!search.global) throw new TypeError('replaceAll RegExp exige /g');
      return str.replace(search, replacement);
    }
    const needle = String(search);
    if (needle === '') {
      const chars = Array.from(str);
      return [replacement, ...chars.map(c => c + replacement)].join('');
    }
    let out = '', i = 0;
    for (;;) {
      const j = str.indexOf(needle, i);
      if (j === -1) { out += str.slice(i); break; }
      out += str.slice(i, j) + replacement;
      i = j + needle.length;
    }
    return out;
  });

  // Array.prototype.flatMap
  def(Array.prototype, 'flatMap', function (mapFn, thisArg) {
    const arr = Object(this), len = arr.length >>> 0, out = [];
    for (let i = 0; i < len; i++) if (i in arr) {
      const v = mapFn.call(thisArg, arr[i], i, arr);
      Array.isArray(v) ? out.push(...v) : out.push(v);
    }
    return out;
  });

  // String.prototype.normalize : best-effort si absent
  if (typeof ''.normalize !== 'function') {
    def(String.prototype, 'normalize', function (form) {
      // Fallback : supprime diacritiques combinantes (pas un vrai normalize)
      return String(this).replace(/[\u0300-\u036f]/g, '');
    });
  }

  // TextEncoder/TextDecoder ponyfills (safe)
  if (!('TextEncoder' in globalThis)) {
    class TE {
      encode(str) {
        const out = [];
        for (const ch of String(str)) {
          const cp = ch.codePointAt(0);
          if (cp <= 0x7F) out.push(cp);
          else if (cp <= 0x7FF) out.push(0xC0 | (cp >> 6), 0x80 | (cp & 0x3F));
          else if (cp <= 0xFFFF) out.push(0xE0 | (cp >> 12), 0x80 | ((cp >> 6) & 0x3F), 0x80 | (cp & 0x3F));
          else out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3F), 0x80 | ((cp >> 6) & 0x3F), 0x80 | (cp & 0x3F));
        }
        return new Uint8Array(out);
      }
    }
    Object.defineProperty(globalThis, 'TextEncoder', { value: TE, configurable: true, writable: true });
  }
  if (!('TextDecoder' in globalThis)) {
    class TD {
      decode(u8) {
        u8 = u8 || new Uint8Array();
        let i = 0, s = '';
        while (i < u8.length) {
          const a = u8[i++];
          if (a < 0x80) { s += String.fromCodePoint(a); continue; }
          const b = u8[i++] & 0x3F;
          if ((a & 0xE0) === 0xC0) s += String.fromCodePoint(((a & 0x1F) << 6) | b);
          else if ((a & 0xF0) === 0xE0) { const c = u8[i++] & 0x3F; s += String.fromCodePoint(((a & 0x0F) << 12) | (b << 6) | c); }
          else { const c = u8[i++] & 0x3F, d = u8[i++] & 0x3F; s += String.fromCodePoint(((a & 0x07) << 18) | (b << 12) | (c << 6) | d); }
        }
        return s;
      }
    }
    Object.defineProperty(globalThis, 'TextDecoder', { value: TD, configurable: true, writable: true });
  }

})();

/* =============== Namespace appli =============== */
const App = (globalThis.App = globalThis.App || {});

/* =============== Compat & modes dégradés =============== */
App.compat = {
  noIDB: !('indexedDB' in globalThis) || !globalThis.indexedDB,
  noSubtle: !('crypto' in globalThis) || !globalThis.crypto || !globalThis.crypto.subtle,
  unsafeMode: false
};

/* Mode non chiffré si WebCrypto indisponible */
if (App.compat.noSubtle) {
  console.warn('[compat] WebCrypto indisponible → mode non sécurisé (données non chiffrées).');
  App.compat.unsafeMode = true;

  App.crypto = App.crypto || {};
  App.crypto.deriveKeyFromPassword = async () => ({ __plain__: true });
  App.crypto.aesEncryptJson = async (_key, obj) => ({ v: 0, plain: obj });
  App.crypto.aesDecryptJson = async (_key, rec) => {
    if (!rec) throw new Error('Enregistrement vide');
    if (rec.v === 0 && rec.plain) return rec.plain;
    throw new Error('Format incompatible avec le mode non chiffré');
  };

  try { App.ui?.showToast?.('Attention : chiffrement indisponible (mode non sécurisé).', 4000, 'error'); } catch {}
}

/* =============== Stockage : fallback localStorage / IndexedDB =============== */
(() => {
  const DB_VERSION = 8;
  const DB_NAME = 'projetsDB';
  App.storage = App.storage || {};
  App.storage.DB_VERSION = DB_VERSION;

  /* ---- Fallback localStorage (non-transactionnel) ---- */
  if (App.compat.noIDB) {
    console.warn('[compat] IndexedDB indisponible → fallback localStorage (non transactionnel).');

    const LS_KEY = 'projets_local_store_v1';
    const safeParse = (s) => { try { return JSON.parse(s); } catch { return null; } };
    const snap = () => safeParse(localStorage.getItem(LS_KEY)) || { projets: [], ui: {} };
    const save = (obj) => { try { localStorage.setItem(LS_KEY, JSON.stringify(obj)); } catch (e) { console.error('localStorage save', e); } };

    let _db = { projets: [], ui: {} };
    const ensure = () => { _db = snap(); };

    const tx = (name, _mode = 'readonly') => {
      ensure();
      return {
        put(v) { return { onsuccess: null, onerror: null, _exec() {
          try {
            if (name === 'projets') {
              if (v && v.id != null) {
                const i = _db.projets.findIndex(x => x.id === v.id);
                if (i >= 0) _db.projets[i] = v; else _db.projets.push(v);
              } else {
                v.id = (_db.projets.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1);
                _db.projets.push(v);
              }
            } else if (name === 'ui') {
              _db.ui[v.id] = v;
            }
            save(_db);
            this.onsuccess && this.onsuccess({ target: { result: v.id } });
          } catch (e) { this.onerror && this.onerror(e); }
        }};},
        get(id) { return { onsuccess: null, onerror: null, _exec() {
          try {
            let res = null;
            if (name === 'projets') res = _db.projets.find(x => x.id === id) || null;
            else if (name === 'ui') res = _db.ui[id] || null;
            this.onsuccess && this.onsuccess({ target: { result: res } });
          } catch (e) { this.onerror && this.onerror(e); }
        }};},
        getAll() { return { onsuccess: null, onerror: null, _exec() {
          try {
            const res = (name === 'projets') ? _db.projets.slice() : Object.values(_db.ui || {});
            this.onsuccess && this.onsuccess({ target: { result: res } });
          } catch (e) { this.onerror && this.onerror(e); }
        }};},
        delete(id) { return { onsuccess: null, onerror: null, _exec() {
          try {
            if (name === 'projets') _db.projets = _db.projets.filter(x => x.id !== id);
            else if (name === 'ui') delete _db.ui[id];
            save(_db);
            this.onsuccess && this.onsuccess({ target: { result: true } });
          } catch (e) { this.onerror && this.onerror(e); }
        }};},
        clear() { return { onsuccess: null, onerror: null, _exec() {
          try {
            if (name === 'projets') _db.projets = [];
            else if (name === 'ui') _db.ui = {};
            save(_db);
            this.onsuccess && this.onsuccess({ target: { result: true } });
          } catch (e) { this.onerror && this.onerror(e); }
        }};}
      };
    };

    const wrap = r => (r && typeof r._exec === 'function' ? (setTimeout(() => r._exec(), 0), r) : r);
    const proxiedTx = (name, mode) => new Proxy(tx(name, mode), {
      get(target, prop) { const v = target[prop]; return (typeof v === 'function') ? (...a) => wrap(v.apply(target, a)) : v; }
    });

    App.storage.openDB = () => { _db = snap(); return Promise.resolve({ result: { close() {} } }); };
    App.storage.tx = proxiedTx;
    App.storage.put = (store, value) => new Promise((res, rej) => { const r = App.storage.tx(store, 'readwrite').put(value); r.onsuccess = ev => res(ev.target.result); r.onerror = rej; });
    App.storage.get = (store, id)     => new Promise((res, rej) => { const r = App.storage.tx(store).get(id);         r.onsuccess = ev => res(ev.target.result); r.onerror = rej; });
    App.storage.all = (store)         => new Promise((res, rej) => { const r = App.storage.tx(store).getAll();       r.onsuccess = ev => res(ev.target.result); r.onerror = rej; });
    App.storage.del = (store, id)     => new Promise((res, rej) => { const r = App.storage.tx(store, 'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = rej; });

    App._ready = App._ready || {}; App._ready.storage = true;
    return; // fin fallback localStorage
  }

  /* ---- IndexedDB natif (avec ensureDB) ---- */
  let db = null;

  App.storage.openDB = function () {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, App.storage.DB_VERSION);

      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('projets')) {
          const st = d.createObjectStore('projets', { keyPath: 'id', autoIncrement: true });
          st.createIndex('by_created', 'created');
        }
        if (!d.objectStoreNames.contains('ui')) d.createObjectStore('ui', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('fsHandles')) d.createObjectStore('fsHandles', { keyPath: 'projectId' });
      };

      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  };

  App.storage.ensureDB = async function () {
    if (db) return db;
    return (db = await App.storage.openDB());
  };

  App.storage.tx = function (name, mode = 'readonly') {
    if (!db) throw new Error('IndexedDB non initialisée : appelez ensureDB() avant.');
    return db.transaction(name, mode).objectStore(name);
  };

  App.storage.put = async (store, value) => {
    await App.storage.ensureDB();
    return new Promise((res, rej) => {
      const r = App.storage.tx(store, 'readwrite').put(value);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  };
  App.storage.get = async (store, id) => {
    await App.storage.ensureDB();
    return new Promise((res, rej) => {
      const r = App.storage.tx(store).get(id);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  };
  App.storage.all = async (store) => {
    await App.storage.ensureDB();
    return new Promise((res, rej) => {
      const r = App.storage.tx(store).getAll();
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  };
  App.storage.del = async (store, id) => {
    await App.storage.ensureDB();
    return new Promise((res, rej) => {
      const r = App.storage.tx(store, 'readwrite').delete(id);
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  };

  App._ready = App._ready || {};
  App._ready.storage = true;
})();
</script>

<script>
(() => {
  /* =========================
     Crypto & stockage chiffré
     ========================= */

  // -------- Base64 utilitaires (URL-safe, chunks, padding) --------
  const b64e = (u8) => {
    const arr = (u8 instanceof Uint8Array) ? u8 : new Uint8Array(u8 || []);
    const CHUNK = 0x8000;
    let s = '';
    for (let i = 0; i < arr.length; i += CHUNK) {
      s += String.fromCharCode.apply(null, arr.subarray(i, i + CHUNK));
    }
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
  };

  const b64d = (s) => {
    let clean = String(s || '').replace(/[\s\r\n]+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    const mod = clean.length % 4;
    if (mod) clean += '='.repeat(4 - mod);
    const bin = atob(clean);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };

  // -------- Clé courante (stock interne) --------
  let currentKey = null;

  // -------- Salt global & itérations PBKDF2 --------
  async function getOrCreateSalt() {
    let s = localStorage.getItem('kdfSalt');
    if (!s) {
      s = b64e(crypto.getRandomValues(new Uint8Array(16)));
      localStorage.setItem('kdfSalt', s);
    }
    return b64d(s);
  }

  async function calibratePBKDF2(targetMs = 250) {
    const cached = localStorage.getItem('pbkdf2Iters');
    if (cached) return parseInt(cached, 10);

    const salt = crypto.getRandomValues(new Uint8Array(16));
    const pass = new TextEncoder().encode('calib');
    const baseKey = await crypto.subtle.importKey('raw', pass, 'PBKDF2', false, ['deriveBits']);
    const probe = 50000;
    const t0 = performance.now();
    await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: probe, hash: 'SHA-256' }, baseKey, 256);
    const dt = Math.max(performance.now() - t0, 1);
    let iters = Math.round(probe * (targetMs / dt));
    iters = Math.max(30000, Math.min(iters, 600000));
    localStorage.setItem('pbkdf2Iters', String(iters));
    return iters;
  }

  // -------- Primitives crypto --------
  let deriveKeyFromPassword = null;
  let aesEncryptJson = null;
  let aesDecryptJson = null;

  const subtleOK = !(App.compat && App.compat.noSubtle);

  if (subtleOK) {
    deriveKeyFromPassword = async function (password) {
      const salt = await getOrCreateSalt();
      const iters = await calibratePBKDF2(250);
      const baseKey = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(password),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: iters, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    };

    aesEncryptJson = async function (key, obj) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const pt = new TextEncoder().encode(JSON.stringify(obj));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, pt));
      return { v: 1, iv: b64e(iv), ct: b64e(ct) };
    };

    aesDecryptJson = async function (key, rec) {
      if (!rec || rec.v !== 1) throw new Error('Format inattendu');
      const iv = b64d(rec.iv), ct = b64d(rec.ct);
      if (iv.byteLength !== 12) throw new Error('IV invalide (12 octets requis)');
      try {
        const pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
        return JSON.parse(new TextDecoder().decode(pt));
      } catch (e) {
        if (e && (e.name === 'OperationError' || e.name === 'DOMException')) {
          throw new Error('Déchiffrement impossible (mot de passe, salt/iters ou données corrompues)');
        }
        throw e;
      }
    };
  } else {
    deriveKeyFromPassword = App.crypto?.deriveKeyFromPassword || (async () => ({ __plain__: true }));
    aesEncryptJson = App.crypto?.aesEncryptJson || (async (_k, obj) => ({ v: 0, plain: obj }));
    aesDecryptJson = App.crypto?.aesDecryptJson || (async (_k, rec) => (rec?.plain ?? null));
  }

  // -------- Wrappers IDB --------
  const ensure = async () => (App.storage && App.storage.ensureDB) ? App.storage.ensureDB() : null;

  const putRaw = async (store, value) => {
    await ensure();
    return new Promise((res, rej) => {
      const r = App.storage.tx(store, 'readwrite').put(value);
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
  };

  const getRaw = async (store, id) => {
    await ensure();
    return new Promise((res, rej) => {
      const r = App.storage.tx(store).get(id);
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
  };

  const allRaw = async (store) => {
    await ensure();
    return new Promise((res, rej) => {
      const r = App.storage.tx(store).getAll();
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
  };

  const clearStore = async (store) => {
    await ensure();
    return new Promise((res, rej) => {
      const r = App.storage.tx(store, 'readwrite').clear();
      r.onsuccess = () => res();
      r.onerror   = () => rej(r.error);
    });
  };

  // -------- File System Access handles --------
  async function setFsHandle(projectId, handle) { return putRaw('fsHandles', { projectId, handle }); }
  async function getFsHandle(projectId) { const row = await getRaw('fsHandles', projectId); return row?.handle ?? null; }
  async function clearFsHandle(projectId) { try { await App.storage.del('fsHandles', projectId); } catch {} }

  // -------- Stockage chiffré --------
  function isUnlocked() {
    return !!currentKey || (App.compat && App.compat.unsafeMode);
  }

  async function putEncryptedAnalyse(obj) {
    if (!isUnlocked()) throw new Error('Verrouillé');
    const { id, refParent, ...payload } = obj;
    const envelope = await aesEncryptJson(currentKey, payload);
    const rec = { _enc: envelope };
    if (id != null) rec.id = id;
    return putRaw('projets', rec);
  }

  async function getEncryptedAnalyse(id) {
    if (!isUnlocked()) return null;
    const row = await getRaw('projets', id);
    if (!row) return null;
    try {
      const dec = await aesDecryptJson(currentKey, row._enc);
      const obj = { id: row.id, ...dec };
      const h = await getFsHandle(row.id);
      if (h) obj.refParent = h;
      return obj;
    } catch (e) {
      console.error('[decrypt item]', e);
      alert('Impossible d’ouvrir ce projet : mot de passe invalide ou données corrompues.');
      return null;
    }
  }

  async function allEncryptedAnalyses() {
    if (!isUnlocked()) return [];
    const rows = await allRaw('projets');
    const out = [];
    for (const r of rows) {
      try { out.push({ id: r.id, ...(await aesDecryptJson(currentKey, r._enc)) }); }
      catch (_) { /* ignore */ }
    }
    return out;
  }

  async function hardResetVault() {
    if (!confirm(
      "⚠️ Réinitialisation totale.\n\n" +
      "• Toutes les projets chiffrées seront supprimées.\n" +
      "• Le sel/paramètres KDF seront réinitialisés.\n" +
      "• Cette opération est irréversible.\n\n" +
      "Souhaitez-vous continuer ?"
    )) return;

    try { await clearStore('projets'); } catch(_) {}
    try { await clearStore('ui'); } catch(_) {}
    try { await clearStore('fsHandles'); } catch(_) {}

    localStorage.removeItem('kdfSalt');
    localStorage.removeItem('pbkdf2Iters');

    App.crypto.currentKey = null;

    try {
      await App.uiList.refreshList();
      App.uiList.closeDetail?.();
      App.uiList.showToast?.('Réinitialisation effectuée.', 2500, 'success');
    } catch(_) {}
  }

  // -------- Migration (plaintext -> chiffré) + sentinel si absent --------
  async function migrateIfNeeded() {
    if (!isUnlocked()) return;

    try { await migrateOldSentinel(); } catch {}

    const rows = await allRaw('projets');
    let changed = false;
    for (const r of rows) {
      if (!r._enc) {
        const { id, ...payload } = r;
        const envelope = await aesEncryptJson(currentKey, payload);
        await putRaw('projets', { id, _enc: envelope });
        changed = true;
      }
    }
    if (changed) console.info('Migration IndexedDB → chiffré : OK');

    // pose seulement si absent
    try { await ensureVaultSentinel(currentKey, false); } catch {}
  }

  // -------- Export / Import bundle --------
  async function exportEncryptedBundle() {
    const rows = await allRaw('projets');

    const bundle = {
      format: 'projets-bundle',
      version: (App.storage && 'DB_VERSION' in App.storage) ? App.storage.DB_VERSION : null,
      exportedAt: Date.now(),
      kdfSalt: localStorage.getItem('kdfSalt') || null,
      pbkdf2Iters: localStorage.getItem('pbkdf2Iters') || null,
      rows
    };

    const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
    const fileName = App.helpers.makeTimestampedFilename('projets_bundle', 'bundle.json');

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(a.href);
    a.remove();

    App.uiList?.showToast?.('Bundle exporté.', 2000, 'success');
  }

async function importEncryptedBundleFromFile(file) {
  if (!confirm('Importer ce bundle et remplacer toutes les projets existantes ?')) return;
  try {
    const text = await file.text();
    const bundle = JSON.parse(text);
    if (bundle?.format !== 'projets-bundle' || !Array.isArray(bundle.rows)) {
      alert('Fichier de bundle invalide.');
      return;
    }

    // paramètres KDF
    if (bundle.kdfSalt)     localStorage.setItem('kdfSalt', bundle.kdfSalt);
    if (bundle.pbkdf2Iters) localStorage.setItem('pbkdf2Iters', bundle.pbkdf2Iters);

    // remplace les données
    await clearStore('projets');
    for (const row of bundle.rows) {
      if (row && row._enc && row.id != null) await putRaw('projets', row);
    }

    // supprime tout sentinel (sera re-créé au prochain déverrouillage)
    try { await App.storage.del('ui', 'vaultSentinel'); } catch {}
    try { await App.storage.del('ui', 'vault_sentinel'); } catch {}

    // on re-verrouille explicitement puis on utilise le VRAI flux d’unlock
    App.crypto.currentKey = null;
    App.lock?.setLocked?.(true);
    App.lock?.updateUI?.();

    // déverrouillage + refresh list (déjà prévu dans unlockFlow)
    await App.lock?.unlockFlow?.();      // ← modale mdp + pose de la clé + refresh
    await App.uiList?.refreshList?.();   // ← ceinture & bretelles (réaffiche tout de suite)
    App.uiList?.closeDetail?.();
    App.uiList?.showToast?.('Bundle importé avec succès.', 2000, 'success');

  } catch (e) {
    alert('Échec de l’import du bundle : ' + (e?.message || e));
  }
}

  // -------- Changement de mot de passe --------
  function setNewKdfSaltAndIters() {
    const newSalt = b64e(crypto.getRandomValues(new Uint8Array(16)));
    localStorage.setItem('kdfSalt', newSalt);
    localStorage.removeItem('pbkdf2Iters');
  }

  async function deriveKeyForPasswordNow(pass) {
    const salt = await getOrCreateSalt();
    const iters = await calibratePBKDF2(250);
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: iters, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function changePasswordFlow() {
    if (App.compat?.unsafeMode) {
      App.uiList?.showToast?.('Changement de mot de passe indisponible : chiffrement non supporté sur ce navigateur.', 5000, 'warning');
      return;
    }

    const res = await App.uiList?.openPasswordDialog?.({ mode: 'change' });
    if (!res) return;
    const { current, next } = res;
    if (!current || !next) {
      App.uiList?.showToast?.('Veuillez saisir le mot de passe actuel et le nouveau.', 3500, 'error');
      return;
    }

    // vérif ancien mdp
    const ok = await verifyPasswordWithSentinel(current);
    if (!ok) {
      App.uiList?.showToast?.('Mot de passe invalide.', 3500, 'error');
      return;
    }

    // déchiffrage complet avec l’ancienne clé
    const rows = await allRaw('projets');
    const oldKey = await deriveKeyForPasswordNow(current);
    const plain = [];
    let failed = 0;
    for (const r of rows) {
      try {
        const dec = await aesDecryptJson(oldKey, r._enc);
        plain.push({ id: r.id, payload: dec });
      } catch { failed++; }
    }
    if (failed) {
      const cont = confirm(`⚠️ ${failed} enregistrement(s) illisible(s). Continuer quand même ?`);
      if (!cont) return;
    }

    // nouveaux paramètres KDF + dérive nouvelle clé
    setNewKdfSaltAndIters();
    const newKey = await deriveKeyForPasswordNow(next);

    // ré-encryptage
    for (const { id, payload } of plain) {
      const envelope = await aesEncryptJson(newKey, payload);
      await putRaw('projets', { id, _enc: envelope });
    }

    // nouvelle clé courante + sentinel écrasé
    currentKey = newKey;
    await ensureVaultSentinel(newKey, true); // overwrite=TRUE pour éviter un sentinel « ancien »

    // nettoyage format legacy
    try { await App.storage.del('ui','vault_sentinel'); } catch {}

    App.uiList?.showToast?.('Mot de passe changé et données ré-encryptées.', 2000, 'success');
    await App.uiList?.refreshList?.();
    await App.uiList?.closeDetail?.();
  }

  // --- Sentinel
  async function ensureVaultSentinel(key, overwrite = false){
    if (App.compat?.unsafeMode) return;
    try { await migrateOldSentinel(); } catch {}

    const rec = await getRaw('ui','vaultSentinel'); // { id:'vaultSentinel', value:<envelope> }
    if (!overwrite && rec && rec.value) return;

    const payload  = { t:'sentinel', nonce: Math.random().toString(36).slice(2) };
    const envelope = await aesEncryptJson(key, payload);
    await putRaw('ui', { id:'vaultSentinel', value: envelope });
  }

  async function migrateOldSentinel(){
    try {
      const recNew = await getRaw('ui', 'vaultSentinel');
      if (recNew && recNew.value) return;

      const recOld = await getRaw('ui', 'vault_sentinel');
      if (recOld && recOld._enc) {
        await putRaw('ui', { id: 'vaultSentinel', value: recOld._enc });
        try { await App.storage.del('ui', 'vault_sentinel'); } catch {}
      }
    } catch {}
  }

  async function verifyPasswordWithSentinel(pass){
    if (App.compat?.unsafeMode) return false;

    try { await migrateOldSentinel(); } catch {}

    const key = await deriveKeyForPasswordNow(pass);

    const recNew = await getRaw('ui', 'vaultSentinel');
    if (recNew && recNew.value) {
      try {
        const dec = await aesDecryptJson(key, recNew.value);
        return !!(dec && dec.t === 'sentinel');
      } catch { /* continue */ }
    }

    const recOld = await getRaw('ui', 'vault_sentinel');
    if (recOld && recOld._enc) {
      try {
        const dec = await aesDecryptJson(key, recOld._enc);
        return !!(dec && dec.t === 'sentinel');
      } catch { /* continue */ }
    }

    try {
      const rows = await allRaw('projets');
      if (Array.isArray(rows) && rows.length > 0) {
        await aesDecryptJson(key, rows[0]._enc);
        return true;
      }
    } catch {}

    return false;
  }

  // -------- Exposition App.* --------
  App.crypto = {
    get currentKey() { return currentKey; },
    set currentKey(k) { currentKey = k; },
    deriveKeyFromPassword,
    aesEncryptJson,
    aesDecryptJson
  };
  App.secStore = {
    putEncryptedAnalyse,
    getEncryptedAnalyse,
    allEncryptedAnalyses,
    migrateIfNeeded,
    exportEncryptedBundle,
    importEncryptedBundleFromFile,
    changePasswordFlow,
    setFsHandle, getFsHandle, clearFsHandle,
    hardResetVault,
    ensureVaultSentinel,
    verifyPasswordWithSentinel
  };

  App._ready = App._ready || {};
  App._ready.crypto = true;
})();
</script>


<script>
(() => {
  /* =========================
     TEMPLATE & VALIDATION
     ========================= */
  const DEFAULT_TEMPLATE = [
    {
      title: "Informations générales",
      fields: [
        { name:"toto1", repeatable:true,  label:"Secret?",            type:"radio",   options:["Oui","Non"], required:true },
        { name:"toto2", repeatable:true,  label:"Date de la réunion", type:"date",    required:true },
        { name:"filou", repeatable:true,  label:"Filou",              type:"file" }
      ]
    },
    {
      title: "Autres informations utiles",
      fields: [
        { name:"tutu1", repeatable:true,  label:"Objectifs", type:"textarea" },
        { name:"tutu2", repeatable:true,  label:"Type",      type:"file" }
      ]
    }
  ];

  let PROCESSES = null; // null = mode ancien (mono-processus). Sinon: [{ name, sections:[...] }, ...]

  function isSectionsArray(x){
    return Array.isArray(x) && x.every(s => s && typeof s === 'object' && (('title' in s) || ('key' in s)));
  }
  function isProcessesArray(x){
    return Array.isArray(x) && x.every(p =>
      p && typeof p === 'object' && typeof p.name === 'string' && isSectionsArray(p.sections)
    );
  }

  // ------ Deep clone helper (fallback universel) ------
  function deepClone(obj) {
    if (obj === null || typeof obj !== 'object') return obj;
    if (obj instanceof Date) return new Date(obj);
    if (Array.isArray(obj)) return obj.map(deepClone);
    const clone = {};
    for (const key in obj) clone[key] = deepClone(obj[key]);
    return clone;
  }

  // Copie indépendante du template courant (évite les fuites de références)
  let TEMPLATE = deepClone(DEFAULT_TEMPLATE);

  // Liste plate (utilisée par la recherche, etc.)
  let TEMPLATE_FIELD_DEFS = TEMPLATE.flatMap(sec =>
    (sec.fields || []).flatMap(f =>
      (f && f.group && Array.isArray(f.fields))
        ? f.fields.map(sf => ({ ...sf, __group: f.group })) // garde le parent
        : [f]
    )
  );

  function validateField(fd, secIndex, fldIndex){
    // --- Cas "groupe de champs" ---
    if (fd && typeof fd === 'object' && 'group' in fd) {
      const g = fd.group;
      if (typeof g !== 'object' || g == null) {
        return `section[${secIndex}].fields[${fldIndex}].group doit être un objet`;
      }
      if (!('name' in g) || typeof g.name !== 'string' || !g.name.trim()) {
        return `section[${secIndex}].fields[${fldIndex}].group.name manquant`;
      }
      if (!Array.isArray(fd.fields) || fd.fields.length === 0) {
        return `section[${secIndex}].fields[${fldIndex}].fields doit être un tableau non vide`;
      }
      // valider récursivement les champs internes (pas de groupes imbriqués)
      for (let k = 0; k < fd.fields.length; k++) {
        const inner = fd.fields[k];
        if (!inner || typeof inner !== 'object') {
          return `section[${secIndex}].fields[${fldIndex}].fields[${k}] non objet`;
        }
        if ('group' in inner) {
          return `section[${secIndex}].fields[${fldIndex}].fields[${k}] : groupes imbriqués non supportés`;
        }
        const r = validateField(inner, secIndex, `${fldIndex}.${k}`);
        if (r) return r;
      }
      return null;
    }

    // --- Cas "champ simple" ---
    if (fd == null || typeof fd !== 'object') return `section[${secIndex}].fields[${fldIndex}] non objet`;
    if (!('name' in fd) || typeof fd.name !== 'string' || !fd.name.trim()) return `section[${secIndex}].fields[${fldIndex}].name manquant`;
    if (!('type' in fd) || typeof fd.type !== 'string') return `section[${secIndex}].fields[${fldIndex}].type manquant`;
    if (fd.type === 'radio' || fd.type === 'select'){
      if (!Array.isArray(fd.options) || fd.options.length === 0) return `section[${secIndex}].fields[${fldIndex}].options requis pour ${fd.type}`;
    }
    return null;
  }

   // Renvoie les clés effectivement écrites dans ROW pour une section NON répétable
function collectRowKeysForNonRepeatableSection(section) {
  const keys = new Set();
  const groupNamesInSection = new Set(); // pour détecter deux groupes au même nom (collision de __grp__)

  (section.fields || []).forEach(entry => {
    if (entry && entry.group && Array.isArray(entry.fields)) {
      const g = entry.group;
      if (g.repeatable) {
        // clé de conteneur du groupe répété
        const GKEY = `__grp__${g.name}`;
        if (groupNamesInSection.has(g.name)) {
          keys.add(`__DUP_GRP__${GKEY}`); // marqueur pour signaler duplicata de groupe dans la section
        }
        groupNamesInSection.add(g.name);
        keys.add(GKEY);
      } else {
        // groupe simple : ses sous-champs sont écrits directement dans ROW
        for (const sf of entry.fields) {
          if (!sf) continue;
          keys.add(sf.name);
        }
      }
    } else if (entry) {
      // champ simple ou répétable : écrit dans ROW[entry.name]
      keys.add(entry.name);
    }
  });

  return keys;
}

// Vrai si le nom de champ est réservé (entrerait en conflit avec __grp__)
function isReservedFieldName(name) {
  return typeof name === 'string' && /^__grp__/.test(name);
}

function validateTemplate(tpl){
  // Helpers locaux (pas de pollution globale)
  const isReservedFieldName = (name) => typeof name === 'string' && /^__grp__/.test(name);

  const eachField = (section, fn) => {
    for (const e of (section.fields || [])) {
      if (e && e.group && Array.isArray(e.fields)) {
        for (const f of e.fields) fn(f, e.group);
      } else if (e) {
        fn(e, null);
      }
    }
  };

  // Les clés réellement écrites dans ROW pour une section NON répétable
  const collectRowKeysForNonRepeatableSection = (section) => {
    const keys = new Set();
    const groupNamesInSection = new Set(); // pour collision de noms de groupes

    (section.fields || []).forEach(entry => {
      if (entry && entry.group && Array.isArray(entry.fields)) {
        const g = entry.group;
        if (g.repeatable) {
          // clé du container de groupe répété
          const GKEY = `__grp__${g.name}`;
          if (groupNamesInSection.has(g.name)) {
            // on encode un marqueur d'erreur pour signaler le doublon de groupe
            keys.add(`__DUP_GRP__${GKEY}`);
          }
          groupNamesInSection.add(g.name);
          keys.add(GKEY);
        } else {
          // groupe simple : ses sous-champs vont directement dans ROW
          for (const sf of entry.fields) {
            if (!sf) continue;
            keys.add(sf.name);
          }
        }
      } else if (entry) {
        keys.add(entry.name); // champ simple ou répété
      }
    });

    return keys;
  };

  // Vérifs locales à une section (réservés + doublons internes)
  const validateSectionLocal = (section, sectionTitle) => {
    const seenLocal = new Set();
    const seenGroups = new Set(); // pour groupes répétés au même nom

    for (const e of (section.fields || [])) {
      if (e && e.group && Array.isArray(e.fields)) {
        const g = e.group;

        if (g.repeatable) {
          // collision de noms de groupes répétés -> même __grp__ clé
          if (seenGroups.has(g.name)) {
            return `[${sectionTitle}] Deux groupes répétés portent le même nom "${g.name}" → collision sur "__grp__${g.name}".`;
          }
          seenGroups.add(g.name);
        }

        if (!g.repeatable) {
          for (const sf of e.fields) {
            if (!sf) continue;
            if (isReservedFieldName(sf.name)) {
              return `[${sectionTitle}] Le champ "${sf.name}" utilise le préfixe réservé "__grp__".`;
            }
            if (seenLocal.has(sf.name)) {
              return `[${sectionTitle}] Doublon interne de champ "${sf.name}".`;
            }
            seenLocal.add(sf.name);
          }
        }
      } else if (e) {
        if (isReservedFieldName(e.name)) {
          return `[${sectionTitle}] Le champ "${e.name}" utilise le préfixe réservé "__grp__".`;
        }
        if (seenLocal.has(e.name)) {
          return `[${sectionTitle}] Doublon interne de champ "${e.name}".`;
        }
        seenLocal.add(e.name);
      }
    }
    return null;
  };

  // --- 1) format historique: tableau de sections
  if (isSectionsArray(tpl)) {
    const globalRowKeys = new Map(); // clé ROW -> { index, title } (pour sections non répétables)

    for (let i=0;i<tpl.length;i++){

      if ('fields' in s && !Array.isArray(s.fields))
        return { valid:false, reason:`section[${i}].fields doit être un tableau` };

      if (Array.isArray(s.fields)){
        for (let j=0;j<s.fields.length;j++){
          const r = validateField(s.fields[j], i, j);
          if (r) return { valid:false, reason:r };
        }
      }

      // Vérifs supplémentaires (réservés + doublons internes)
      const localErr = validateSectionLocal(s, title);
      if (localErr) return { valid:false, reason: localErr };

      // Optionnel : collision de clés entre sections NON répétables
      if (!s?.repeatable) {
        const rowKeys = collectRowKeysForNonRepeatableSection(s);
        for (const k of rowKeys) {
          if (String(k).startsWith('__DUP_GRP__')) {
            const gkey = k.replace('__DUP_GRP__','');
            return { valid:false, reason:`[${title}] Deux groupes partagent le même nom → collision sur "${gkey}".` };
          }
          if (globalRowKeys.has(k)) {
            const prev = globalRowKeys.get(k);
            return {
              valid:false,
              reason: `Clé "${k}" réutilisée entre sections NON répétables : "${prev.title}" (index ${prev.index}) et "${title}" (index ${i}). Renomme un des champs/groupes.`
            };
          }
          globalRowKeys.set(k, { index:i, title });
        }
      }
    }
    return { valid:true, kind:'sections' };
  }

  // --- 2) nouveau format: tableau de processus { name, sections:[...] }
  if (isProcessesArray(tpl)) {
    const globalRowKeys = new Map(); // même garde-fou, côté processes

    for (let p=0;p<tpl.length;p++){
      const proc = tpl[p];
      for (let i=0;i<proc.sections.length;i++){
        const s = proc.sections[i];
        const title = s?.title || `Section ${i+1} (proc ${proc?.name ?? p+1})`;

        if ('fields' in s && !Array.isArray(s.fields))
          return { valid:false, reason:`processus[${p}].sections[${i}].fields doit être un tableau` };

        if (Array.isArray(s.fields)){
          for (let j=0;j<s.fields.length;j++){
            const r = validateField(s.fields[j], `${p}/${i}`, j);
            if (r) return { valid:false, reason:r };
          }
        }

        // Vérifs supplémentaires (réservés + doublons internes)
        const localErr = validateSectionLocal(s, title);
        if (localErr) return { valid:false, reason: localErr };

        // Optionnel : collision de clés entre sections NON répétables
        if (!s?.repeatable) {
          const rowKeys = collectRowKeysForNonRepeatableSection(s);
          for (const k of rowKeys) {
            if (String(k).startsWith('__DUP_GRP__')) {
              const gkey = k.replace('__DUP_GRP__','');
              return { valid:false, reason:`[${title}] Deux groupes partagent le même nom → collision sur "${gkey}".` };
            }
            if (globalRowKeys.has(k)) {
              const prev = globalRowKeys.get(k);
              return {
                valid:false,
                reason: `Clé "${k}" réutilisée entre sections NON répétables : "${prev.title}" (proc ${prev.p}, idx ${prev.i}) et "${title}" (proc ${p}, idx ${i}). Renomme un des champs/groupes.`
              };
            }
            globalRowKeys.set(k, { p, i, title });
          }
        }
      }
    }
    return { valid:true, kind:'processes' };
  }

  return { valid:false, reason:'racine ni "sections[]" ni "processes[]"' };
}

// ===== AUTO-FIX des collisions de clés entre sections NON répétables =====
function autoFixTemplateCollisions(inputTpl){
  // deep clone pour éviter de toucher au JSON d'origine
  const tpl = (typeof structuredClone==='function') ? structuredClone(inputTpl) : deepClone(inputTpl);

  // util: rend "base", "base_2", "base_3", ... qui n’existe pas encore
  const nextFree = (base, taken) => {
    let b = String(base || '').trim();
    if (!b) b = 'field';
    if (!taken.has(b)) return b;
    let i = 2;
    while (taken.has(`${b}_${i}`)) i++;
    return `${b}_${i}`;
  };

  // renomme un champ simple OU un groupe (repeatable=false) dans une section
  const renameEntry = (section, entry, newName) => {
    if (entry && entry.group && Array.isArray(entry.fields)) {
      // groupe
      entry.group.name = newName;
    } else if (entry) {
      // champ simple / repeatable
      entry.name = newName;
    }
  };

  // fabrique l’index des clés "ROW" pour une section non répétable
  const rowKeysOf = (section) => collectRowKeysForNonRepeatableSection(section);

  const applyOnSections = (sections, procLabel = '', globalRowKeys) => {
    const changes = [];

    sections.forEach((section, sidx) => {
      if (section?.repeatable) return;

      // on garde un snapshot de ce qui sera écrit
      const rowKeys = rowKeysOf(section);
      const localTaken = new Set(rowKeys); // pour calculer les nouveaux noms dans cette section

      // Passe 1: éviter les noms réservés "__grp__" dans les champs simples
      (section.fields || []).forEach((e) => {
        if (!e) return;
        if (e.group && Array.isArray(e.fields)) {
          // si groupe non répétable: ses sous-champs sont des clés directes,
          // ils sont déjà pris en compte via rowKeysOf()
          if (!e.group.repeatable && /^__grp__/.test(e.group.name)) {
            const old = e.group.name;
            const base = old.replace(/^__grp__+/, 'grp_');
            const nn = nextFree(base, localTaken);
            e.group.name = nn;
            localTaken.add(`__grp__${nn}`); 
            changes.push({ kind:'group', from: old, to: nn, section: section.title, proc: procLabel });
          }
        } else if (e && isReservedFieldName(e.name)) {
          const old = e.name;
          const base = old.replace(/^__grp__+/, 'fld_');
          const nn = nextFree(base, localTaken);
          e.name = nn;
          localTaken.add(nn);
          changes.push({ kind:'field', from: old, to: nn, section: section.title, proc: procLabel });
        }
      });

      // Recalcule après corrections "réservés"
      let updatedRowKeys = rowKeysOf(section);

      // Passe 2: collisions locales (même section)
      const seenLocal = new Set();
      (section.fields || []).forEach((entry) => {
        if (!entry) return;
        if (entry.group && Array.isArray(entry.fields)) {
          const g = entry.group;
          if (g.repeatable) {
            const GKEY = `__grp__${g.name}`;
            if (seenLocal.has(GKEY)) {
              const old = g.name;
              const nn = nextFree(`${g.name}`, new Set(
                [...updatedRowKeys].map(k=>String(k).replace(/^__grp__/, '')) // éviter collision de conteneur
              ));
              renameEntry(section, entry, nn);
              changes.push({ kind:'group', from: old, to: nn, section: section.title, proc: procLabel });
            }
          } else {
            // sous-champs déjà couverts par updatedRowKeys
          }
        } else {
          const k = entry.name;
          if (seenLocal.has(k)) {
            const old = k;
            const nn  = nextFree(k, updatedRowKeys);
            renameEntry(section, entry, nn);
            changes.push({ kind:'field', from: old, to: nn, section: section.title, proc: procLabel });
          }
        }
        // marquer toutes les clés "ROW" courantes
        const now = rowKeysOf(section);
        updatedRowKeys = now;
        now.forEach(k => seenLocal.add(k));
      });

      // Passe 3: collisions globales (entre sections non répétables)
      const finalRowKeys = rowKeysOf(section);
      finalRowKeys.forEach((k) => {
        if (String(k).startsWith('__DUP_GRP__')) return; // déjà traité via renommage ci-dessus
        if (!globalRowKeys.has(k)) return;
        // il y a collision globale -> renommer le champ/groupe source dans cette section
        // On retrouve l'entrée à l’origine de "k"
        (section.fields || []).forEach((entry) => {
          if (!entry) return;
          if (entry.group && Array.isArray(entry.fields)) {
            const g = entry.group;
            if (g.repeatable) {
              const GKEY = `__grp__${g.name}`;
              if (GKEY === k) {
                const old = g.name;
                const nn = nextFree(`${g.name}`, new Set([...globalRowKeys].map(x => String(x).replace(/^__grp__/, ''))));
                renameEntry(section, entry, nn);
                changes.push({ kind:'group', from: old, to: nn, section: section.title, proc: procLabel });
              }
            } else {
              // sous-champs: si conflit, c’est le sous-champ qui portait la clé
              for (const sf of entry.fields) {
                if (sf && sf.name === k) {
                  const old = sf.name;
                  const nn  = nextFree(sf.name, new Set(globalRowKeys));
                  sf.name = nn;
                  changes.push({ kind:'field', from: old, to: nn, section: section.title, proc: procLabel });
                }
              }
            }
          } else if (entry && entry.name === k) {
            const old = entry.name;
            const nn  = nextFree(entry.name, new Set(globalRowKeys));
            entry.name = nn;
            changes.push({ kind:'field', from: old, to: nn, section: section.title, proc: procLabel });
          }
        });
      });

      // mettre à jour le set global (avec les clés finales de la section)
      rowKeysOf(section).forEach(k => {
        if (!String(k).startsWith('__DUP_GRP__')) globalRowKeys.add(k);
      });
    });

    return changes;
  };

  const changesAll = [];

  // 1) format historique: sections[]
  if (Array.isArray(tpl) && tpl.every(s => s && typeof s==='object' && Array.isArray(s.fields))) {
    const globalAll = new Set();
    changesAll.push(...applyOnSections(tpl, 'mono', globalAll));
    return { fixed: tpl, changes: changesAll };
  }

  // 2) format processes[]
  if (Array.isArray(tpl) && tpl.every(p => p && typeof p==='object' && Array.isArray(p.sections))) {
    const globalAll = new Set(); // partagé entre TOUS les process importés
    tpl.forEach((proc, idx) => {
      changesAll.push(...applyOnSections(proc.sections, proc.name || `proc ${idx+1}`, globalAll));
    });
    return { fixed: tpl, changes: changesAll };
  }

  // autre forme: on renvoie tel quel
  return { fixed: tpl, changes: changesAll };
}


function setTemplate(newTemplate){
  const ok = validateTemplate(newTemplate);
  if (!ok.valid) throw new Error('Processus invalide : ' + ok.reason);

  if (ok.kind === 'sections') {
    PROCESSES = null;                              // mode historique
    TEMPLATE  = (typeof structuredClone === 'function')
      ? structuredClone(newTemplate)
      : deepClone(newTemplate);                    // ✅ deep clone
    TEMPLATE_FIELD_DEFS = TEMPLATE.flatMap(sec => sec.fields || []);

    // NEW: en mode "sections" mono-process, taguer les sections avec un procKey "mono"
    (TEMPLATE || []).forEach((s, sidx) => {
      try {
        Object.defineProperty(s, '__procKey', { value: 'mono', enumerable: false });
        Object.defineProperty(s, '__procIdx', { value: 0, enumerable: false });
        Object.defineProperty(s, '__secIdx',   { value: sidx, enumerable: false });
      } catch {}
    });

  } else { // kind === 'processes'
    const cloneTpl = (typeof structuredClone === 'function')
      ? structuredClone(newTemplate)
      : deepClone(newTemplate);                    // ✅ deep clone

    PROCESSES = cloneTpl;

    // NEW: annoter TOUTES les sections de TOUS les processus avec une clé de process stable
    (PROCESSES || []).forEach((proc, pidx) => {
      const pk = `${(proc?.name ? slug(proc.name) : 'process')}-${pidx+1}`;
      (proc.sections || []).forEach((s, sidx) => {
        try {
          Object.defineProperty(s, '__procKey', { value: pk, enumerable: false });
          Object.defineProperty(s, '__procIdx', { value: pidx, enumerable: false });
          Object.defineProperty(s, '__secIdx',   { value: sidx, enumerable: false });
        } catch {}
      });
    });

    // Expose la 1re colonne sans lien de référence :
    TEMPLATE  = (typeof structuredClone === 'function')
      ? structuredClone(PROCESSES[0]?.sections || [])
      : deepClone(PROCESSES[0]?.sections || []);   // ✅ deep clone

    // NEW: annoter aussi la copie "TEMPLATE" (utile si certaines vues utilisent TEMPLATE directement)
    (TEMPLATE || []).forEach((s, sidx) => {
      try {
        Object.defineProperty(s, '__procKey', { value: `${(PROCESSES[0]?.name ? slug(PROCESSES[0].name) : 'process')}-1`, enumerable: false });
        Object.defineProperty(s, '__procIdx', { value: 0, enumerable: false });
        Object.defineProperty(s, '__secIdx',   { value: sidx, enumerable: false });
      } catch {}
    });

    // flat defs = concat de tous les champs de tous les processus
    TEMPLATE_FIELD_DEFS = PROCESSES.flatMap(pr => (pr.sections||[]).flatMap(s => s.fields || []));
  }

  resetSectionKeyCache();
  clampPage();

  (async () => {
    try {
      try { localStorage.removeItem('customTemplateJSON'); } catch {}
      const key = App.crypto?.currentKey;
      if (key && App.crypto?.aesEncryptJson && App.storage?.put) {
        const payload = PROCESSES || TEMPLATE;
        const envelope = await App.crypto.aesEncryptJson(key, payload);
        await App.storage.put('ui', { id: 'customTemplate', value: envelope });
      } else {
        localStorage.setItem('customTemplateJSON', JSON.stringify(PROCESSES || TEMPLATE));
      }
    } catch {}
  })();

  try { App.uiList?.showToast?.('Processus chargé.', 2000, 'success'); } catch(_){}
  try { App.uiList?.renderList?.(); } catch(_){}
  if (App.state?.currentAnalyse) {
    try { App.form?.renderForm?.(); App.files?.scanCurrentAnalyse?.(); } catch(_){}
    try { if (App.preview?.isOpen) App.preview?.renderPreview?.(); } catch(_){}
  } else {
    try { App.uiList?.updatePlaceholder?.(); } catch(_){}
  }
}

  /* =========================
     DOM HELPERS
     ========================= */
  const $ = (sel,root=document)=>root.querySelector(sel);
  const el = (tag, attrs={}, opts={})=>{
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs||{})){
      if (k === 'class') { n.className = v; continue; }
      if (k.startsWith('on') && typeof v === 'function') { n.addEventListener(k.slice(2), v); continue; }
      if (typeof v === 'boolean') { if (v) n.setAttribute(k,''); continue; }
      if (v !== undefined && v !== null) n.setAttribute(k, v);
    }
    (opts.children||[]).forEach(c => n.append(c));
    return n;
  };

  /* =========================
     DATES / TEXT HELPERS
     ========================= */
  const todayISO = ()=>{
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`; // date locale (pas UTC)
  };

  const _stripCombining = s => s.replace(/[\u0300-\u036f]/g,'');
  const slug = s => {
    s = String(s ?? '');
    try { s = s.normalize('NFKD'); } catch {}
    s = _stripCombining(s)
      .replace(/[^a-z0-9]+/ig,'-')
      .replace(/(^-|-$)/g,'')
      .toLowerCase();
    return s;
  };

  const xmlEscape = s => String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&apos;');

  // YYYY-MM-DD strict
  function parseDateStrict(raw) {
    const s = String(raw || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    const [y, m, d] = s.split('-').map(n => parseInt(n, 10));
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCFullYear() !== y || (dt.getUTCMonth()+1) !== m || dt.getUTCDate() !== d) return null;
    return s;
  }

  /* =========================
     SECTION KEYS & MIGRATION
     ========================= */
  let SECTION_KEY_CACHE = new WeakMap();

  function sectionKeyOf(section, sidx){
  let k = SECTION_KEY_CACHE.get(section);
  if (k) return k;

  // base locale à la section
  const base = slug(section.title || `section-${(sidx ?? (section.__secIdx ?? 0))+1}`);

  // NEW: préfixe processeur stable ("mono" si mode sections)
  const proc = section.__procKey || 'mono';

  k = `${proc}__${base}--${(sidx ?? (section.__secIdx ?? 0))+1}`;
  SECTION_KEY_CACHE.set(section, k);
  return k;
}


// 🔒 Version sécurisée : ne retourne que des clés non ambiguës
function legacySectionKeyCandidates(section, sidx){
  const t  = section.title || `section-${sidx+1}`;
  const dash = slug(t);
  const explicit = section.key;
  const old = `${dash}--${sidx+1}`;
  return [explicit, old].filter(Boolean);
}


  function ensureSectionKey(project, section, sidx){
    const primary = sectionKeyOf(section, sidx);
    const cands = legacySectionKeyCandidates(section, sidx);
    if (project && project.data){
      for (const k of cands){
        if (k && k !== primary && project.data[k] !== undefined){
          project.data[primary] = project.data[k];
          delete project.data[k];
        }
      }
    }
    return primary;
  }

  function readSectionArray(project, section, sidx){
    const primary = sectionKeyOf(section, sidx);
    const cands = legacySectionKeyCandidates(section, sidx);
    for (const k of [primary, ...cands]){
      const v = project?.data?.[k];
      if (Array.isArray(v)) return v;
    }
    return [];
  }

  function resetSectionKeyCache(){ SECTION_KEY_CACHE = new WeakMap(); }

  /* =========================
     “MISSING” / PROGRESSION
     ========================= */
  function isFilled(fieldDef, val){
    switch(fieldDef?.type){
      case 'checkbox': return val === true;
      case 'number':   return val !== '' && val !== null && val !== undefined && !Number.isNaN(Number(val));
      case 'file':     return typeof val === 'string' && val.trim().length>0;
      case 'date':     return !!parseDateStrict(val);
      default:
        return (typeof val === 'string') ? val.trim().length>0 : (val !== null && val !== undefined);
    }
  }
  function fieldIsMissingSimple(fieldDef, value){
    return !isFilled(fieldDef, value);
  }
  function normMissing(fieldDef, value){
    if (fieldDef.type === 'date')     return parseDateStrict(value) ? value : '';
    if (fieldDef.type === 'checkbox') return !!value;
    return value == null ? '' : value;
  }

  /* =========================

  let SHOW_MISSING_ONLY = false;
  let CURRENT_PAGE = 0; // 0 = En-tête, 1..N = sections

  function totalPages(){ return 1 + (TEMPLATE ? TEMPLATE.length : 0); }
  function clampPage(){
    const tp = totalPages();
    if (!tp) { CURRENT_PAGE = 0; return; }
    CURRENT_PAGE = Math.max(0, Math.min(CURRENT_PAGE, tp - 1));
  }
  function gotoPage(i){
    CURRENT_PAGE = i|0;
    clampPage();
    if (App.state?.currentAnalyse?.id != null) {
      App.helpers?.savePageFor?.(App.state.currentAnalyse.id, CURRENT_PAGE);
    }
    App.form?.renderForm?.();
    App.files?.scanCurrentAnalyse?.();
  }
  function pageTitleOf(idx){
    if (idx === 0) return 'En-tête';
    const sec = TEMPLATE?.[idx-1];
    return sec?.title || `Section ${idx}`;
  }

  function renderPager(host, opts = {}){
    const isLocal = !!opts.local;

    const getCur = isLocal
      ? (typeof opts.currentPage === 'function' ? opts.currentPage : (()=>0))
      : (() => (typeof CURRENT_PAGE === 'number' ? CURRENT_PAGE : 0));

    const getTP  = isLocal
      ? (typeof opts.totalPages === 'function' ? opts.totalPages : (()=>1))
      : (typeof totalPages === 'function' ? totalPages : (()=>1));

    const goTo   = isLocal
      ? (typeof opts.goto === 'function' ? opts.goto : (()=>{}))
      : (typeof gotoPage === 'function' ? gotoPage : (()=>{}));

    if (!isLocal){ if (typeof clampPage === 'function') clampPage(); }

    const tp = getTP();
    if (tp <= 1) return;
    const cur = getCur();
    const last = (cur === tp - 1);

    const bar = el('div', {
      class: `pager ${isLocal ? 'local prevnext' : 'global prevnext'}`,
      role:'navigation',
      'aria-label': isLocal ? 'Pagination du processus' : 'Pagination du formulaire'
    });

    const mkBtn = (label, goto, disabled, aria, extraClass='') => {
      const b = el('button', { class:`btn sm ${extraClass}`, type:'button', disabled:!!disabled });
      b.textContent = label;
      if (aria) b.setAttribute('aria-label', aria);
      if (!disabled) b.addEventListener('click', ()=>{
        goTo(goto);
        if (!isLocal) { if (typeof clampPage==='function') clampPage(); App.form?.renderForm?.(); }
      });
      return b;
    };

    const prev = mkBtn('← Précédent', Math.max(0, cur - 1), cur<=0, 'Page précédente');
    const next = mkBtn(last ? 'Terminer' : 'Suivant →',
                       Math.min(tp - 1, cur + 1), false, 'Page suivante',
                       'primary');

    if (last){
      next.onclick = ()=>{
        if (isLocal) { typeof opts.onFinish === 'function' && opts.onFinish(); return; }
        try { App.uiList?.showToast?.('🎉 Félicitations, en route vers la commission d\'homologation !', 6000, 'success'); }
        catch(_) { alert('Félicitations, en route vers la commission d\'homologation'); }
        App.uiList?.closeDetail?.();
        const list = document.getElementById('projectList');
        list?.querySelectorAll('.item.selected')?.forEach(n => n.classList.remove('selected'));
        App.uiList?.updateSearchVisibility?.();
      };
    }

    if (isLocal){
      bar.append(prev, next);
    } else {
      const center = el('div', { class:'pager-center' }, {
        children:[ el('span', { class:'pager-count muted', 'aria-live':'polite' }, { children:[ `(${cur+1}/${tp})` ] }) ]
      });
      const left  = el('div', { class:'pager-left'  }, { children:[prev] });
      const right = el('div', { class:'pager-right' }, { children:[next] });
      bar.append(left, center, right);
    }

    host.append(bar);
  }

  function updateMissingButton(){

  // ⬇️ ICI : getter PROCESSES avec ré-annotation des sections clonées
  get PROCESSES(){

      ? structuredClone(PROCESSES)
      : deepClone(PROCESSES);                                 // 🔒 lecture seule

    // Ré-annoter les sections du clone pour éviter les collisions de clés
    (clone || []).forEach((proc, pidx) => {
      const pk = `${(proc?.name ? slug(proc.name) : 'process')}-${pidx+1}`;
      (proc.sections || []).forEach((s, sidx) => {
        try {
          Object.defineProperty(s, '__procKey', { value: pk,   enumerable: false });
          Object.defineProperty(s, '__procIdx', { value: pidx, enumerable: false });
          Object.defineProperty(s, '__secIdx',  { value: sidx, enumerable: false });
        } catch {}
      });
    });

    return clone;
  },

  setTemplate,
  validateTemplate,
  sectionKeyOf,
  legacySectionKeyCandidates,
  ensureSectionKey,
  readSectionArray,
  resetSectionKeyCache,
  autoFixTemplateCollisions,
  get TEMPLATE_FIELD_DEFS(){ 
    return (typeof structuredClone === 'function') 
      ? structuredClone(TEMPLATE_FIELD_DEFS) 
      : deepClone(TEMPLATE_FIELD_DEFS);                        // 🔒 optionnel mais sûr
  }
};

  App.util = {
    $, el, todayISO, slug, xmlEscape, parseDateStrict,
    getRawForData, setRawForData, getRawHeader, setRawHeader,
    isFilled, fieldIsMissingSimple, normMissing,

    gotoPage, clampPage, pageTitleOf, totalPages
  };
  App.util.getCA = function getCA(){ return App.state?.currentAnalyse || null; };

  // --- Rafraîchissement d'UI "safe" (ne fait rien si le projet est fermé)
  App.util.safeUIRefresh = function safeUIRefresh(){
    const CA = App.util.getCA();

  App._ready = App._ready || {};
  App._ready.model = true;
})();
